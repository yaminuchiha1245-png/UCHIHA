name: Game Zone Admin V5 Postdeploy Verify

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-admin-v5-postdeploy-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST"; test -n "$VPS_KEY_B64"; PORT="${PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/uchiha_vps
          chmod 600 ~/.ssh/uchiha_vps
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify live V5 assets and one Telegram poller
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"; USER="${USER:-root}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/uchiha_vps -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ENV_FILE=/etc/uchiha/secrets/game-zone.env
          TARGET=/opt/uchiha/projects/game-zone
          DOMAIN="$(awk -F= '$1=="DOMAIN"{print substr($0,index($0,"=")+1); exit}' "$ENV_FILE")"
          test -n "$DOMAIN"
          test "$(cat "$TARGET/.deployed-commit")" = "ca85e1b649623d466934cfb5cd68f7945f6493b6"
          grep -F './v5.css?v=500' "$TARGET/admin/index.html" >/dev/null
          grep -F './v5.js?v=500' "$TARGET/admin/index.html" >/dev/null
          grep -F 'single mobile shell' "$TARGET/admin/v5.css" >/dev/null
          grep -F 'consolidate legacy mobile shells' "$TARGET/admin/v5.js" >/dev/null
          curl -fsS --max-time 12 "https://$DOMAIN/admin/" | grep -F './v5.css?v=500' >/dev/null
          curl -fsS --max-time 12 "https://$DOMAIN/admin/" | grep -F './v5.js?v=500' >/dev/null
          curl -fsS --max-time 12 "https://$DOMAIN/admin/v5.css?v=500" | grep -F 'GAME_ZONE_ADMIN_UI_V5' >/dev/null
          curl -fsS --max-time 12 "https://$DOMAIN/admin/v5.js?v=500" | grep -F 'GAME_ZONE_ADMIN_UI_V5' >/dev/null

          cd "$TARGET/deploy"
          ln -sfn "$ENV_FILE" .env.production
          cid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q bot)"
          test -n "$cid"
          test "$(docker inspect -f '{{.State.Status}}' "$cid")" = running
          r0="$(docker inspect -f '{{.RestartCount}}' "$cid")"; sleep 8; r1="$(docker inspect -f '{{.RestartCount}}' "$cid")"; test "$r0" = "$r1"
          token_hash="$(docker exec "$cid" sh -lc 'printf %s "$BOT_TOKEN" | sha256sum | cut -d" " -f1')"
          matching=0
          for other in $(docker ps -q --filter label=com.docker.compose.service=bot); do
            h="$(docker exec "$other" sh -lc 'printf %s "$BOT_TOKEN" | sha256sum | cut -d" " -f1' 2>/dev/null || true)"
            [ "$h" = "$token_hash" ] && matching=$((matching+1))
          done
          test "$matching" = 1
          docker exec "$cid" node -e 'fetch("https://api.telegram.org/bot"+process.env.BOT_TOKEN+"/getMe").then(r=>r.json()).then(x=>{if(!x.ok||x.result?.username!=="gamezone1store_bot")process.exit(2)}).catch(()=>process.exit(3))'
          logs="$(docker logs --since 120s "$cid" 2>&1 || true)"
          ! printf '%s' "$logs" | grep -qiE '409 Conflict|terminated by other getUpdates request'
          echo 'ADMIN_V5_LIVE=PASS'
          echo 'MATCHING_POLLERS_RUNNING=1'
          echo 'BOT_POLLING_CONFLICT=NONE'
          echo 'GAME_ZONE_ADMIN_V5_POSTDEPLOY=PASS'
          REMOTE
