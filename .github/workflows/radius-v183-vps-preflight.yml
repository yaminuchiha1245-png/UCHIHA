name: V1-83 read-only production preflight
on:
  push:
    branches:
      - radius-v183/vps-preflight-20260926
    paths:
      - .github/workflows/radius-v183-vps-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radius-v183-vps-preflight
  cancel-in-progress: false

jobs:
  read-only-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: UCHIHA VPS NEW
    env:
      VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.UCHIHA_VPS_USER || secrets.VPS_USER }}
      VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
      VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.UCHIHA_VPS_PORT || secrets.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radius-v183/release-reconciled-20260926
          persist-credentials: false
      - name: Require authorized VPS secrets and pinned host key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_KEY_B64" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "VPS access or pinned host-key secret unavailable. No deployment attempted."
            exit 2
          fi
          [[ "${VPS_PORT:-22}" =~ ^[0-9]{2,5}$ ]]
          install -d -m 0700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
      - name: Check public V1-83 web response (GET only)
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' https://radius.uchiha-builder.com/v183/)"
          echo "Public V1-83 HTTP status: $status"
          test "$status" = 200
      - name: Inventory relevant worktrees and compare bot files without edits
        shell: bash
        run: |
          set -euo pipefail
          echo "Expected reconciled candidate Git commit: $(git rev-parse HEAD)"
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for root in \
            /opt/uchiha-radius/worktrees/provider-v1-83-audit \
            /opt/uchiha-radius/worktrees/ui-simplify-v183 \
            /opt/uchiha-radius/worktrees/mikrotik-core-v183 \
            /opt/uchiha-radius/worktrees/radius-v183-integration-20260926 \
            /opt/uchiha-radius/worktrees/radius-v183-ui-bot-release-20260926; do
            present=no
            for checkout in "$root" "$root/radius-v183"; do
              if git -C "$checkout" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                echo "WORKTREE: $checkout"
                echo "  branch: $(git -C "$checkout" branch --show-current)"
                echo "  commit: $(git -C "$checkout" rev-parse HEAD)"
                echo "  tree: $(git -C "$checkout" rev-parse HEAD^{tree})"
                echo "  tracked changes: $(git -C "$checkout" status --porcelain --untracked-files=no | wc -l)"
                echo "  untracked entries: $(git -C "$checkout" ls-files --others --exclude-standard | wc -l)"
                echo "  modified project source files (names only):"
                git -C "$checkout" diff --name-only -- radius-v183/apps radius-v183/infra radius-v183/scripts | head -25
                present=yes
                break
              fi
            done
            if test "$present" = no; then echo "WORKTREE UNAVAILABLE: $root"; fi
          done
          echo "Active production static index digest:"
          if test -f /opt/uchiha-radius/v183-stage/index.html; then
            sha256sum /opt/uchiha-radius/v183-stage/index.html
          else echo "STATIC INDEX ABSENT"; fi
          echo "Production bot installed component names (no secrets):"
          for name in v183_bot.py v183_screens.py v183_member_routers.py v183_member_workflows.py assets/profile-default.png; do
            if test -f "/opt/uchiha-radius/telegram-v183/$name" && ! test -L "/opt/uchiha-radius/telegram-v183/$name"; then
              echo "$name: present"
            else echo "$name: missing-or-symlinked"; fi
          done
          REMOTE
          echo "Comparing expected reconciled Telegram release files to active server files:"
          for name in v183_bot.py v183_screens.py v183_member_routers.py v183_member_workflows.py assets/profile-default.png; do
            source="radius-v183/apps/telegram-bot/$name"
            expected="$(sha256sum "$source" | cut -d' ' -f1)"
            actual="$(ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "test -f '/opt/uchiha-radius/telegram-v183/$name' && ! test -L '/opt/uchiha-radius/telegram-v183/$name' && sha256sum '/opt/uchiha-radius/telegram-v183/$name'" | cut -d' ' -f1)" || actual=""
            if test "$expected" = "$actual"; then echo "PARITY $name: match"; else echo "PARITY $name: drift-or-missing"; fi
          done
      - name: Read-only database, backup-media and RADIUS commissioning inventory
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "Storage free in /opt (KiB):"
          df -Pk /opt | awk 'NR==2{print $4}'
          echo "Host available RAM (MiB):"
          free -m | awk '/^Mem:/{print $7}'
          echo "Exact V1-83 database size and migration metadata (no customer rows):"
          docker exec --user postgres uchiha-radius-v183-db psql -X -A -t -v ON_ERROR_STOP=1 -U postgres -d uchiha_radius_v183 -c "SELECT 'db_bytes='||pg_database_size(current_database()) UNION ALL SELECT 'migration_count='||COUNT(*)::TEXT FROM schema_migrations UNION ALL SELECT 'subscriber_profile_table='||(to_regclass('public.subscriber_access_profiles') IS NOT NULL)::TEXT UNION ALL SELECT 'profile_force_rls='||COALESCE((SELECT relforcerowsecurity::TEXT FROM pg_class WHERE oid=to_regclass('public.subscriber_access_profiles')),'not-installed') UNION ALL SELECT 'router_default='||COALESCE((SELECT pg_get_expr(adbin,adrelid) FROM pg_attrdef JOIN pg_attribute ON attrelid=adrelid AND attnum=adnum WHERE adrelid='public.network_devices'::regclass AND attname='api_port'),'none');"
          echo "Existing pre-release backup file sizes only (bytes; names not logged):"
          find /opt/uchiha-radius/backups -maxdepth 1 -type f -name 'v183-pre-*' -printf '%s\n' 2>/dev/null | sort -rn | head -5 || :
          echo "Installed RADIUS executable and service diagnostics:"
          if command -v freeradius >/dev/null 2>&1; then echo "freeradius executable: yes"; else echo "freeradius executable: no"; fi
          if sudo -n freeradius -XC >/dev/null 2>&1; then echo "FreeRADIUS configuration check: pass"; else echo "FreeRADIUS configuration check: unavailable-or-failed"; fi
          echo "FreeRADIUS service enabled state:"
          systemctl is-enabled freeradius.service || :
          echo "Host UDP port 1812/1813 listeners (presence only):"
          if ss -lunH | awk '$5 ~ /:1812$/ {x=1} END{exit !x}'; then echo "1812 listening"; else echo "1812 no host listener"; fi
          if ss -lunH | awk '$5 ~ /:1813$/ {x=1} END{exit !x}'; then echo "1813 listening"; else echo "1813 no host listener"; fi
          echo "Read-only release prerequisites inspected; nothing restarted or migrated."
          REMOTE
      - name: Inspect exact V1-83 VPS project read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${VPS_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          project=/opt/uchiha-radius/worktrees/provider-v1-83-audit
          app="$project/radius-v183"
          site=/opt/uchiha-radius/v183-stage
          bot=/opt/uchiha-radius/telegram-v183
          test -d "$app/apps/api" && test -s "$site/index.html"
          test -s "$bot/v183_bot.py"
          echo "UCHIHA V1-83 project and active static/bot paths: available"
          echo "Git worktree HEAD:"
          git -C "$project" rev-parse HEAD
          echo "Tracked uncommitted files (count only):"
          git -C "$project" status --porcelain | wc -l
          echo "Current API and Telegram service states:"
          systemctl is-active uchiha-radius-v183-staging.service uchiha-radius-telegram-bot.service
          echo "FreeRADIUS state (for diagnostic only):"
          systemctl is-active freeradius.service || :
          echo "Database backup/restore tools available:"
          for cmd in pg_dump pg_restore psql docker; do
            if command -v "$cmd" >/dev/null; then echo "$cmd: available"; else echo "$cmd: absent"; fi
          done
          echo "V1-83 environment readable by deploy identity:"
          test -r /etc/uchiha-radius/v183-staging.env && echo yes || echo no
          echo "Password-free elevated access:"
          if sudo -n true 2>/dev/null; then echo available; else echo unavailable; fi
          echo "Public-site entry SHA256:"
          sha256sum "$site/index.html"
          echo "V1-83 service WorkingDirectory paths (no environment values):"
          systemctl cat uchiha-radius-v183-staging.service | grep '^WorkingDirectory=' || :
          systemctl cat uchiha-radius-telegram-bot.service | grep '^WorkingDirectory=' || :
          echo "Production database configuration: required variable names only:"
          grep -E '^(DATABASE_URL|BACKUP_DATABASE_URL|MIGRATION_DATABASE_URL|PLATFORM_DATABASE_URL|RESTORE_DATABASE_URL|BACKUP_DIRECTORY)=' /etc/uchiha-radius/v183-staging.env | cut -d= -f1 | sed 's/^/configured: /'
          echo "Node 24 installed:"
          test -x /opt/uchiha-radius/runtime/node24/package/bin/node && echo yes || echo no
          echo "PostgreSQL 16 Docker image cached:"
          docker image inspect postgres:16-alpine >/dev/null 2>&1 && echo yes || echo no
          echo "File-backed release backups available:"
          find /opt/uchiha-radius/backups -maxdepth 1 -name 'v183-pre-*' -type f -printf 'verified-backup-present\n' 2>/dev/null | head -2
          echo "PostgreSQL container names and images (no environment values):"
          docker ps --format '{{.Names}} {{.Image}}' | grep -Ei 'postgres|timescale' || :
          echo "Production DB URL value, endpoint and credentials withheld from logs."
          echo "Existing systemd service paths inspectable; database remains untouched."
          echo "Exact V1-83 database container superuser read-only probe:"
          docker exec --user postgres uchiha-radius-v183-db psql -X -A -t -v ON_ERROR_STOP=1 -U postgres -d uchiha_radius_v183 -c "SELECT current_user, current_database(), COUNT(*) FROM schema_migrations;"
          echo "Database client versions inside the exact V1-83 container:"
          docker exec uchiha-radius-v183-db pg_dump --version
          docker exec uchiha-radius-v183-db pg_restore --version
          echo "Database tenant table exists:"
          docker exec --user postgres uchiha-radius-v183-db psql -X -A -t -v ON_ERROR_STOP=1 -U postgres -d uchiha_radius_v183 -c "SELECT COUNT(*) FROM pg_tables WHERE schemaname='public' AND tablename='tenants';"
          echo "Read-only VPS access confirmed. No customer data or secrets accessed."
          REMOTE
