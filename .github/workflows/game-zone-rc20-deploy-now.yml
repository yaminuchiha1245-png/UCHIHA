name: Game Zone RC20 Deploy Now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/game-zone-rc20-deploy-now.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-zone-rc20-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout staged RC20 transport
        uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
          path: staged
          fetch-depth: 1

      - name: Checkout trusted manifest
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          fetch-depth: 1

      - name: Reconstruct and verify canonical RC20
        id: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle_dir="$GITHUB_WORKSPACE/staged/release-runtime/.bundle"
          expected_manifest="$GITHUB_WORKSPACE/control/ops/game-zone-rc20-runtime.sha256"
          test -d "$bundle_dir"
          test -f "$expected_manifest"

          mapfile -t parts < <(find "$bundle_dir" -type f -name '*.b64' -print | LC_ALL=C sort)
          test "${#parts[@]}" -gt 0
          cat "${parts[@]}" > "$RUNNER_TEMP/game-zone-rc20.b64"

          b64_bytes="$(stat -c%s "$RUNNER_TEMP/game-zone-rc20.b64")"
          b64_sha="$(sha256sum "$RUNNER_TEMP/game-zone-rc20.b64" | awk '{print $1}')"
          echo "transport bytes=$b64_bytes sha=$b64_sha"
          test "$b64_bytes" = "721776"
          test "$b64_sha" = "b499f927398f5311f648bb7c038be5541afe1746895b84d1c86bc454fbbd78d4"

          base64 --decode "$RUNNER_TEMP/game-zone-rc20.b64" > "$RUNNER_TEMP/game-zone-rc20.tar.xz"
          archive_bytes="$(stat -c%s "$RUNNER_TEMP/game-zone-rc20.tar.xz")"
          archive_sha="$(sha256sum "$RUNNER_TEMP/game-zone-rc20.tar.xz" | awk '{print $1}')"
          echo "archive bytes=$archive_bytes sha=$archive_sha"
          test "$archive_bytes" = "541332"
          test "$archive_sha" = "3cd74e15ffb4662ef887a296337894a456cc210613bb0fc317482d525f2a465b"
          xz -t "$RUNNER_TEMP/game-zone-rc20.tar.xz"

          mkdir -p "$RUNNER_TEMP/extracted"
          tar -xJf "$RUNNER_TEMP/game-zone-rc20.tar.xz" -C "$RUNNER_TEMP/extracted"
          compose="$(find "$RUNNER_TEMP/extracted" -type f -path '*/deploy/docker-compose.yml' -print -quit)"
          test -n "$compose"
          root="${compose%/deploy/docker-compose.yml}"

          expected_count="$(wc -l < "$expected_manifest")"
          actual_count="$(find "$root" -type f | wc -l)"
          test "$expected_count" = "163"
          test "$actual_count" = "163"
          cd "$root"
          sha256sum -c "$expected_manifest"
          awk '{sub(/^[^ ]+  /, ""); print}' "$expected_manifest" | LC_ALL=C sort > "$RUNNER_TEMP/expected-files"
          find . -type f -printf '%p\n' | LC_ALL=C sort > "$RUNNER_TEMP/actual-files"
          cmp "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"

          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo 'CANONICAL_RC20=PASS'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run release tests
        shell: bash
        env:
          RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
        run: |
          set -Eeuo pipefail
          test_root="$RUNNER_TEMP/game-zone-tests"
          cp -a "$RUNTIME_ROOT" "$test_root"
          cd "$test_root/server"
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npm test
          npm run smoke
          npm run audit:routes
          node scripts/secret-scan.js
          cd "$test_root/bot"
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          node --check bot.js
          node --check config.js
          cp "$test_root/deploy/.env.production.example" "$test_root/deploy/.env.production"
          docker compose --env-file "$test_root/deploy/.env.production" -f "$test_root/deploy/docker-compose.yml" config -q
          echo 'RELEASE_TESTS=PASS'

      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          SSH_KEY: ${{ secrets.UCHIHA_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST"
          test -n "$SSH_KEY"
          PORT="${PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/uchiha_vps
          chmod 600 ~/.ssh/uchiha_vps
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and deploy RC20
        shell: bash
        env:
          RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"
          USER="${USER:-root}"
          archive="$RUNNER_TEMP/game-zone-rc20-runtime.tar.gz"
          tar -czf "$archive" -C "$RUNTIME_ROOT" .
          scp -q -i ~/.ssh/uchiha_vps -P "$PORT" "$archive" "$USER@$HOST:/tmp/game-zone-rc20-runtime.tar.gz"

          ssh -i ~/.ssh/uchiha_vps -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          TARGET=/opt/uchiha/projects/game-zone
          NEW=/opt/uchiha/projects/.game-zone-new
          PREV=/opt/uchiha/projects/.game-zone-prev
          ENV_FILE=/etc/uchiha/secrets/game-zone.env
          test -s /tmp/game-zone-rc20-runtime.tar.gz
          test -f "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          rm -rf "$NEW"
          mkdir -p "$NEW"
          tar -xzf /tmp/game-zone-rc20-runtime.tar.gz -C "$NEW"
          test -f "$NEW/deploy/docker-compose.yml"
          test -f "$NEW/deploy/preflight.js"
          test -f "$NEW/server/server.js"
          test -f "$NEW/bot/bot.js"

          if command -v node >/dev/null 2>&1; then
            node "$NEW/deploy/preflight.js" "$ENV_FILE"
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$NEW:/app:ro" -v "$ENV_FILE:/secrets.env:ro" node:20-alpine node /app/deploy/preflight.js /secrets.env
          else
            echo 'Neither Node nor Docker is available for production preflight.' >&2
            exit 1
          fi

          if docker compose version >/dev/null 2>&1; then
            COMPOSE='docker compose'
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE='docker-compose'
          else
            echo 'Docker Compose is unavailable on VPS.' >&2
            exit 1
          fi

          rm -rf "$PREV"
          if [ -d "$TARGET" ]; then mv "$TARGET" "$PREV"; fi
          mv "$NEW" "$TARGET"
          ln -sfn "$ENV_FILE" "$TARGET/deploy/.env.production"
          cd "$TARGET/deploy"

          if ! $COMPOSE --env-file .env.production -f docker-compose.yml up -d --build --remove-orphans; then
            echo 'Deployment failed; restoring previous code tree.' >&2
            $COMPOSE --env-file .env.production -f docker-compose.yml down 2>/dev/null || true
            rm -rf "$TARGET"
            if [ -d "$PREV" ]; then
              mv "$PREV" "$TARGET"
              ln -sfn "$ENV_FILE" "$TARGET/deploy/.env.production"
              cd "$TARGET/deploy"
              $COMPOSE --env-file .env.production -f docker-compose.yml up -d --build --remove-orphans || true
            fi
            exit 1
          fi

          ok=0
          for i in $(seq 1 30); do
            DOMAIN="$(awk -F= '$1=="DOMAIN"{print substr($0,index($0,"=")+1); exit}' "$ENV_FILE")"
            if [ -n "$DOMAIN" ] && curl -fsS --max-time 10 "https://$DOMAIN/api/health/ready" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 10
          done

          $COMPOSE --env-file .env.production -f docker-compose.yml ps
          if [ "$ok" -ne 1 ]; then
            echo 'Game Zone did not reach ready HTTPS state in time.' >&2
            exit 1
          fi
          DOMAIN="$(awk -F= '$1=="DOMAIN"{print substr($0,index($0,"=")+1); exit}' "$ENV_FILE")"
          curl -fsSI --max-time 15 "https://$DOMAIN/" >/dev/null
          curl -fsSI --max-time 15 "https://$DOMAIN/admin/" >/dev/null
          curl -fsS --max-time 15 "https://$DOMAIN/api/health/ready" >/dev/null
          rm -rf "$PREV" /tmp/game-zone-rc20-runtime.tar.gz
          echo 'GAME_ZONE_DEPLOYMENT=PASS'
          echo 'GAME_ZONE_HTTPS=READY'
          REMOTE
