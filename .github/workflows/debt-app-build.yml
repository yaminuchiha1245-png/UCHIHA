name: Build Debt App APK

on:
  push:
    branches:
      - debt-app-build
    paths:
      - 'debt-build-parts/**'
      - '.github/workflows/debt-app-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout debt app build branch
        uses: actions/checkout@v4

      - name: Rebuild and verify Android source package
        shell: bash
        run: |
          set -euo pipefail
          cat debt-build-parts/part-*.b64 > debt-app-android-v1.2.zip.b64
          base64 -d debt-app-android-v1.2.zip.b64 > debt-app.zip
          echo 'e375d04c4c0a22e1d7ef1af917330add7fb63f6d00e5f79d7962ca03d5420cec  debt-app.zip' | sha256sum -c -
          mkdir debt-app-android
          unzip -q debt-app.zip -d debt-app-android
          test -f debt-app-android/app/build.gradle
          test -f debt-app-android/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        working-directory: debt-app-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          test -f debt-app-android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh debt-app-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum debt-app-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UCHIHA-Debts-v1.2-debug
          path: debt-app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
