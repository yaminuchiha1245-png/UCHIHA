name: Game Zone Admin Owner Readiness V6

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-admin-owner-readiness-v6.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply owner launch readiness dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ops/apply-admin-owner-readiness-v6.py
          node --check admin/admin.js
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/index.html
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/admin.js
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/v5.css
      - name: Commit owner readiness UI
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html admin/admin.js admin/v5.css
          git commit -m 'feat(game-zone): add owner launch readiness dashboard' || exit 0
          git push origin HEAD:game-zone/rc20-production
