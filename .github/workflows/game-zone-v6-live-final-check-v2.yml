name: Game Zone V6 Live Final Check V2

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-v6-live-final-check-v2.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST"; test -n "$VPS_KEY_B64"; PORT="${PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/uchiha_vps
          chmod 600 ~/.ssh/uchiha_vps
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts
      - name: Verify live V6, readiness and bot
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"; USER="${USER:-root}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/uchiha_vps -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          TARGET=/opt/uchiha/projects/game-zone
          ENV=/etc/uchiha/secrets/game-zone.env
          cd "$TARGET"
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/index.html
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/admin.js
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/v5.css
          cd deploy
          ln -sfn "$ENV" .env.production
          domain="$(awk -F= '$1=="DOMAIN"{print substr($0,index($0,"=")+1); exit}' .env.production)"
          test -n "$domain"
          html="$(curl -fsS --retry 3 --max-time 15 "https://$domain/admin/")"
          grep -Fq 'جاهزية تشغيل المتجر' <<<"$html"
          server_cid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q server)"
          bot_cid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q bot)"
          test -n "$server_cid"; test -n "$bot_cid"
          test "$(docker inspect -f '{{.State.Status}}' "$server_cid")" = running
          test "$(docker inspect -f '{{.State.Status}}' "$bot_cid")" = running
          docker exec "$server_cid" node -e 'const b="http://127.0.0.1:3000";(async()=>{const l=await fetch(b+"/api/admin/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:process.env.ADMIN_PASSWORD})});if(!l.ok)process.exit(2);const x=await l.json();if(!x.token)process.exit(3);const r=await fetch(b+"/api/admin/readiness",{headers:{authorization:"Bearer "+x.token}});if(!r.ok)process.exit(4);const d=await r.json();if(!Array.isArray(d.checks)||!d.checks.length)process.exit(5);console.log("READINESS=PASS");console.log("CHECKS="+d.checks.length);console.log("PENDING="+d.checks.filter(c=>!c.ok).length);console.log("READY="+String(!!d.ready))})().catch(()=>process.exit(6))'
          echo "DEPLOYED_SHA=$(cat "$TARGET/.deployed-commit")"
          echo "SERVER_RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$server_cid")"
          echo "BOT_RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$bot_cid")"
          echo 'GAME_ZONE_V6_LIVE_FINAL_CHECK=PASS'
          REMOTE
