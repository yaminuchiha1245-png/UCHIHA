name: Game Zone Owner Readiness Live Check

on:
  push:
    branches:
      - game-zone/rc20-production
    paths:
      - .github/workflows/game-zone-owner-readiness-live-check.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production

      - name: Verify source readiness UI
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/index.html
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/admin.js
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/v5.css
          node --check admin/admin.js
          echo 'OWNER_READINESS_SOURCE=PASS'

      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST"; test -n "$VPS_KEY_B64"; PORT="${PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/uchiha_vps
          chmod 600 ~/.ssh/uchiha_vps
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Read live owner readiness safely
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"; USER="${USER:-root}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/uchiha_vps -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE' | tee /tmp/game-zone-owner-readiness-live.txt
          set -Eeuo pipefail
          TARGET=/opt/uchiha/projects/game-zone
          ENV=/etc/uchiha/secrets/game-zone.env
          cd "$TARGET"
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/index.html
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/admin.js
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/v5.css
          echo 'OWNER_READINESS_LIVE_UI=PASS'

          cd deploy
          ln -sfn "$ENV" .env.production
          sid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q server)"
          test -n "$sid"
          test "$(docker inspect -f '{{.State.Status}}' "$sid")" = running
          docker exec -i "$sid" node <<'NODE'
          (async()=>{
            const password=process.env.ADMIN_PASSWORD;
            if(!password) throw new Error('admin_password_missing');
            const login=await fetch('http://127.0.0.1:3000/api/admin/login',{
              method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password})
            });
            if(!login.ok) throw new Error('admin_login_failed_'+login.status);
            const auth=await login.json();
            if(!auth.token) throw new Error('admin_token_missing');
            const r=await fetch('http://127.0.0.1:3000/api/admin/readiness',{headers:{authorization:'Bearer '+auth.token}});
            if(!r.ok) throw new Error('readiness_failed_'+r.status);
            const data=await r.json();
            const checks=Array.isArray(data.checks)?data.checks:[];
            const passed=checks.filter(x=>x.ok).length;
            const failed=checks.filter(x=>!x.ok);
            console.log('OWNER_READINESS_API=PASS');
            console.log('OWNER_READINESS_READY='+String(!!data.ready).toUpperCase());
            console.log('OWNER_READINESS_PASSED='+passed+'/'+checks.length);
            for(const x of checks){
              const id=String(x.id||'unknown').replace(/[^A-Za-z0-9_.:-]/g,'_');
              const detail=String(x.detail||'').replace(/[\r\n]+/g,' ').slice(0,180);
              console.log('CHECK|'+id+'|'+(x.ok?'PASS':'NEEDS_OWNER')+'|'+detail);
            }
            console.log('OWNER_ACTION_COUNT='+failed.length);
          })().catch(e=>{console.error('READINESS_VERIFY_FAILED='+String(e.message||e));process.exit(1)});
          NODE
          echo "DEPLOYED_SHA=$(cat "$TARGET/.deployed-commit")"
          REMOTE

      - name: Record sanitized readiness status
        shell: bash
        run: |
          set -Eeuo pipefail
          cp /tmp/game-zone-owner-readiness-live.txt ops/game-zone-owner-readiness-live.txt
          printf 'verified_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> ops/game-zone-owner-readiness-live.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/game-zone-owner-readiness-live.txt
          git commit -m 'ops(game-zone): record owner readiness status' || exit 0
          git push origin HEAD:game-zone/rc20-production
