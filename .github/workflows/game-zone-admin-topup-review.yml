name: Game Zone Admin Topup Review

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-admin-topup-review.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
          fetch-depth: 1

      - name: Apply admin topup receipt review
        run: python ops/implement-admin-topup-review.py

      - name: Validate runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check server/server.js
          node --check server/lib/adminTopupView.js
          node --check admin/admin.js
          node --check server/scripts/web-security-audit.js
          cd server
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npm test
          npm run smoke
          npm run audit:routes
          node scripts/web-security-audit.js
          node scripts/secret-scan.js
          node scripts/deploy-security-audit.js

      - name: Commit admin topup review
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js server/lib/adminTopupView.js server/tests/adminTopupView.test.js admin/admin.js server/scripts/web-security-audit.js
          git commit -m "feat(game-zone): harden admin topup receipt review"
          git push origin HEAD:game-zone/rc20-production
