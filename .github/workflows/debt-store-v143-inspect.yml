name: Inspect Debt Store 1.4.3 Source

on:
  push:
    branches:
      - debt-store-v143-stats
    paths:
      - '.github/workflows/debt-store-v143-inspect.yml'
      - 'build/debt143/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recover 1.4.3 source fragment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection-out/recovered143
          cat build/debt143/chunk-*.b64 > /tmp/debt143-source.zip.b64
          base64 -d /tmp/debt143-source.zip.b64 > /tmp/debt143-source.zip
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib, json
          data=Path('/tmp/debt143-source.zip').read_bytes()
          pos=0; rows=[]; out=Path('inspection-out/recovered143')
          while pos+30 <= len(data) and data[pos:pos+4] == b'PK\x03\x04':
              sig,ver,flag,method,mt,md,crc,csz,usz,nlen,xlen=struct.unpack_from('<IHHHHHIIIHH',data,pos)
              name=data[pos+30:pos+30+nlen].decode('utf-8','replace')
              start=pos+30+nlen+xlen; avail=max(0,min(csz,len(data)-start)); payload=data[start:start+avail]
              complete=avail==csz; recovered=b''; err=''
              if method==0: recovered=payload
              elif method==8:
                  try:
                      d=zlib.decompressobj(-15); recovered=d.decompress(payload)
                      if complete: recovered+=d.flush()
                  except Exception as e: err=str(e)
              target=out/name
              if name.endswith('/'): target.mkdir(parents=True,exist_ok=True)
              else:
                  target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(recovered)
              rows.append({'name':name,'compressed_size':csz,'uncompressed_size':usz,'available':avail,'complete':complete,'recovered':len(recovered),'method':method,'error':err})
              if not complete: break
              pos=start+csz
          Path('inspection-out/recovery.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          main=out/'app/src/main/java/com/uchiha/debtstore/MainActivity.java'
          text=main.read_text(encoding='utf-8',errors='replace') if main.exists() else ''
          needles=['الرصيد الإجمالي','الرصيد الاجمالي','تسجيل شراء','تسجيل دفعة','آخر الحركات','اخر الحركات','الإحصائيات','الاحصائيات','النواقص','الباركود','الشركاء','العملاء','المتابعة مباشرة']
          report=[]
          for n in needles:
              starts=[]; s=0
              while True:
                  p=text.find(n,s)
                  if p<0: break
                  starts.append(p); s=p+len(n)
              report.append({'needle':n,'positions':starts})
          Path('inspection-out/ui-matches.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Recovered MainActivity chars:',len(text))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload recovered source
        uses: actions/upload-artifact@v4
        with:
          name: debt-v143-recovered-source
          path: inspection-out/
          if-no-files-found: error
          retention-days: 3
