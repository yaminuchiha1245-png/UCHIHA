name: Game Zone Admin Scroll V8

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-admin-scroll-v8.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
      - name: Apply mobile vertical scrolling fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ops/apply-admin-scroll-v8.py
          grep -Fq 'GAME_ZONE_ADMIN_SCROLL_V8' admin/v5.css
          grep -Fq './v5.css?v=800' admin/index.html
          grep -Fq 'overflow-y:auto!important' admin/v5.css
          grep -Fq 'touch-action:pan-y!important' admin/v5.css
      - name: Commit scroll fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html admin/v5.css
          git commit -m 'fix(game-zone): restore vertical scrolling across admin mobile pages' || exit 0
          git push origin HEAD:game-zone/rc20-production
