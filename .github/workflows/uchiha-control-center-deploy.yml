name: UCHIHA Control Center Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to start the production deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: uchiha-control-center-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: UCHIHA VPS NEW

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify production package
        run: |
          cat control-center/v5/package/part-* > /tmp/UCHIHA-Control-Center-v5-Bridge.tgz.b64
          base64 --decode /tmp/UCHIHA-Control-Center-v5-Bridge.tgz.b64 > /tmp/UCHIHA-Control-Center-v5-Bridge.tgz
          echo '15a5c9495bc08967a1af077976e7f3c0cb31904f357213af9c101b1019724772  /tmp/UCHIHA-Control-Center-v5-Bridge.tgz' | sha256sum -c -
          tar -tzf /tmp/UCHIHA-Control-Center-v5-Bridge.tgz >/dev/null

      - name: Validate required deployment secrets
        env:
          VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          VPS_USER: ${{ secrets.UCHIHA_VPS_USER }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
          OWNER_PASSWORD: ${{ secrets.UCHIHA_OWNER_PASSWORD }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_KEY_B64"
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$OWNER_PASSWORD"

      - name: Build protected environment file
        env:
          OWNER_PASSWORD: ${{ secrets.UCHIHA_OWNER_PASSWORD }}
        run: |
          rm -rf /tmp/uchiha-control-env
          mkdir -p /tmp/uchiha-control-env
          tar -xzf /tmp/UCHIHA-Control-Center-v5-Bridge.tgz -C /tmp/uchiha-control-env
          APP_DIR=/tmp/uchiha-control-env
          test -f "$APP_DIR/lib/auth.js"
          OWNER_PASSWORD_HASH="$(APP_DIR="$APP_DIR" OWNER_PASSWORD="$OWNER_PASSWORD" node -e "const {makePasswordHash}=require(process.env.APP_DIR + '/lib/auth');process.stdout.write(makePasswordHash(process.env.OWNER_PASSWORD));")"
          {
            echo 'HOST=0.0.0.0'
            echo 'PORT=8787'
            echo 'APP_ENV=production'
            printf 'OWNER_PASSWORD_HASH=%s\n' "$OWNER_PASSWORD_HASH"
            echo 'UCHIHA_BRIDGE_REPO=yaminuchiha1245-png/UCHIHA'
            echo 'UCHIHA_BRIDGE_OWNER=yaminuchiha1245-png'
          } > /tmp/uchiha-control.env
          chmod 600 /tmp/uchiha-control.env
          rm -rf /tmp/uchiha-control-env

      - name: Prepare SSH
        env:
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Upload verified package
        env:
          VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          VPS_USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            /tmp/UCHIHA-Control-Center-v5-Bridge.tgz \
            "$VPS_USER@$VPS_HOST:/tmp/uchiha-control-${GITHUB_SHA}.tgz"

      - name: Install protected environment file
        env:
          VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          VPS_USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          cat /tmp/uchiha-control.env | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'umask 077; mkdir -p "$HOME/uchiha-control-center/shared"; cat > "$HOME/uchiha-control-center/shared/.env"'

      - name: Deploy with health-check rollback
        env:
          VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          VPS_USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'bash -s' -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          BASE="$HOME/uchiha-control-center"
          CURRENT="$BASE/current"
          STAGING="$BASE/staging-$SHA"
          PREVIOUS="$BASE/previous-$SHA"
          PACKAGE="/tmp/uchiha-control-$SHA.tgz"
          ENV_FILE="$BASE/shared/.env"

          command -v docker >/dev/null
          command -v tar >/dev/null
          test -s "$ENV_FILE"
          test -s "$PACKAGE"

          if docker compose version >/dev/null 2>&1; then
            COMPOSE=(docker compose)
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE=(docker-compose)
          else
            echo 'Docker Compose is missing; installing a compatible package.'
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            if apt-get install -y docker-compose-plugin; then
              :
            elif apt-get install -y docker-compose-v2; then
              :
            else
              apt-get install -y docker-compose
            fi

            if docker compose version >/dev/null 2>&1; then
              COMPOSE=(docker compose)
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE=(docker-compose)
            else
              echo 'Docker Compose installation did not provide a usable command.' >&2
              exit 1
            fi
          fi

          rm -rf "$STAGING" "$PREVIOUS"
          mkdir -p "$STAGING/app"
          tar -xzf "$PACKAGE" -C "$STAGING/app"
          APP_DIR="$STAGING/app"
          test -f "$APP_DIR/compose.yaml"
          test -f "$APP_DIR/server.js"
          test -f "$APP_DIR/scripts/bridge-command.js"

          cp "$ENV_FILE" "$APP_DIR/.env"
          chmod 600 "$APP_DIR/.env"

          if [ -d "$CURRENT" ]; then
            mv "$CURRENT" "$PREVIOUS"
          fi
          mv "$APP_DIR" "$CURRENT"
          rm -rf "$STAGING"

          set +e
          (
            cd "$CURRENT"
            if [ "${COMPOSE[0]}" = 'docker-compose' ]; then
              "${COMPOSE[@]}" -p uchiha-control --env-file .env down --remove-orphans || true
            fi
            "${COMPOSE[@]}" -p uchiha-control --env-file .env up -d --build
          )
          DEPLOY_CODE=$?

          HEALTH_CODE=1
          if [ "$DEPLOY_CODE" -eq 0 ]; then
            for i in $(seq 1 30); do
              if wget -qO- http://127.0.0.1:8787/api/health | grep -q '"ok":true'; then
                HEALTH_CODE=0
                break
              fi
              sleep 2
            done
          fi
          set -e

          if [ "$DEPLOY_CODE" -ne 0 ] || [ "$HEALTH_CODE" -ne 0 ]; then
            echo 'Deployment failed; rolling back.' >&2
            rm -rf "$CURRENT"
            if [ -d "$PREVIOUS" ]; then
              mv "$PREVIOUS" "$CURRENT"
              cd "$CURRENT"
              "${COMPOSE[@]}" -p uchiha-control --env-file .env up -d --build
            fi
            rm -f "$PACKAGE"
            exit 1
          fi

          wget -qO- http://127.0.0.1:8787/api/health | grep -q '"chatgptBridge":true'
          rm -rf "$PREVIOUS"
          rm -f "$PACKAGE"
          echo 'UCHIHA Control Center v5 Bridge deployment healthy.'
          REMOTE

      - name: Remote health verification
        env:
          VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          VPS_USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "wget -qO- http://127.0.0.1:8787/api/health | grep -q '\"chatgptBridge\":true'"
