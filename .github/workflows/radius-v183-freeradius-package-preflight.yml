name: V1-83 missing FreeRADIUS REST module package preflight
on:
  push:
    branches: [radius-v183/freeradius-package-preflight-20260927]
    paths: [.github/workflows/radius-v183-freeradius-package-preflight.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: UCHIHA VPS NEW
    env:
      VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.UCHIHA_VPS_USER || secrets.VPS_USER }}
      VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
      VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.UCHIHA_VPS_PORT || secrets.VPS_PORT || '22' }}
    steps:
      - name: Pin SSH host
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY_B64" && test -n "$VPS_KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Inspect OS package versions and candidate install impact without changes
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'sudo -n bash -se' <<'REMOTE'
          set -euo pipefail
          . /etc/os-release
          printf 'Host OS: %s %s\n' "$ID" "$VERSION_ID"
          echo "Current FreeRADIUS package versions:"
          for p in freeradius freeradius-config freeradius-common freeradius-rest libfreeradius3; do
            current="$(dpkg-query -W -f='${Version}' "$p" 2>/dev/null || :)"
            if test -z "$current"; then echo "$p: not-installed"; else echo "$p: installed $current"; fi
          done
          echo "APT candidate for missing REST module:"
          apt-cache policy freeradius-rest | grep -E '^(freeradius-rest:|  Installed:|  Candidate:)' || :
          echo "Package dependencies (read-only):"
          apt-cache depends freeradius-rest | grep -E '^  (Depends|PreDepends):' | head -16 || :
          echo "Simulated package installation (never execute install here):"
          apt-get -s -o Debug::NoLocking=1 install --no-install-recommends freeradius-rest | grep -E '^(Inst |Remv |Conf |[0-9]+ upgraded,)' | head -20 || :
          echo "FreeRADIUS remains inactive:"
          systemctl is-active freeradius.service || :
          echo "No packages installed and no services changed."
          REMOTE
