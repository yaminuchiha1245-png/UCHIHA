name: V1-83 two historical router addresses probe

on:
  push:
    branches: [radius-v183/router-path-diagnosis-20261002]
    paths: [.github/workflows/radius-v183-two-historical-router-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: UCHIHA VPS NEW
    env:
      VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.UCHIHA_VPS_USER || secrets.VPS_USER }}
      VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
      VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.UCHIHA_VPS_PORT || secrets.VPS_PORT || '22' }}

    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Probe only addresses previously registered by this tenant
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'sudo -n bash -se' <<'REMOTE'
          set -Eeuo pipefail
          bot=/opt/uchiha-radius/release-candidates/v183-0c1ea716-20260927/telegram-bot-bundle
          python3 - "$bot" <<'PY'
          import ipaddress,json,pathlib,re,shlex,socket,subprocess,sys

          def mask(host):
              try:
                  ip=ipaddress.ip_address(host)
                  if ip.version==4:
                      a=str(ip).split(".")
                      return f"{a[0]}.{a[1]}.*.{a[3]}"
              except ValueError:
                  pass
              return "hostname(redacted)"

          def tcp(host,port):
              try:
                  with socket.create_connection((host,port),timeout=5):
                      return "open"
              except socket.timeout:
                  return "timeout"
              except OSError as e:
                  if getattr(e,"errno",None) in (111,61): return "refused"
                  if getattr(e,"errno",None) in (101,113,65): return "no-route"
                  return "connect-failed"

          unit=subprocess.check_output(["systemctl","cat","uchiha-radius-telegram-bot.service"],text=True)
          env={}
          for line in unit.splitlines():
              line=line.strip()
              if line.startswith("EnvironmentFile="):
                  try:
                      p=shlex.split(line.partition("=")[2].lstrip("-"))[0]
                      for raw in pathlib.Path(p).read_text(encoding="utf-8").splitlines():
                          if not raw or raw.startswith("#") or "=" not in raw: continue
                          k,v=raw.split("=",1)
                          if re.fullmatch("[A-Z][A-Z0-9_]+",k.strip()):
                              env[k.strip()]=v.strip().strip('"').strip("'")
                  except Exception:
                      pass
              elif line.startswith("Environment="):
                  try:
                      for item in shlex.split(line.partition("=")[2]):
                          if "=" in item:
                              k,v=item.split("=",1); env[k]=v
                  except ValueError:
                      pass

          sys.path.insert(0,sys.argv[1])
          from v183_bot import V183Api
          api=V183Api(env["TELEGRAM_BOT_TOKEN"],int(env["UCHIHA_RADIUS_OWNER_TELEGRAM_ID"]))
          me=api.login()
          tenant=str(me.get("tenantId") or "")
          if not re.fullmatch(r"[A-Za-z0-9_-]{3,128}",tenant):
              raise SystemExit("invalid tenant id")

          sql=("SELECT action,COALESCE(before_json::text,''),COALESCE(after_json::text,''),created_at::text "
               "FROM audit_logs WHERE tenant_id='"+tenant+"' AND action IN ('device.create','device.delete') "
               "ORDER BY created_at ASC")
          raw=subprocess.check_output([
              "docker","exec","uchiha-radius-v183-db","psql","-U","postgres","-d","uchiha_radius_v183",
              "-At","-F","\t","-c",sql
          ],text=True)

          rows=[]
          hosts=[]
          for line in raw.splitlines():
              cols=line.split("\t",3)
              if len(cols)!=4: continue
              action,before_s,after_s,created=cols
              snap=json.loads(before_s) if action=="device.delete" and before_s else (json.loads(after_s) if after_s else {})
              host=str(snap.get("host") or "").strip()
              if not host: continue
              try:
                  ip=ipaddress.ip_address(host)
                  if ip.version!=4: continue
              except ValueError:
                  continue
              rows.append({"action":action,"host":host,"at":created})
              if host not in hosts:
                  hosts.append(host)

          print("HISTORICAL_UNIQUE_HOSTS",len(hosts))
          for idx,host in enumerate(hosts,1):
              ping=subprocess.run(["ping","-c","2","-W","2",host],text=True,capture_output=True,timeout=8)
              replies=len(re.findall(r"bytes from ",ping.stdout or "",flags=re.I))
              loss=None
              m=re.search(r"(\d+(?:\.\d+)?)% packet loss",ping.stdout or "")
              if m: loss=float(m.group(1))
              route=subprocess.run(["ip","route","get",host],text=True,capture_output=True,timeout=5)
              route_out=(route.stdout or "").strip()
              ip=ipaddress.ip_address(host)
              print("HISTORICAL_PROBE "+json.dumps({
                  "index":idx,
                  "host":mask(host),
                  "lastOctetZero":str(ip).endswith(".0"),
                  "isGlobal":ip.is_global,
                  "icmpReplies":replies,
                  "icmpLossPercent":loss,
                  "tcp8728":tcp(host,8728),
                  "tcp8729":tcp(host,8729),
                  "routeExists":route.returncode==0,
                  "viaGateway":bool(re.search(r"\bvia\s+\S+",route_out)),
                  "routeDevice":(re.search(r"\bdev\s+(\S+)",route_out).group(1) if re.search(r"\bdev\s+(\S+)",route_out) else None)
              },sort_keys=True))

          print("HISTORY_ACTIONS "+json.dumps([{
              "action":r["action"],"host":mask(r["host"]),"at":r["at"]
          } for r in rows],sort_keys=True))
          print("PASS: only tenant-registered historical router addresses were probed; no state changed.")
          PY
          REMOTE
