name: Game Zone Client v3.1.3

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-client-v313.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Prepare v3.1.3 source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/handoff/client/build.gradle.kts')
          s=p.read_text()
          import re
          s,n=re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 34', s, count=1)
          if n != 1: raise SystemExit('versionCode anchor missing')
          s,n=re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "3.1.3"', s, count=1)
          if n != 1: raise SystemExit('versionName anchor missing')
          p.write_text(s)
          PY
          grep -F 'versionCode = 34' android/handoff/client/build.gradle.kts
          grep -F 'versionName = "3.1.3"' android/handoff/client/build.gradle.kts
          grep -F 'TYPE_TEXT_VARIATION_PASSWORD' android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java
          grep -F 'TYPE_TEXT_VARIATION_EMAIL_ADDRESS' android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java
          grep -F 'TYPE_CLASS_PHONE' android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java
      - name: Build APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd android/handoff
          gradle --no-daemon :client:assembleDebug
          cd ../..
          mkdir -p dist/client-v3.1.3
          cp android/handoff/client/build/outputs/apk/debug/client-debug.apk dist/client-v3.1.3/Game-Zone-Client-v3.1.3.apk
          sha256sum dist/client-v3.1.3/Game-Zone-Client-v3.1.3.apk > dist/client-v3.1.3/Game-Zone-Client-v3.1.3-SHA256SUMS.txt
          test -s dist/client-v3.1.3/Game-Zone-Client-v3.1.3.apk
      - name: Commit version bump
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/handoff/client/build.gradle.kts
          git commit -m 'release(game-zone): bump client to v3.1.3' || true
          git push origin HEAD:game-zone/rc20-production
      - uses: actions/upload-artifact@v4
        with:
          name: game-zone-client-v3.1.3
          path: dist/client-v3.1.3/*
          retention-days: 90
      - name: Publish v3.1.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag=game-zone-client-v3.1.3
          gh release delete "$tag" --yes >/dev/null 2>&1 || true
          git push origin ":refs/tags/$tag" >/dev/null 2>&1 || true
          gh release create "$tag" dist/client-v3.1.3/Game-Zone-Client-v3.1.3.apk dist/client-v3.1.3/Game-Zone-Client-v3.1.3-SHA256SUMS.txt --target game-zone/rc20-production --title 'Game Zone Client v3.1.3' --notes 'Standalone Android client update for admin-configured customer input fields. Adds native masked password input, email keyboard, phone keyboard and preserves the same shared Game Zone backend, catalog, payments, orders and bot account linking.'
