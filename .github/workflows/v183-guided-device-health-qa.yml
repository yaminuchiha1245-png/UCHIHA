name: V1-83 Guided Device Health QA

on:
  pull_request:
    branches:
      - radius-v183/release-reconciled-20260926
    paths:
      - 'radius-v183/apps/api/src/device-diagnostics.js'
      - 'radius-v183/apps/api/test/device-onboarding-guidance.test.js'
      - 'radius-v183/apps/provider-v183-runtime/runtime.js'
      - '.github/workflows/v183-guided-device-health-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-health:
    name: Tenant device guidance and UI syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Device diagnostics regression cases
        working-directory: radius-v183
        run: node --test apps/api/test/device-onboarding-guidance.test.js
      - name: Provider UI and diagnostics syntax
        working-directory: radius-v183
        run: |
          node --check apps/api/src/device-diagnostics.js
          node --check apps/provider-v183-runtime/runtime.js
