name: UCHIHA RADIUS FreeRADIUS truth audit

on:
  push:
    branches: [radius/release-cleanup-live-only-20261013]
    paths:
      - ".github/workflows/radius-freeradius-truth-audit-20261013.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: UCHIHA VPS NEW
    env:
      VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.UCHIHA_VPS_USER || secrets.VPS_USER }}
      VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
      VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.UCHIHA_VPS_PORT || secrets.VPS_PORT || '22' }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Inspect actual FreeRADIUS readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'sudo -n bash -se' <<'REMOTE'
          set -Eeuo pipefail
          echo "STATE $(systemctl is-active freeradius 2>/dev/null || true)"
          echo "ENABLED $(systemctl is-enabled freeradius 2>/dev/null || true)"
          for p in 1812 1813 3799; do
            if ss -lunp 2>/dev/null | grep -Eq "[:.]$p[[:space:]]"; then echo "UDP_$p listening"; else echo "UDP_$p not-listening"; fi
          done
          set +e
          timeout 20s freeradius -XC >/tmp/uchiha-fr-xc.log 2>&1
          rc=$?
          set -e
          echo "CONFIG_RC $rc"
          grep -qi 'configuration appears to be ok' /tmp/uchiha-fr-xc.log && echo "CONFIG_OK yes" || echo "CONFIG_OK no"
          clients="$(grep -RhsE '^[[:space:]]*client[[:space:]]+[^[:space:]\{]+' /etc/freeradius 2>/dev/null | wc -l)"
          echo "CLIENT_BLOCKS $clients"
          envfile=/etc/uchiha-radius/v183-staging.env
          if test -r "$envfile"; then
            value="$(grep -E '^RADIUS_UDP_READY=' "$envfile" | tail -1 | cut -d= -f2- || true)"
            echo "ENV_RADIUS_UDP_READY=${value:-unset}"
          fi
          rm -f /tmp/uchiha-fr-xc.log
          REMOTE
