name: UCHIHA Control Center Validate

on:
  pull_request:
    paths:
      - 'control-center/**'
      - '.github/workflows/uchiha-control-center-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract production package
        run: |
          mkdir -p /tmp/uchiha-control
          unzip -q control-center/UCHIHA-Control-Center-PRODUCTION-v4-CLEAN.zip -d /tmp/uchiha-control
          APP_DIR="$(find /tmp/uchiha-control -maxdepth 1 -type d -name 'uchiha-control-center-production-v4' -print -quit)"
          test -n "$APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Verify clean persistent state
        run: |
          test "$(cat "$APP_DIR/data/approvals.json" | tr -d '[:space:]')" = '[]'
          test ! -s "$APP_DIR/data/audit.jsonl"

      - name: Syntax checks
        run: |
          cd "$APP_DIR"
          npm run check
          node --check lib/auth.js
          node --check lib/audit.js
          node --check lib/policy.js
          node --check lib/store.js
          node --check lib/connectors.js
          node --check scripts/hash-password.js

      - name: Production guard must reject missing owner password
        run: |
          cd "$APP_DIR"
          set +e
          APP_ENV=production HOST=127.0.0.1 PORT=8790 node server.js >/tmp/uchiha-guard.log 2>&1
          CODE=$?
          set -e
          test "$CODE" -ne 0
          grep -q 'OWNER_PASSWORD_HASH is required' /tmp/uchiha-guard.log

      - name: Health smoke test
        run: |
          cd "$APP_DIR"
          APP_ENV=development HOST=127.0.0.1 PORT=8791 node server.js >/tmp/uchiha.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8791/api/health >/tmp/health.json; then break; fi
            sleep 0.25
          done
          grep -q '"ok":true' /tmp/health.json
          curl -fsS http://127.0.0.1:8791/ >/tmp/index.html
          grep -q 'UCHIHA Control Center' /tmp/index.html
