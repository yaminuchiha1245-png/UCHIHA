name: UCHIHA Control Center Validate

on:
  pull_request:
    paths:
      - 'control-center/**'
      - '.github/workflows/uchiha-control-center-validate.yml'
      - '.github/workflows/uchiha-control-center-deploy.yml'
      - '.github/workflows/uchiha-chatgpt-bridge.yml'
  push:
    branches:
      - main
    paths:
      - 'control-center/**'
      - '.github/workflows/uchiha-control-center-validate.yml'
      - '.github/workflows/uchiha-control-center-deploy.yml'
      - '.github/workflows/uchiha-chatgpt-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and verify production package
        run: |
          cat control-center/v5/package/part-* > /tmp/UCHIHA-Control-Center-v5-Bridge.tgz.b64
          base64 --decode /tmp/UCHIHA-Control-Center-v5-Bridge.tgz.b64 > /tmp/UCHIHA-Control-Center-v5-Bridge.tgz
          echo '15a5c9495bc08967a1af077976e7f3c0cb31904f357213af9c101b1019724772  /tmp/UCHIHA-Control-Center-v5-Bridge.tgz' | sha256sum -c -
          tar -tzf /tmp/UCHIHA-Control-Center-v5-Bridge.tgz >/dev/null
          mkdir -p /tmp/uchiha-control
          tar -xzf /tmp/UCHIHA-Control-Center-v5-Bridge.tgz -C /tmp/uchiha-control
          APP_DIR=/tmp/uchiha-control
          test -f "$APP_DIR/server.js"
          test -f "$APP_DIR/scripts/bridge-command.js"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Verify clean persistent state
        run: |
          test "$(cat "$APP_DIR/data/approvals.json" | tr -d '[:space:]')" = '[]'
          test ! -s "$APP_DIR/data/audit.jsonl"
          grep -q '"source": "live_registry"' "$APP_DIR/data/state.json"
          ! grep -q '"name": "Game Zone"' "$APP_DIR/data/state.json"

      - name: Syntax checks
        run: |
          cd "$APP_DIR"
          npm run check
          node --check lib/auth.js
          node --check lib/audit.js
          node --check lib/policy.js
          node --check lib/store.js
          node --check lib/connectors.js
          node --check lib/bridge.js
          node --check scripts/hash-password.js
          node --check scripts/bridge-command.js
          node --check public/app-runtime.js

      - name: Production guard must reject missing owner password
        run: |
          cd "$APP_DIR"
          set +e
          APP_ENV=production HOST=127.0.0.1 PORT=8790 node server.js >/tmp/uchiha-guard.log 2>&1
          CODE=$?
          set -e
          test "$CODE" -ne 0
          grep -q 'OWNER_PASSWORD_HASH is required' /tmp/uchiha-guard.log

      - name: Health and bridge smoke test
        run: |
          cd "$APP_DIR"
          APP_ENV=development HOST=127.0.0.1 PORT=8791 node server.js >/tmp/uchiha.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8791/api/health >/tmp/health.json; then break; fi
            sleep 0.25
          done
          grep -q '"ok":true' /tmp/health.json
          grep -q '"chatgptBridge":true' /tmp/health.json
          curl -fsS http://127.0.0.1:8791/api/bridge >/tmp/bridge.json
          grep -q 'github-issue-command-bus' /tmp/bridge.json
          curl -fsS http://127.0.0.1:8791/ >/tmp/index.html
          grep -q 'UCHIHA Control Center' /tmp/index.html

      - name: Bridge command safety smoke test
        run: |
          cd "$APP_DIR"
          cp data/state.json /tmp/bridge-state.json
          printf '%s' '{"schema":"uchiha.command.v1","actor":"yaminuchiha1245-png","requestId":"ci-register","action":"project.register","project":{"name":"CI Project","slug":"ci-project","repository":"https://github.com/yaminuchiha1245-png/UCHIHA","branch":"main"}}' | node scripts/bridge-command.js >/tmp/bridge-command.log
          grep -q '"ok":true' /tmp/bridge-command.log
          grep -q 'CI Project' data/state.json
          cp /tmp/bridge-state.json data/state.json
          : > data/audit.jsonl
