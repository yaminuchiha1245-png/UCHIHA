name: Bot Service staged merge WS00

on:
  push:
    branches: [bot-service/coordinator-readonly-audit-20260927]
    paths: [.github/workflows/bot-service-stage-merge.yml]

permissions:
  contents: read

concurrency:
  group: bot-service-stage-merge-ws00
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Set up pinned SSH for the live Hostfiley machine
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$KEY_B64" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s' "$KEY_B64" | base64 -d > ~/.ssh/ws00_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ws00_key ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/ws00_key >/dev/null
          echo SSH_READY=yes

      - name: Deliver sealed, non-secret integration source to private VPS stage
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
        run: |
          set -Eeuo pipefail
          umask 077
          cat > /tmp/ws00-merge-envelope.enc <<'SEALED'
          UCH00v2
          
          
          SEALED
          echo "SEALED_FILE_SHA256=$(sha256sum /tmp/ws00-merge-envelope.enc | awk '{print $1}')"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -P "${PORT:-22}" -i ~/.ssh/ws00_key /tmp/ws00-merge-envelope.enc "$USER@$HOST:/tmp/uchiha-ws00-merge-${GITHUB_RUN_ID}.enc"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -p "${PORT:-22}" -i ~/.ssh/ws00_key "$USER@$HOST" 'bash -s' -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          RUN_ID="$1"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 3
          LIVE=/opt/uchiha/projects/bot-service-stage/uchiha-bot-service
          BASE=/opt/uchiha/projects/bot-service-stage
          STAGE="$BASE/.ws00-merge-preview-$RUN_ID"
          ENVELOPE="/tmp/uchiha-ws00-merge-$RUN_ID.enc"
          TRANSFER_KEY="$HOME/.uchiha-coordinator-transfer-20260927/transfer-private.pem"
          test -d "$LIVE" && test -s "$TRANSFER_KEY" && test -s "$ENVELOPE"
          exec 9>"$BASE/.ws00-integration.lock"
          flock -n 9 || { echo 'INTEGRATION_LOCK=BUSY'; exit 4; }
          test ! -e "$STAGE" || { echo 'STAGE_DIR=EXISTS'; exit 5; }
          mkdir -m 700 "$STAGE"
          trap 'rm -f "$ENVELOPE"' EXIT
          mkdir -m 700 "$STAGE/.ws00-payload"
          python3 - "$ENVELOPE" "$TRANSFER_KEY" "$STAGE/.ws00-payload" <<'PY'
          import sys,base64,tarfile,io,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          src,keypath,dest=sys.argv[1:]
          lines=Path(src).read_text().splitlines()
          if len(lines)!=3 or lines[0]!='UCH00v2':raise SystemExit('INVALID_ENVELOPE')
          private=serialization.load_pem_private_key(Path(keypath).read_bytes(),password=None)
          aes=private.decrypt(base64.b64decode(lines[1]),padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          sealed=base64.b64decode(lines[2])
          plain=AESGCM(aes).decrypt(sealed[:12],sealed[12:],b'UCHIHA-WS00-STAGING-20260927')
          with tarfile.open(fileobj=io.BytesIO(plain),mode='r:gz') as tf:
              expect={'guarded_patch_ws00.py','tests/tenant_boot_gate_ws02.js','tests/smoke_strict_page_metadata_ws03.py'}
              names={m.name for m in tf.getmembers()}
              if names!=expect or not all(m.isfile() for m in tf.getmembers()):raise SystemExit('PAYLOAD_FILE_SET_MISMATCH')
              tf.extractall(dest,filter='data')
          print('SEALED_PATCH_AUTHENTICATED=yes; source kept on VPS only')
          PY
          cd "$LIVE"
          test "$(cat VERSION)" = 0.5.51 || { echo 'LIVE_VERSION_DRIFT'; exit 6; }
          # Stop if a specialist edits any shared source while snapshotting.
          printf '%s\n' VERSION apps/api/app/routers/catalog.py apps/api/app/adapters/generic_hierarchical.py apps/miniapp/index.html apps/miniapp/assets/uchiha-ui-190e50b6453872aa.js apps/api/app/main.py apps/bot-engine/main.py scripts/release_gate.sh tests/pwa_head_frontend_v0548.js tests/banner_frontend_v0546.js | xargs sha256sum > "$STAGE/live-before.sha256"
          tar --exclude='.env' --exclude='.env.*' --exclude='*.jks' --exclude='*.keystore' --exclude='*.pem' --exclude='*.key' --exclude='*.p12' --exclude='*.pfx' --exclude='*.db' --exclude='*.sqlite*' --exclude='*.log' --exclude='*.apk' --exclude='*.zip' --exclude='node_modules' --exclude='.gradle' --exclude='.venv' --exclude='venv' --exclude='__pycache__' --exclude='media' --exclude='uploads' --exclude='backups' --exclude='.ws*' -cf - VERSION apps tests scripts infra docs | tar -xf - -C "$STAGE"
          sha256sum -c "$STAGE/live-before.sha256" >/dev/null || { echo 'LIVE_CHANGED_DURING_COPY'; exit 7; }
          cd "$STAGE"
          UCHIHA_PATCH_ROOT="$STAGE" python3 "$STAGE/.ws00-payload/guarded_patch_ws00.py"
          cp "$STAGE/.ws00-payload/tests/tenant_boot_gate_ws02.js" "$STAGE/tests/"
          cp "$STAGE/.ws00-payload/tests/smoke_strict_page_metadata_ws03.py" "$STAGE/tests/"
          echo '=== SYNTAX AND STATIC RELEASE GATE ==='
          python3 -m compileall -q apps/api/app apps/bot-engine
          node --check apps/miniapp/assets/uchiha-ui-3c13cfaf3a35eada.js
          bash scripts/release_gate.sh
          echo '=== TENANT BOOT / PWA / BANNER TESTS ==='
          for spec in tests/tenant_boot_gate_ws02.js tests/pwa_head_frontend_v0548.js tests/banner_frontend_v0546.js tests/web_login_frontend_v0547.js tests/service_worker_v0549.js; do
              if [ -f "$spec" ]; then node "$spec" || exit 8; fi
          done
          echo '=== ISOLATED API PYTHON REGRESSION ==='
          API_IMAGE="$(docker inspect uchiha_bot_service-api-1 --format '{{.Config.Image}}')"
          test -n "$API_IMAGE"
          for spec in tests/smoke_strict_page_metadata_ws03.py tests/smoke_generic_pagination_ws03.py tests/smoke_sawa_pagination_artwork_ws03.py tests/smoke_generic_catalog_ws03.py tests/smoke_sawa_full_hierarchy_v0545.py tests/smoke_sawa_catalog_v0545.py tests/smoke_ws01_catalog_health.py tests/smoke_ws01_navigation.py; do
              docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=32m --security-opt no-new-privileges:true --cap-drop ALL --pids-limit 96 --memory 512m --cpus 1 -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/work/apps/api --entrypoint python -v "$STAGE:/work:ro" -w /work "$API_IMAGE" "$spec"
          done
          echo '=== IMMUTABLE ASSET AND PRODUCTION UNCHANGED ==='
          grep -Fq 'uchiha-ui-3c13cfaf3a35eada.js' apps/miniapp/index.html
          cd "$LIVE"
          sha256sum -c "$STAGE/live-before.sha256" >/dev/null || { echo 'LIVE_CHANGED_AFTER_TESTS'; exit 9; }
          test "$(cat VERSION)" = 0.5.51
          printf 'STAGE_VERSION='; cat "$STAGE/VERSION"
          echo "STAGE_SOURCE_DIR=$STAGE"
          echo 'STAGING_TESTS=PASS'
          echo 'LIVE_SOURCE_UNMODIFIED=YES'
          echo 'DEPLOYMENT=NOT_PERFORMED'
          REMOTE