name: Game Zone Admin Mobile Redesign

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-admin-mobile-redesign.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production

      - name: Apply mobile-first owner dashboard skin
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          css_path=Path('admin/admin.css')
          js_path=Path('admin/admin.js')
          css=css_path.read_text()
          js=js_path.read_text()

          CSS_MARK='/* GAME_ZONE_OWNER_MOBILE_V3 */'
          JS_MARK='// GAME_ZONE_OWNER_MOBILE_V3'
          if CSS_MARK not in css:
              css += r'''

/* GAME_ZONE_OWNER_MOBILE_V3 */
:root{
 --gz-red:#ff273b;--gz-red2:#d80f25;--gz-mint:#dfffee;--gz-ink:#0b0b0d;
 --gz-surface:#151517;--gz-card:#050506;--gz-line:#2a2a2f;--gz-soft:#a4a4ad;
}
body{background:#151517;color:#f7f7f9}
.layout{background:#151517}
aside{background:#050506;border-color:#25252a}
nav button{color:#dddde2}
nav button.active{color:#ff4254;background:linear-gradient(90deg,rgba(255,39,59,.16),rgba(255,39,59,.03));border-color:rgba(255,39,59,.2)}
main{background:#151517}
header{border-bottom:1px solid #232328;margin-bottom:16px}
header h1{font-size:28px;font-weight:800}
header p{color:#8d8d96}
.panel,.stat{background:#050506;border-color:#2a2a30;box-shadow:none}
.panel{border-radius:17px}
.stat{border-radius:15px}
.stat strong{color:#fff}
.panel-head{border-color:#242429}
.panel-head button,header button{background:#202024;border-color:#33333a}
th{background:#0c0c0e;color:#a2a2ab}
td{border-color:#242429}
.table-wrap{background:#050506}
.modal-card{background:#0b0b0d;border-color:#34343b}
.login-card{background:#08080a;border-color:#303038}
.save{background:linear-gradient(135deg,var(--gz-red),var(--gz-red2))}
.gz-owner-topbar,.gz-bottom-nav,.gz-quick-sheet,.gz-drawer-shade{display:none}

@media(max-width:700px){
 body{background:#151517;padding-bottom:86px}
 .layout{display:block;min-height:100vh}
 main{padding:0 14px 100px!important}
 header{padding:18px 4px 14px!important;margin:0 0 16px;border-bottom:0;align-items:flex-start}
 header>div{padding-top:10px}
 header h1{font-size:25px}
 header p{font-size:11px}
 header #adminKeyBtn{display:none}
 aside{position:fixed!important;z-index:130!important;top:0!important;bottom:0!important;right:0!important;left:auto!important;width:min(86vw,380px)!important;height:100vh!important;border:0!important;border-left:1px solid #27272c!important;border-radius:0!important;padding:74px 14px 24px!important;background:#050506!important;transform:translateX(105%);transition:transform .24s ease;overflow:auto;backdrop-filter:none!important}
 body.gz-drawer-open aside{transform:translateX(0)}
 .admin-brand{display:flex!important;position:absolute;top:14px;right:16px;left:16px;padding:0 0 12px;border-bottom:1px solid #242428}
 .admin-brand div{display:block!important}.admin-brand img{width:44px;height:44px;border-radius:14px}
 .admin-brand b{font-size:16px}.admin-brand span{font-size:9px}
 aside nav{display:grid!important;grid-template-columns:1fr!important;gap:5px!important;overflow:visible!important}
 aside nav button{display:flex!important;justify-content:flex-start!important;padding:12px 13px!important;border-radius:12px!important;font-size:14px!important}
 aside nav button span{display:block!important}
 .gz-drawer-shade{display:block;position:fixed;z-index:120;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:.2s}
 body.gz-drawer-open .gz-drawer-shade{opacity:1;pointer-events:auto}
 .gz-owner-topbar{display:flex;position:sticky;z-index:80;top:0;margin:0 -14px;padding:13px 16px;align-items:center;justify-content:space-between;background:rgba(5,5,6,.97);border-bottom:1px solid #242428;backdrop-filter:blur(14px)}
 .gz-owner-topbar button{width:42px;height:42px;border:0;border-radius:12px;background:#18181b;color:#fff;font-size:24px}
 .gz-owner-topbar .gz-account{text-align:right;min-width:0;flex:1;margin-right:12px}
 .gz-owner-topbar .gz-account b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .gz-owner-topbar .gz-account span{display:block;font-size:10px;color:#92929b}
 .gz-owner-topbar .gz-live{padding:7px 11px;border-radius:10px;background:var(--gz-mint);color:#157145;font-size:10px;font-weight:800;white-space:nowrap}
 .stats{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:9px!important}
 .stat{padding:15px 10px!important;text-align:center;min-height:105px;display:flex;flex-direction:column;justify-content:center}
 .stat span{font-size:10px!important}.stat strong{font-size:22px!important}.stat i{font-size:9px!important;color:#8a8a95}
 .stats .stat:nth-child(1){background:#a99be6;color:#111}.stats .stat:nth-child(1) *{color:#111!important}
 .stats .stat:nth-child(3){background:#afd6f4;color:#10151b}.stats .stat:nth-child(3) *{color:#10151b!important}
 .stats .stat:nth-child(4){background:#60d890;color:#0a2718}.stats .stat:nth-child(4) *{color:#0a2718!important}
 .panel-head{padding:14px;gap:10px}.panel-head h2{font-size:17px}
 .panel-tools{width:100%;display:grid!important;grid-template-columns:1fr 1fr;gap:7px!important}
 .panel-tools input{grid-column:1/-1;min-width:0!important;width:100%}
 .panel-tools select,.panel-tools button{min-width:0!important;width:100%}
 .table-wrap{overflow-x:auto;border-radius:0 0 16px 16px}
 table{min-width:760px}
 .gz-bottom-nav{display:grid;position:fixed;z-index:110;bottom:0;left:0;right:0;height:76px;background:#050506;border-top:1px solid #242428;grid-template-columns:1fr 1fr 92px 1fr 1fr;align-items:end;padding:7px 8px 8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
 .gz-bottom-nav button{border:0;background:none;color:#73737d;display:grid;place-items:center;gap:3px;font-family:inherit;font-size:9px;min-height:56px}
 .gz-bottom-nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8}
 .gz-bottom-nav button.gz-active{color:var(--gz-red)}
 .gz-bottom-nav .gz-plus{width:68px;height:68px;min-height:68px;border-radius:50%;background:var(--gz-red);color:#fff;font-size:38px;line-height:1;align-self:start;justify-self:center;margin-top:-24px;box-shadow:0 12px 30px rgba(255,39,59,.25)}
 .gz-quick-sheet{display:block;position:fixed;z-index:150;left:12px;right:12px;bottom:88px;background:#050506;border:1px solid #2c2c32;border-radius:19px;padding:15px;transform:translateY(120%);opacity:0;pointer-events:none;transition:.22s;max-height:70vh;overflow:auto}
 .gz-quick-sheet.gz-show{transform:translateY(0);opacity:1;pointer-events:auto}
 .gz-quick-sheet h3{margin:0 0 13px;font-size:17px}
 .gz-quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
 .gz-quick-grid button{border:0;background:none;color:#eee;font-family:inherit;font-size:9px;display:grid;gap:7px;place-items:center}
 .gz-quick-grid i{width:58px;height:58px;border-radius:13px;background:#f7f7fb;color:#2567c9;display:grid;place-items:center;font-style:normal;font-size:25px}
 .gz-quick-grid button:nth-child(3n+2) i{color:#18a45e}.gz-quick-grid button:nth-child(3n) i{color:#a72ad2}.gz-quick-grid button:nth-child(4n) i{color:#e18a1a}
 .form-panel{grid-template-columns:1fr!important}
}
'''
              css_path.write_text(css)

          if JS_MARK not in js:
              js += r'''

// GAME_ZONE_OWNER_MOBILE_V3
(()=>{
 const whenReady=fn=>document.readyState==='loading'?document.addEventListener('DOMContentLoaded',fn):fn();
 whenReady(()=>{
   const body=document.body;
   const main=document.querySelector('main');
   const aside=document.querySelector('aside');
   if(!main||!aside)return;

   const svg=(d)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
   const top=document.createElement('div');
   top.className='gz-owner-topbar';
   top.innerHTML=`<button type="button" id="gzMenuBtn" aria-label="القائمة">☰</button><div class="gz-account"><b>Game Zone</b><span>لوحة إدارة المتجر</span></div><span class="gz-live">متصل</span>`;
   main.prepend(top);

   const shade=document.createElement('div');shade.className='gz-drawer-shade';body.appendChild(shade);
   const closeDrawer=()=>body.classList.remove('gz-drawer-open');
   top.querySelector('#gzMenuBtn').onclick=()=>body.classList.toggle('gz-drawer-open');
   shade.onclick=closeDrawer;

   const go=(page)=>{
     const btn=aside.querySelector(`nav button[data-page="${page}"]`);
     if(btn)btn.click();
     closeDrawer();
     document.querySelectorAll('.gz-bottom-nav [data-gz-page]').forEach(x=>x.classList.toggle('gz-active',x.dataset.gzPage===page));
   };

   const bottom=document.createElement('nav');
   bottom.className='gz-bottom-nav';
   bottom.innerHTML=`
    <button type="button" data-gz-page="dashboard" class="gz-active">${svg('M4 11 12 4l8 7v9H5v-9M9 20v-6h6v6')}<span>الرئيسية</span></button>
    <button type="button" data-gz-page="support">${svg('M4 5h16v11H9l-5 4V5Z')}<span>المحادثات</span></button>
    <button type="button" class="gz-plus" id="gzQuickBtn" aria-label="إجراء سريع">＋</button>
    <button type="button" data-gz-page="products">${svg('M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z')}<span>عناصر المتجر</span></button>
    <button type="button" id="gzMoreBtn">${svg('M4 7h16M4 12h16M4 17h16')}<span>المزيد</span></button>`;
   body.appendChild(bottom);
   bottom.querySelectorAll('[data-gz-page]').forEach(b=>b.onclick=()=>go(b.dataset.gzPage));
   bottom.querySelector('#gzMoreBtn').onclick=()=>body.classList.add('gz-drawer-open');

   const sheet=document.createElement('div');
   sheet.className='gz-quick-sheet';
   sheet.innerHTML=`<h3>إجراء سريع</h3><div class="gz-quick-grid">
    <button data-q="addProductBtn"><i>▣</i><span>منتج</span></button>
    <button data-q="addCategoryBtn"><i>⌘</i><span>قسم رئيسي</span></button>
    <button data-page-q="categories"><i>⌄</i><span>الأقسام</span></button>
    <button data-page-q="inventory"><i>◇</i><span>المخزون</span></button>
    <button data-q="addPaymentBtn"><i>＋</i><span>طريقة دفع</span></button>
    <button data-page-q="topups"><i>▤</i><span>إضافة رصيد</span></button>
    <button data-q="addCouponBtn"><i>⌁</i><span>قسيمة</span></button>
    <button data-page-q="payments"><i>▰</i><span>طرق الدفع</span></button>
    <button data-page-q="settings"><i>⚙</i><span>الإعدادات</span></button>
    <button data-page-q="providers"><i>↗</i><span>ربط API</span></button>
    <button data-page-q="users"><i>♙</i><span>المستخدمون</span></button>
    <button data-page-q="broadcast"><i>◉</i><span>إرسال إشعار</span></button>
   </div>`;
   body.appendChild(sheet);
   const quickBtn=bottom.querySelector('#gzQuickBtn');
   quickBtn.onclick=()=>{sheet.classList.toggle('gz-show');quickBtn.textContent=sheet.classList.contains('gz-show')?'×':'＋'};
   const hideQuick=()=>{sheet.classList.remove('gz-show');quickBtn.textContent='＋'};
   sheet.querySelectorAll('[data-page-q]').forEach(b=>b.onclick=()=>{go(b.dataset.pageQ);hideQuick()});
   sheet.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.q);if(el){el.click();hideQuick()}});

   aside.querySelectorAll('nav button[data-page]').forEach(btn=>btn.addEventListener('click',()=>{
     const p=btn.dataset.page;
     document.querySelectorAll('.gz-bottom-nav [data-gz-page]').forEach(x=>x.classList.toggle('gz-active',x.dataset.gzPage===p));
     closeDrawer();
   }));

   const syncStoreName=()=>{
     const title=(window.data?.settings?.storeName)||'Game Zone';
     const b=top.querySelector('.gz-account b');if(b)b.textContent=title;
   };
   setTimeout(syncStoreName,500);
   document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncStoreName()});
 });
})();
'''
              js_path.write_text(js)
          PY

      - name: Validate admin runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'GAME_ZONE_OWNER_MOBILE_V3' admin/admin.css
          grep -F 'GAME_ZONE_OWNER_MOBILE_V3' admin/admin.js
          node --check admin/admin.js
          node server/scripts/web-security-audit.js
          cd server
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npm test
          npm run smoke
          npm run audit:routes

      - name: Commit redesign
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/admin.css admin/admin.js
          git commit -m 'feat(game-zone): redesign admin for mobile owner workflow' || exit 0
          git push origin HEAD:game-zone/rc20-production
