name: Validate Debt Telegram Admin v1.6 Debtor Statements
on:
  push:
    branches: [debt/telegram-admin-bot-v185-client-pdf]
    paths:
      - "build/debt180/**"
      - "build/debt185/**"
      - ".github/workflows/debt-telegram-admin-v185.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot-debtor-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Arabic PDF runtime and test-only rasterizer
        run: |
          python -m pip install --disable-pip-version-check \
            -r build/debt184/requirements-pdf.txt pymupdf==1.24.13
      - name: Check complete Python bot syntax
        run: |
          python -m py_compile \
            build/debt180/bot/bot.py \
            build/debt180/bot/debtor_statement.py \
            build/debt180/bot/user_report_pdf.py \
            build/debt180/bot/setup.py \
            build/debt180/bot/backup.py
      - name: Run financial safety, access-control and debtor PDF regression tests
        run: |
          python -m unittest discover -s build/debt180/tests -p 'test_*.py' -v
      - name: Security and release scope checks
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path("build/debt180/bot/bot.py").read_text()
          pdf=Path("build/debt180/bot/debtor_statement.py").read_text()
          for expression in (
              'user!=self.admin_id',
              '"await_debtor_backup"',
              'self.tg.download_json_backup',
              'state["shown_ids"]',
              'self.tg.send_pdf(',
              'self.tg.send_document(',
              'self.upload_state=None',
          ):
              assert expression in source,expression
          for expression in ('CLIENT_KEYS','ENTRY_KEYS','"source_sha256"',
                             'LIMIT_BYTES = 6_000_000','"record_count":len(rows)'):
              assert expression in pdf,expression
          for sensitive in (
              "build/debt180/bot/.env",
              "build/debt180/bot/bot.sqlite3",
              "build/debt180/bot/backups"
          ):
              assert not Path(sensitive).exists(),sensitive
          print("PASS: local-memory, authenticated, consent-first export")
          PY
      - name: Create v1.6 release archive without secrets
        run: |
          set -euo pipefail
          find build/debt180 -type d -name __pycache__ -exec rm -rf {} +
          (cd build && zip -q -r ../UCHIHA-Debt-Telegram-Admin-v1.6.zip \
            debt180/bot debt180/tests debt180/README.md \
            debt181/sql debt181/README.md \
            debt182/README.md debt183/README.md \
            debt184/README.md debt184/sql debt184/requirements-pdf.txt \
            debt185/README.md \
            -x '*.pyc' '*__pycache__*' '*/.env' '*.sqlite3' '*.sqlite3-*' '*/backups/*')
          unzip -t UCHIHA-Debt-Telegram-Admin-v1.6.zip | tail -1
          sha256sum UCHIHA-Debt-Telegram-Admin-v1.6.zip \
            > UCHIHA-Debt-Telegram-Admin-v1.6.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: UCHIHA-Debt-Telegram-Admin-v1.6
          path: |
            UCHIHA-Debt-Telegram-Admin-v1.6.zip
            UCHIHA-Debt-Telegram-Admin-v1.6.zip.sha256
          retention-days: 90
          if-no-files-found: error
