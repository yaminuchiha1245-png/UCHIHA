name: Game Zone VPS Proxy Inspect

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/game-zone-vps-proxy-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/uchiha_vps
          chmod 600 ~/.ssh/uchiha_vps
          ssh-keygen -y -f ~/.ssh/uchiha_vps >/dev/null
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify fresh Game Zone bot polling
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"; USER="${USER:-root}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/uchiha_vps -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          TARGET=/opt/uchiha/projects/game-zone
          cd "$TARGET/deploy"
          if docker compose version >/dev/null 2>&1; then COMPOSE='docker compose'; else COMPOSE='docker-compose'; fi

          BOT_CID="$($COMPOSE --env-file .env.production -f docker-compose.yml ps -q bot)"
          test -n "$BOT_CID"
          echo "bot_status=$(docker inspect -f '{{.State.Status}}' "$BOT_CID")"
          echo "bot_restarts=$(docker inspect -f '{{.RestartCount}}' "$BOT_CID")"
          echo "bot_started_at=$(docker inspect -f '{{.State.StartedAt}}' "$BOT_CID")"
          test "$(docker inspect -f '{{.State.Status}}' "$BOT_CID")" = "running"

          echo '=== RUNNING CODE CHECK ==='
          docker exec "$BOT_CID" sh -lc "grep -n 'Game Zone bot v1.0 RC20 started' /app/bot/bot.js || true; grep -n 'game-zone-logo' /app/bot/bot.js | head -5 || true"

          echo '=== TELEGRAM GETME ==='
          timeout 15 docker exec -i "$BOT_CID" node - <<'NODE'
          const token = process.env.BOT_TOKEN;
          if (!token) { console.log('bot_token_present=no'); process.exit(2); }
          console.log('bot_token_present=yes');
          const ctrl = new AbortController();
          const timer = setTimeout(()=>ctrl.abort(), 10000);
          fetch(`https://api.telegram.org/bot${token}/getMe`, {signal:ctrl.signal})
            .then(r=>r.json())
            .then(j=>{
              clearTimeout(timer);
              console.log('telegram_getMe_ok='+(j.ok?'yes':'no'));
              if (j.ok) console.log('telegram_username='+(j.result?.username||''));
              if (!j.ok) process.exit(3);
            })
            .catch(e=>{ console.log('telegram_getMe_error='+String(e.name||e.message||e).slice(0,160)); process.exit(4); });
          NODE

          echo '=== BOT LOG TAIL ==='
          docker logs --since 15m --tail 160 "$BOT_CID" 2>&1 \
            | sed -E 's#bot[0-9]+:[A-Za-z0-9_-]+#bot[REDACTED]#g; s/(token|password|secret|api[_-]?key)[=:][^ ,]+/\1=[REDACTED]/Ig' \
            | tail -160

          echo '=== SERVER HEALTH ==='
          curl -fsS --max-time 5 http://127.0.0.1:3100/api/health/ready >/dev/null
          echo 'server_ready=yes'
          REMOTE
