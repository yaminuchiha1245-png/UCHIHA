name: Bot Service coordinator read-only audit
# Selective read-only snapshot with session-specific encryption key; secrets excluded.

on:
  push:
    branches:
      - bot-service/coordinator-readonly-audit-20260927
    paths:
      - .github/workflows/bot-service-coordinator-readonly.yml

permissions:
  contents: read

concurrency:
  group: bot-service-coordinator-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
          KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$KEY_B64" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s' "$KEY_B64" | base64 -d > ~/.ssh/bot_service_audit
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/bot_service_audit ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/bot_service_audit > /dev/null
          echo "SSH_CREDENTIALS=READY"

      - name: Read current live source and runtime metadata
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/bot_service_audit "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          ROOT=/opt/uchiha/projects/bot-service-stage/uchiha-bot-service
          echo "AUDIT_DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ ! -d "$ROOT" ]; then echo 'ROOT=NOT_FOUND'; exit 2; fi
          echo 'ROOT=EXISTS'
          cd "$ROOT" || exit 2
          if [ -f docs/PROJECT_CHAT_WORKSTREAMS.md ]; then
            echo 'WORKSTREAMS_DOC=EXISTS'
            sha256sum docs/PROJECT_CHAT_WORKSTREAMS.md | awk '{print "WORKSTREAMS_SHA256="$1}'
          else echo 'WORKSTREAMS_DOC=NOT_FOUND'; fi
          if [ -f VERSION ]; then
            sed -n '1p' VERSION | sed -E 's/[^a-zA-Z0-9._-]//g' | cut -c1-64 | awk '{print "VERSION_FILE="$0}'
          else echo 'VERSION_FILE=NOT_FOUND'; fi
          if [ -f .git/HEAD ]; then
            echo 'GIT=YES'
            git rev-parse --short=12 HEAD 2>/dev/null | awk '{print "HEAD="$0}'
            git branch --show-current 2>/dev/null | cut -c1-70 | awk '{print "BRANCH="$0}'
            echo "TRACKED_CHANGES=$(git diff --name-only 2>/dev/null | wc -l)"
            echo "STAGED_CHANGES=$(git diff --cached --name-only 2>/dev/null | wc -l)"
            echo "UNTRACKED_CHANGES=$(git ls-files --others --exclude-standard 2>/dev/null | wc -l)"
          else echo 'GIT=NO_OR_WORKTREE'; fi
          for f in apps/api/app/adapters/generic_hierarchical.py apps/api/app/services/catalog_sync.py apps/bot-engine/merchant_admin_panel.py apps/bot-engine/main.py apps/api/app/main.py; do
            if [ -f "$f" ]; then
              printf 'SOURCE_SHA256 %s ' "$f"; sha256sum "$f" | awk '{print $1}'
            else printf 'SOURCE_MISSING %s\n' "$f"; fi
          done
          for d in apps/api/.ws03 apps/api/.ws01-v9 apps/api/.ws01-v10 apps/bot-engine/.ws01-v9 apps/bot-engine/.ws01-v10 apps/bot-engine/.ws01-v10-2 android docs; do
            if [ -d "$d" ]; then echo "DIR_EXISTS $d"; else echo "DIR_MISSING $d"; fi
          done
          for f in docs/*HANDOFF* docs/*REPORT* docs/*RELEASE*; do
            if [ -f "$f" ]; then
              printf 'DOC %s ' "$f"
              stat -c %y "$f" | cut -c1-19
            fi
          done
          echo '=== DOCKER BOT-SERVICE ==='
          docker ps --format '{{.Names}} {{.Status}}' 2>/dev/null | grep -E -i 'bot.service|bot-service|uchiha-bot' | head -15 || true
          echo '=== HTTPS READONLY ==='
          for path in / /api/health /health; do
            result=$(curl -sS --max-time 10 --output /dev/null --write-out '%{http_code}|%{ssl_verify_result}' "https://uchiha-bot.155-254-35-187.sslip.io$path" 2>/dev/null) || result=UNREACHABLE
            echo "HTTPS $path $result"
          done
          REMOTE

      - name: Test safe private-repository access from existing VPS
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -p "${PORT:-22}" -i ~/.ssh/bot_service_audit "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes"
          REPO=git@github.com:yaminuchiha1245-png/UCHIHA-Bot-Service.git
          if timeout 20 git ls-remote "$REPO" refs/heads/main >/dev/null 2>&1; then
            echo 'PRIVATE_REPO_SSH_ACCESS=YES'
          else
            echo 'PRIVATE_REPO_SSH_ACCESS=NO'
          fi
          if timeout 20 git ls-remote https://github.com/yaminuchiha1245-png/UCHIHA-Bot-Service.git refs/heads/main >/dev/null 2>&1; then
            echo 'PRIVATE_REPO_HTTPS_ACCESS=YES'
          else
            echo 'PRIVATE_REPO_HTTPS_ACCESS=NO'
          fi
          REMOTE

      - name: Create dedicated GitHub deploy identity on VPS
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -p "${PORT:-22}" -i ~/.ssh/bot_service_audit "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/uchiha_bot_service_repo_ed25519"
          if [ ! -f "$KEY" ]; then
            test ! -e "$KEY.pub"
            ssh-keygen -q -t ed25519 -C 'uchiha-bot-service-vps-repo' -N '' -f "$KEY"
            echo 'DEPLOY_IDENTITY=CREATED'
          else
            echo 'DEPLOY_IDENTITY=REUSED'
            ssh-keygen -y -f "$KEY" > "$KEY.pub"
          fi
          chmod 600 "$KEY" && chmod 644 "$KEY.pub"
          echo 'DEPLOY_PUBLIC_KEY_BEGIN'
          cat "$KEY.pub"
          echo 'DEPLOY_PUBLIC_KEY_END'
          ssh-keygen -lf "$KEY.pub" | awk '{print "DEPLOY_FINGERPRINT="$2}'
          REMOTE

      - name: Create encrypted temporary source snapshot
        if: false # Complete safe baseline already captured and verified locally
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p secure
          cat > secure/ephemeral-public.pem <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAj3YV4YMVtMaDGvF/wicb
          8okRXcC39vpNTgCfpIITwpn65Xd22H5ozivrV9P6mNbtWZBvNbmuLrC5dsY2lvdX
          g5LF7VJM+FwDYfI6j2J/w7LEC77YZWLiQnxnp5Fy585wc2Rlkko1YB26PVltwarj
          OgaiysMMhewNsWIsJ80r+7tidG0cWmVpQK8HpRThkpBfIXgpvrc6z4RrOXPODwfz
          sLhdgpR619+CGbaWw4hlcjOvB8vjEuyqGZlsP5fETo07YuDMcz/6R3NBDqFY3xqI
          ngBB7WTPL7frpLl9k6FZ2YBafl6L8Fv6uNl+YXE1ap2PqTbWDqSvpRIXf1RmBSpO
          gJFRGTZBp7GgCV11RDE8UtU7K93fBw4L41k9nn4KEkM0zlwly+DJyALqkSyNssod
          hcT8km8LWnzd9PMJ7kKnV8IylQQ9TcY4s1WMnsqMzx0eGzFoz1DclS5zZwTMxxKn
          I9C6jCWmTfUu1zJTPQNj78YS4hzcCLBRTWH4Zbi+PFYdAgMBAAE=
          -----END PUBLIC KEY-----
          PUBKEY
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -p "${PORT:-22}" -i ~/.ssh/bot_service_audit "$USER@$HOST" 'bash -s' > secure/source.tar.gz <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/opt/uchiha/projects/bot-service-stage/uchiha-bot-service
          cd "$ROOT"
          paths=()
          for p in VERSION README.md docs apps android tests scripts static packages infra requirements.txt; do
            if [ -e "$p" ]; then paths+=("$p"); fi
          done
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(
            find "${paths[@]}" -type f -size -2M \
              ! -path '*/.git/*' ! -path '*/.ws*/*' ! -path '*/.gradle/*' ! -path '*/node_modules/*' ! -path 'apps/miniapp/assets/*' \
              ! -path '*/build/*' ! -path '*/dist/*' ! -path '*/venv/*' ! -path '*/.venv/*' \
              ! -path '*/__pycache__/*' ! -path '*/media/*' ! -path '*/uploads/*' \
              ! -iname '*.env' ! -iname '*.env.*' ! -iname '*.key' ! -iname '*.pem' \
              ! -iname '*.jks' ! -iname '*.keystore' ! -iname '*.p12' ! -iname '*.pfx' \
              ! -iname '*token*' ! -iname '*secret*' ! -iname '*password*' ! -iname '*credential*' \
              \( -name 'VERSION' -o -iname '*.py' -o -iname '*.md' -o -iname '*.patch' -o -iname '*.js' \
                 -o -iname '*.json' -o -iname '*.html' -o -iname '*.css' -o -iname '*.ts' \
                 -o -iname '*.tsx' -o -iname '*.kt' -o -iname '*.java' -o -iname '*.xml' \
                 -o -iname '*.gradle' -o -iname '*.kts' -o -iname '*.sh' -o -iname '*.yml' \
                 -o -iname '*.yaml' -o -iname '*.toml' -o -iname '*.txt' -o -iname '*.webmanifest' \
                 -o -iname '*.png' -o -iname '*.svg' -o -iname '*.ico' -o -iname '*.woff2' \
                 -o -iname 'Dockerfile*' -o -iname 'Caddyfile' -o -iname '*.conf' \
                 -o -iname '*.js.gz' -o -iname '*.css.gz' -o -iname '*.js.br' -o -iname '*.css.br' \) -print0
          )
          # Carry only immutable assets currently referenced by the live HTML,
          # with their exact gzip and brotli siblings (not historical releases).
          ACTIVE_HTML=apps/miniapp/index.html
          test -s "$ACTIVE_HTML"
          mapfile -t live_assets < <(grep -oE '/assets/uchiha-[a-z0-9-]+-[a-f0-9]{16}\.(css|js)' "$ACTIVE_HTML" | sort -u)
          test "${#live_assets[@]}" -eq 4
          for item in "${live_assets[@]}"; do
            path="apps/miniapp$item"
            for part in "$path" "$path.gz" "$path.br"; do
              test -s "$part"
              files+=("$part")
            done
          done
          if [ "${#files[@]}" -eq 0 ]; then exit 3; fi
          printf '%s\0' "${files[@]}" | tar --null --files-from=- -czf -
          REMOTE
          test -s secure/source.tar.gz
          bytes="$(stat -c %s secure/source.tar.gz)"
          if [ "$bytes" -gt 25165824 ]; then echo 'SNAPSHOT=TOO_LARGE'; exit 2; fi
          python3 -c 'from cryptography.hazmat.primitives.ciphers.aead import AESGCM' || python3 -m pip install --quiet cryptography
          python3 - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path('secure')
          pub=serialization.load_pem_public_key((root/'ephemeral-public.pem').read_bytes())
          key=os.urandom(32)
          nonce=os.urandom(12)
          plain=(root/'source.tar.gz').read_bytes()
          data=b'UCH1'+nonce+AESGCM(key).encrypt(nonce,plain,b'UCHIHA-00-20260927')
          (root/'source.enc').write_bytes(data)
          (root/'key.enc').write_bytes(pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None)))
          (root/'source.tar.gz').unlink()
          (root/'ephemeral-public.pem').unlink()
          print('ENCRYPTED_SOURCE_BYTES='+str(len(data)))
          PY

      - name: Upload encrypted snapshot only
        if: false # Access-key setup only; no source export needed
        uses: actions/upload-artifact@v4
        with:
          name: bot-service-audit-encrypted-${{ github.run_id }}
          path: |
            secure/source.enc
            secure/key.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
