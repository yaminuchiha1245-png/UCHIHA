name: Game Zone Admin V6 Readiness Verify

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-admin-v6-readiness-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST"; test -n "$VPS_KEY_B64"; PORT="${PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/uchiha_vps
          chmod 600 ~/.ssh/uchiha_vps
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts
      - name: Verify live owner readiness dashboard
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"; USER="${USER:-root}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/uchiha_vps -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE' | tee /tmp/game-zone-admin-v6-readiness.txt
          set -Eeuo pipefail
          TARGET=/opt/uchiha/projects/game-zone
          ENV=/etc/uchiha/secrets/game-zone.env
          cd "$TARGET"
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/index.html
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/admin.js
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' admin/v5.css
          echo 'ADMIN_V6_SOURCE=PASS'
          cd deploy
          ln -sfn "$ENV" .env.production
          domain="$(awk -F= '$1=="DOMAIN"{print substr($0,index($0,"=")+1); exit}' .env.production)"
          test -n "$domain"
          html="$(curl -fsS --retry 3 --retry-delay 1 --max-time 15 "https://$domain/admin/")"
          grep -Fq 'جاهزية تشغيل المتجر' <<<"$html"
          css="$(curl -fsS --retry 3 --retry-delay 1 --max-time 15 "https://$domain/admin/v5.css?v=500")"
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' <<<"$css"
          js="$(curl -fsS --retry 3 --retry-delay 1 --max-time 15 "https://$domain/admin/admin.js")"
          grep -Fq 'GAME_ZONE_OWNER_READINESS_V6' <<<"$js"
          echo 'ADMIN_V6_PUBLIC_ASSETS=PASS'
          server_cid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q server)"
          test -n "$server_cid"
          docker exec "$server_cid" node -e 'const b="http://127.0.0.1:3000";(async()=>{const l=await fetch(b+"/api/admin/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:process.env.ADMIN_PASSWORD})});console.log("LOGIN_STATUS="+l.status);const x=await l.json().catch(()=>({}));if(!l.ok)throw new Error("login_"+(x.error||l.status));const t=x.token;if(!t)throw new Error("login_token_missing");const s=await fetch(b+"/api/admin/session",{headers:{authorization:"Bearer "+t}});const sb=await s.json().catch(()=>({}));console.log("SESSION_STATUS="+s.status);if(!s.ok)console.log("SESSION_ERROR="+String(sb.error||"unknown").slice(0,120));const r=await fetch(b+"/api/admin/readiness",{headers:{authorization:"Bearer "+t}});const d=await r.json().catch(()=>({}));console.log("READINESS_STATUS="+r.status);if(!r.ok){console.log("READINESS_ERROR="+String(d.error||"unknown").slice(0,120));process.exit(4)}if(!Array.isArray(d.checks)||!d.checks.length)process.exit(5);console.log("READINESS_ENDPOINT=PASS");console.log("READINESS_READY="+String(!!d.ready));console.log("READINESS_CHECKS="+d.checks.length);console.log("READINESS_PENDING="+d.checks.filter(c=>!c.ok).length)})().catch(e=>{console.error(String(e.message||e).slice(0,160));process.exit(6)})'
          echo "DEPLOYED_SHA=$(cat "$TARGET/.deployed-commit")"
          echo 'GAME_ZONE_ADMIN_V6_READINESS=PASS'
          REMOTE
      - name: Record admin v6 readiness status
        shell: bash
        run: |
          set -Eeuo pipefail
          cp /tmp/game-zone-admin-v6-readiness.txt ops/game-zone-admin-v6-readiness-status.txt
          printf 'verified_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> ops/game-zone-admin-v6-readiness-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/game-zone-admin-v6-readiness-status.txt
          git commit -m 'ops(game-zone): record admin v6 readiness verification' || exit 0
          git push origin HEAD:game-zone/rc20-production

# rerun after readiness route ordering fix
