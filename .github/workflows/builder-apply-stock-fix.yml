name: UCHIHA Builder Apply Stock Fix

on:
  push:
    branches:
      - "builder/v1-platform"
    paths:
      - ".github/agent-stock-fix/**"
      - ".github/workflows/builder-apply-stock-fix.yml"

permissions:
  contents: write

concurrency:
  group: builder-stock-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: builder/v1-platform
          fetch-depth: 0
      - name: Verify and apply stock fix
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-stock-fix/patch.gz.b64 | base64 --decode | gzip --decompress > /tmp/stock-fix.patch
          echo "60f2b3fabf03b9a82be3c2611b14fc847e51d6aa1561a73f1c9d552a608ac649  /tmp/stock-fix.patch" | sha256sum --check --strict
          git apply --check /tmp/stock-fix.patch
          git apply --index /tmp/stock-fix.patch
          rm -rf .github/agent-stock-fix
          rm -f .github/workflows/builder-apply-stock-fix.yml
          git add -A
          git diff --cached --check
      - name: Commit stock fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(builder): make wallet stock deduction deterministic"
          git push origin HEAD:builder/v1-platform
