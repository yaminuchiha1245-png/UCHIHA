name: Game Zone Owner Payment Onboarding V7

on:
  push:
    branches:
      - game-zone/rc20-production
    paths:
      - .github/workflows/game-zone-owner-payment-onboarding-v7.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply owner payment onboarding
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ops/apply-owner-payment-onboarding-v7.py
          node --check admin/admin.js
          grep -Fq 'GAME_ZONE_OWNER_PAYMENT_ONBOARDING_V7' admin/index.html
          grep -Fq 'GAME_ZONE_OWNER_PAYMENT_ONBOARDING_V7' admin/admin.js
          grep -Fq 'GAME_ZONE_OWNER_PAYMENT_ONBOARDING_V7' admin/v5.css
          grep -Fq 'page==="payments"' admin/admin.js
          echo 'OWNER_PAYMENT_ONBOARDING_V7=PASS'
      - name: Commit UI changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html admin/admin.js admin/v5.css
          git commit -m 'feat(game-zone): streamline owner payment onboarding' || exit 0
          git push origin HEAD:game-zone/rc20-production
