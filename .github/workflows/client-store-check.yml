name: Client Store Check

on:
  push:
    branches:
      - client/ios-android-services-store-v1
  pull_request:
    branches:
      - main

jobs:
  validate-client-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile client files
        run: |
          python -m py_compile client_services_store.py client_api_sync.py client_store_admin.py client_provider_admin.py client_setup.py client_store_launcher.py tests/test_client_store_logic.py

      - name: Import client modules
        run: |
          python -c "import client_services_store, client_api_sync, client_store_admin, client_provider_admin, client_setup; print('client store imports PASS')"

      - name: Run client store tests
        run: |
          python -m unittest tests/test_client_store_logic.py -v
