name: Game Zone Bot Live Diagnostic

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-bot-live-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST"; test -n "$VPS_KEY_B64"; PORT="${PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/uchiha_vps
          chmod 600 ~/.ssh/uchiha_vps
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify live Telegram polling and welcome asset
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"; USER="${USER:-root}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/uchiha_vps -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          target=/opt/uchiha/projects/game-zone
          cd "$target/deploy"
          ln -sfn /etc/uchiha/secrets/game-zone.env .env.production
          cid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q bot)"
          test -n "$cid"
          test "$(docker inspect -f '{{.State.Status}}' "$cid")" = running
          docker exec "$cid" sh -lc 'test -s /app/miniapp/icon-512.png'
          echo 'WELCOME_ASSET_PRESENT=YES'
          echo "BOT_RESTART_COUNT=$(docker inspect -f '{{.RestartCount}}' "$cid")"

          docker exec "$cid" node - <<'NODE'
          const token=process.env.BOT_TOKEN;
          Promise.all([
            fetch(`https://api.telegram.org/bot${token}/getMe`).then(r=>r.json()),
            fetch(`https://api.telegram.org/bot${token}/getWebhookInfo`).then(r=>r.json())
          ]).then(([me,wh])=>{
            if(!me.ok||String(me.result?.username||'')!=='gamezone1store_bot') process.exit(2);
            if(wh.result?.url) process.exit(3);
            console.log('BOT_USERNAME='+String(me.result.username));
            console.log('WEBHOOK_URL=EMPTY');
            console.log('PENDING_UPDATE_COUNT='+Number(wh.result?.pending_update_count||0));
          }).catch(()=>process.exit(4));
          NODE

          token_hash="$(docker exec "$cid" sh -lc 'printf %s "$BOT_TOKEN" | sha256sum | cut -d" " -f1')"
          pollers=0
          for other in $(docker ps -q); do
            h="$(docker exec "$other" sh -lc 'if [ -n "$BOT_TOKEN" ]; then printf %s "$BOT_TOKEN" | sha256sum | cut -d" " -f1; fi' 2>/dev/null || true)"
            [ "$h" = "$token_hash" ] || continue
            if docker exec "$other" sh -lc 'ps -o args= 2>/dev/null | grep -F "node bot.js" | grep -v grep >/dev/null' 2>/dev/null; then
              pollers=$((pollers+1))
              echo "POLLING_CONTAINER=$(docker inspect -f '{{.Name}}' "$other" | sed 's#^/##')"
            fi
          done
          echo "ACTIVE_BOT_POLLERS=$pollers"
          test "$pollers" = 1

          r0="$(docker inspect -f '{{.RestartCount}}' "$cid")"; sleep 8; r1="$(docker inspect -f '{{.RestartCount}}' "$cid")"; test "$r0" = "$r1"
          logs="$(docker logs --since "$(docker inspect -f '{{.State.StartedAt}}' "$cid")" "$cid" 2>&1 || true)"
          ! printf '%s' "$logs" | grep -q "ENOENT: no such file or directory, realpath '/app/miniapp/icon-512.png'"
          ! printf '%s' "$logs" | grep -qiE '409 Conflict|terminated by other getUpdates request'
          echo 'WELCOME_ASSET_ERROR=NONE'
          echo 'BOT_POLLING_CONFLICT=NONE'

          server_cid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q server)"
          test -n "$server_cid"
          docker exec "$server_cid" node -e 'fetch("http://127.0.0.1:3000/api/health/ready").then(r=>{console.log("SERVER_READY_HTTP="+r.status);if(!r.ok)process.exit(2)}).catch(()=>process.exit(3))'
          echo 'GAME_ZONE_BOT_LIVE_FIX=PASS'
          REMOTE
