name: UCHIHA RADIUS provider unit detail audit

on:
  push:
    branches: [radius/release-cleanup-live-only-20261013]
    paths:
      - ".github/workflows/radius-provider-unit-detail-audit-20261013.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: UCHIHA VPS NEW
    env:
      VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.UCHIHA_VPS_USER || secrets.VPS_USER }}
      VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
      VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.UCHIHA_VPS_PORT || secrets.VPS_PORT || '22' }}
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'sudo -n bash -se' <<'REMOTE'
          set -Eeuo pipefail
          unit=uchiha-radius-provider-api.service
          echo "=== UNIT ==="
          systemctl cat "$unit"
          echo "=== SHOW ==="
          systemctl show "$unit" -p FragmentPath -p DropInPaths -p WorkingDirectory -p ExecStart -p EnvironmentFiles --no-pager
          echo "=== RELEASES ==="
          find /opt/uchiha-radius/releases -maxdepth 3 -type f \( -path '*/packages/contracts/src/index.js' -o -path '*/dist/fast-v183/index.html' \) -printf '%p\n' 2>/dev/null | sort | tail -30
          for f in /opt/uchiha-radius/releases/*/app/packages/contracts/src/index.js; do
            test -f "$f" || continue
            printf 'VERSION %s ' "$f"
            grep -oE 'APP_VERSION = "[^"]+"' "$f" || true
          done
          REMOTE
