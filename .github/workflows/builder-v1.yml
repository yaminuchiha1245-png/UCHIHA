name: UCHIHA Builder Bootstrap Cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/builder-v1.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: builder/v1-platform
          fetch-depth: 0
      - name: Remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github/validation
          git add -A .github/validation
          git diff --cached --check
          git commit -m "chore(ci): remove bootstrap validation artifacts"
          git push origin HEAD:builder/v1-platform
