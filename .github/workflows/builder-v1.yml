name: UCHIHA Builder V1

on:
  push:
    branches:
      - "builder/**"
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"
  pull_request:
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-test-results
          path: builder/test-results.log
          if-no-files-found: error
          retention-days: 7

  staging-smoke:
    name: Staging smoke
    needs: validate
    if: ${{ github.event_name == 'push' && vars.BUILDER_STAGING_URL != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder
    env:
      SMOKE_BASE_URL: ${{ vars.BUILDER_STAGING_URL }}
      SMOKE_ALLOW_DEGRADED: ${{ vars.BUILDER_STAGING_ALLOW_DEGRADED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - run: npm ci
      - name: Audit live Railway deployment
        run: npm run smoke:staging
