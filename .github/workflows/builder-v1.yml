name: UCHIHA Builder V1

on:
  push:
    branches:
      - "builder/**"
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"

permissions:
  contents: read

concurrency:
  group: builder-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node and PostgreSQL validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uchiha_builder_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uchiha_builder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/uchiha_builder_ci
      REQUIRE_POSTGRES_TESTS: "true"
      NODE_ENV: test
      CI: "true"
    defaults:
      run:
        working-directory: builder

    steps:
      - name: Checkout clean source tree
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Syntax and type checks
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run all tests including PostgreSQL integrations
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-test-results-${{ github.sha }}
          path: |
            builder/test-results.log
            builder/dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Android debug APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: builder/mobile

    steps:
      - name: Checkout clean source tree
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: builder/mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install mobile dependencies
        run: npm ci

      - name: Synchronize Capacitor projects
        run: npm run sync

      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          npm run apk:debug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: uchiha-owner-android-debug
          path: builder/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
