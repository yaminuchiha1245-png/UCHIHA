name: UCHIHA Builder V1

on:
  push:
    branches:
      - "builder/**"
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"
  pull_request:
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - name: Apply staged worker hardening
        if: github.event_name == 'push'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [ -f builder/.worker-hardening.patch.xz.b64 ]; then
            base64 -d builder/.worker-hardening.patch.xz.b64 | xz -d > /tmp/worker-hardening.patch
            echo 'a6d4c586005fd593ace894fbe5e23e6c17324cf59793c72ffe815aa7f9d0b05b  /tmp/worker-hardening.patch' | sha256sum -c -
            git apply --check /tmp/worker-hardening.patch
            git apply /tmp/worker-hardening.patch
          fi
      - run: npm ci
      - run: npm run check
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-test-results
          path: builder/test-results.log
          if-no-files-found: error
          retention-days: 7
      - name: Finalize worker hardening
        if: github.event_name == 'push' && success()
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [ -f builder/.worker-hardening.patch.xz.b64 ]; then
            rm builder/.worker-hardening.patch.xz.b64
            rm -f .github/workflows/apply-worker-hardening.yml
            git show HEAD^:.github/workflows/builder-v1.yml > .github/workflows/builder-v1.yml
            git config user.name 'UCHIHA Builder'
            git config user.email 'builder@uchiha.local'
            git add -A builder .github/workflows
            git commit -m 'fix(builder): atomically claim worker jobs'
            git push origin HEAD:builder/v1-platform
          fi
