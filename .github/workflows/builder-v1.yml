name: UCHIHA Builder V1

on:
  workflow_dispatch:
  push:
    branches:
      - "builder/**"
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"

permissions:
  contents: read

concurrency:
  group: builder-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node, PostgreSQL, Docker, and smoke validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uchiha_builder_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uchiha_builder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/uchiha_builder_ci
      REQUIRE_POSTGRES_TESTS: "true"
      NODE_ENV: test
      CI: "true"
    defaults:
      run:
        working-directory: builder

    steps:
      - name: Checkout clean source tree
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Syntax and type checks
        run: npm run check

      - name: Shell syntax checks
        run: bash -n scripts/*.sh

      - name: Lint
        run: npm run lint

      - name: Build runtime bundle
        run: npm run build

      - name: Build production Docker image
        run: docker build -t uchiha-builder-ci .

      - name: Run all tests including PostgreSQL integrations
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log

      - name: Apply production migrations twice
        env: &production_env
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: "4100"
          PREVIEW_MEMORY_MODE: "false"
          REQUIRE_PERSISTENT_DATABASE: "true"
          DATABASE_MODE: postgres
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/uchiha_builder_ci
          DATABASE_SSL: "false"
          APP_BASE_URL: https://uchiha-builder.com
          STORE_BASE_DOMAIN: uchiha-builder.com
          COOKIE_SECURE: "true"
          APP_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==
          RATE_LIMIT_ENABLED: "true"
          DEMO_SEED: "false"
          ALLOW_DEMO_BILLING: "false"
          TELEGRAM_MODE: live
          UCHIHA_API_1_MODE: test
          UCHIHA_API_1_ADAPTER: mock
          UCHIHA_FULL_NAME: UCHIHA Full CI
          UCHIHA_FULL_PRICE_MINOR: "1000"
          UCHIHA_FULL_RENEWAL_PRICE_MINOR: "1000"
          UCHIHA_FULL_CURRENCY: USD
          UCHIHA_FULL_DURATION_UNIT: month
          UCHIHA_FULL_DURATION_COUNT: "1"
          UCHIHA_FULL_TRIAL_DAYS: "0"
        run: |
          npm run bootstrap
          npm run bootstrap

      - name: Verify production configuration and HTTP smoke tests
        env: *production_env
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run verify:production
          npm start > production-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat production-server.log' EXIT
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4100/ready >/dev/null && break
            sleep 1
          done
          SMOKE_BASE_URL=http://127.0.0.1:4100 npm run smoke:production
          curl -fsS http://127.0.0.1:4100/store/demo | grep -qi '<html'
          curl -fsS http://127.0.0.1:4100/assets/preview-banner.js | grep -q '/store/demo'
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-test-results-${{ github.sha }}
          path: |
            builder/test-results.log
            builder/production-server.log
            builder/dist/build-manifest.json
          if-no-files-found: warn
          retention-days: 14

  android-apk:
    name: Android debug APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: builder/mobile

    steps:
      - name: Checkout clean source tree
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: builder/mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install mobile dependencies
        run: npm ci

      - name: Synchronize Capacitor projects
        run: npm run sync

      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          npm run apk:debug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: uchiha-owner-android-debug
          path: builder/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-deploy-ref:
    name: Publish validated VPS release
    needs: validate
    if: >-
      github.ref == 'refs/heads/builder/v1-platform' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish deploy branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git push --force origin "HEAD:refs/heads/deploy/builder-v1-platform"

      - name: Release summary
        run: |
          echo "### Validated Builder release published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`builder/v1-platform\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy ref: \`deploy/builder-v1-platform\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- The VPS can deploy this commit with builder/scripts/update-vps.sh." >> "$GITHUB_STEP_SUMMARY"
