name: UCHIHA Builder V1

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/builder-v1.yml"
      - ".github/validation/**"

permissions:
  contents: write

concurrency:
  group: builder-bootstrap-pr-validation
  cancel-in-progress: false

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uchiha_builder_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uchiha_builder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/uchiha_builder_ci
      REQUIRE_POSTGRES_TESTS: "true"
      NODE_ENV: test
      CI: "true"

    steps:
      - name: Checkout staged builder branch
        uses: actions/checkout@v4
        with:
          ref: builder/v1-platform
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Reconstruct and verify patches
        shell: bash
        run: |
          set -euo pipefail
          cat .github/validation/patch-part-*.txt | base64 --decode > /tmp/uchiha-changes.patch.xz
          echo "95a2fe8659b10f12ebc5f86787e4749b9cd5003236cb78e70baf779db7d5da5b  /tmp/uchiha-changes.patch.xz" | sha256sum --check -
          xz --decompress --stdout /tmp/uchiha-changes.patch.xz > /tmp/uchiha-changes.patch
          for n in 01 02 03 04; do
            base64 --decode ".github/validation/hotfix-${n}.txt" > "/tmp/uchiha-hotfix-${n}.patch.xz"
            xz --decompress --stdout "/tmp/uchiha-hotfix-${n}.patch.xz" > "/tmp/uchiha-hotfix-${n}.patch"
          done
          echo "12f8cd3d9179b67a98b1193c29d11d64815c399a5b50a2e4f4c563905ca07c86  /tmp/uchiha-hotfix-01.patch.xz" | sha256sum --check -
          echo "3b650a9353b14b460b0715955763d0a9e02149be4a9647a9218da8f5b870e9e3  /tmp/uchiha-hotfix-02.patch.xz" | sha256sum --check -
          echo "6d6ca8c035b377b1877c006f5afbf9dab16b845a9f72989c0a891b23bc2d8561  /tmp/uchiha-hotfix-03.patch.xz" | sha256sum --check -
          echo "68e332e9c4db52f4f926d06f2678dacb44cfad1a16ccf8d5d2c28576df0e9b56  /tmp/uchiha-hotfix-04.patch.xz" | sha256sum --check -
          git checkout 68cf7ac281e83e40e2ae279645fbe8c2f79b493b -- .github/workflows/builder-v1.yml
          git apply /tmp/uchiha-changes.patch
          for n in 01 02 03 04; do git apply "/tmp/uchiha-hotfix-${n}.patch"; done

      - name: Install dependencies
        working-directory: builder
        run: npm ci

      - name: Check
        working-directory: builder
        run: npm run check

      - name: Lint
        working-directory: builder
        run: npm run lint

      - name: Build
        working-directory: builder
        run: npm run build

      - name: Test with PostgreSQL
        working-directory: builder
        run: npm test

      - name: Finalize validated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github/validation .github/workflows/builder-bootstrap-validation.yml builder/dist
          git add -A
          git diff --cached --check
          git commit -m "feat(builder): complete secure multi-tenant storefront platform"
          git push origin HEAD:builder/v1-platform
