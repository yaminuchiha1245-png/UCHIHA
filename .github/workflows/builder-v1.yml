name: UCHIHA Builder V1

on:
  push:
    branches:
      - builder/v1-platform
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"

permissions:
  contents: write

concurrency:
  group: builder-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uchiha_builder_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uchiha_builder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/uchiha_builder_ci
      REQUIRE_POSTGRES_TESTS: "true"
      NODE_ENV: test
      CI: "true"

    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: builder
        run: npm ci

      - name: Syntax and type checks
        working-directory: builder
        run: npm run check

      - name: Lint
        working-directory: builder
        run: npm run lint

      - name: Build
        working-directory: builder
        run: npm run build

      - name: Tests including four PostgreSQL integrations
        working-directory: builder
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: builder-v1-validation-${{ github.sha }}
          path: |
            builder/test-results.log
            builder/dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove bootstrap patch artifacts
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github/validation builder/dist builder/test-results.log
          git add -A .github/validation
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ci): remove bootstrap validation artifacts"
          git push origin HEAD:builder/v1-platform
