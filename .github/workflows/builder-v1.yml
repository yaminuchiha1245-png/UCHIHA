name: UCHIHA Builder V1

on:
  push:
    branches:
      - "builder/**"
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"
  pull_request:
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-test-results
          path: builder/test-results.log
          if-no-files-found: error
          retention-days: 7

  android-apk:
    name: Android debug APK
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: builder/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - run: npm run sync
      - run: chmod +x android/gradlew
      - run: npm run apk:debug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: uchiha-owner-android-debug
          path: builder/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  staging-smoke:
    name: Staging smoke
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder
    env:
      SMOKE_BASE_URL: https://uchiha-production-a7e5.up.railway.app
      SMOKE_ALLOW_DEGRADED: "false"
      SMOKE_TIMEOUT_MS: "30000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - run: npm ci
      - name: Audit live Railway deployment
        run: npm run smoke:staging
