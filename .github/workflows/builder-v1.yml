name: UCHIHA Builder V1

on:
  workflow_dispatch:
  push:
    branches:
      - "builder/**"
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "builder/**"
      - ".github/workflows/builder-v1.yml"

permissions:
  contents: read

concurrency:
  group: builder-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node and PostgreSQL validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uchiha_builder_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uchiha_builder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/uchiha_builder_ci
      REQUIRE_POSTGRES_TESTS: "true"
      NODE_ENV: test
      CI: "true"
    defaults:
      run:
        working-directory: builder

    steps:
      - name: Checkout clean source tree
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Syntax and type checks
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run all tests including PostgreSQL integrations
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-test-results-${{ github.sha }}
          path: |
            builder/test-results.log
            builder/dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Android debug APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: builder/mobile

    steps:
      - name: Checkout clean source tree
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: builder/mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install mobile dependencies
        run: npm ci

      - name: Synchronize Capacitor projects
        run: npm run sync

      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          npm run apk:debug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: uchiha-owner-android-debug
          path: builder/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  deploy-vps:
    name: Deploy Builder to production VPS
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/builder/v1-platform') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

    steps:
      - name: Check deployment secrets
        id: deployment-secrets
        shell: bash
        run: |
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_SSH_PRIVATE_KEY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS deployment skipped until VPS_HOST, VPS_USER and VPS_SSH_PRIVATE_KEY are configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.deployment-secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$VPS_SSH_PRIVATE_KEY" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p 22 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Backup, update and restart production
        if: steps.deployment-secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p 22 -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          REPO_DIR="/opt/uchiha"
          DEPLOY_DIR="/opt/uchiha-deploy"
          BRANCH="builder/v1-platform"
          BACKUP_DIR="$DEPLOY_DIR/backups"
          TIMESTAMP="$(date -u +%Y-%m-%d_%H-%M-%S)"

          test -d "$REPO_DIR/.git"
          test -f "$DEPLOY_DIR/compose.yml"
          test -f "$DEPLOY_DIR/.env"

          mkdir -p "$BACKUP_DIR"
          cd "$DEPLOY_DIR"

          docker compose exec -T postgres \
            pg_dump -U uchiha -d uchiha_builder -Fc \
            > "$BACKUP_DIR/uchiha_builder_${TIMESTAMP}.dump"

          find "$BACKUP_DIR" -type f -name '*.dump' -mtime +14 -delete

          cd "$REPO_DIR"
          GIT_SSH_COMMAND='ssh -i /root/.ssh/uchiha_deploy -o IdentitiesOnly=yes' \
            git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

          cd "$DEPLOY_DIR"
          docker compose build api worker
          docker compose run --rm api npm run bootstrap
          docker compose up -d --remove-orphans api worker postgres

          ready=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:4100/ready \
              | grep -q '"status":"ready"'; then
              ready=true
              break
            fi
            sleep 3
          done

          if [[ "$ready" != "true" ]]; then
            docker compose logs --tail=150 api worker
            echo "Production readiness check failed" >&2
            exit 1
          fi

          docker compose ps
          curl --fail --silent --show-error http://127.0.0.1:4100/ready
          REMOTE

      - name: Deployment summary
        if: steps.deployment-secrets.outputs.ready == 'true'
        run: |
          echo "### UCHIHA Builder VPS deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`builder/v1-platform\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database backup created before deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- PostgreSQL, API and worker health checked" >> "$GITHUB_STEP_SUMMARY"
