name: Game Zone Mini App V23 Postdeploy Verify

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-miniapp-v23-postdeploy-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production

      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST"; test -n "$VPS_KEY_B64"; PORT="${PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/uchiha_vps
          chmod 600 ~/.ssh/uchiha_vps
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify fast live Mini App
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"; USER="${USER:-root}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/uchiha_vps -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE' | tee /tmp/game-zone-v23-live.txt
          set -Eeuo pipefail
          target=/opt/uchiha/projects/game-zone
          env_file=/etc/uchiha/secrets/game-zone.env
          cd "$target/deploy"
          ln -sfn "$env_file" .env.production
          domain="$(awk -F= '$1=="DOMAIN"{print substr($0,index($0,"=")+1); exit}' "$env_file")"
          test -n "$domain"
          test "$(cat "$target/.deployed-commit")" = "b5cb36e34133568712b5a86f02cb79a6d934f48f"
          echo 'DEPLOYED_V23_SHA=PASS'

          grep -F 'prepareTelegramShell();' "$target/miniapp/app.js" >/dev/null
          grep -F 'tg.ready();' "$target/miniapp/app.js" >/dev/null
          grep -F 'const [config,categories,products,announcements]=await Promise.all([' "$target/miniapp/app.js" >/dev/null
          grep -F 'Promise.allSettled([loadPrivateData(),loadOrders(),loadWallet()])' "$target/miniapp/app.js" >/dev/null
          grep -F 'addToHomeScreen' "$target/miniapp/app.js" >/dev/null
          grep -F 'checkHomeScreenStatus' "$target/miniapp/app.js" >/dev/null
          grep -F 'preview:API_BASE===null' "$target/miniapp/app.js" >/dev/null
          grep -F 'id="homeShortcutBtn"' "$target/miniapp/index.html" >/dev/null
          grep -F 'app.js?v=230' "$target/miniapp/index.html" >/dev/null
          grep -F 'v21.js?v=230' "$target/miniapp/index.html" >/dev/null
          grep -F 'game-zone-v23-static' "$target/miniapp/sw.js" >/dev/null
          ! grep -F 'fonts.googleapis.com' "$target/miniapp/index.html"
          echo 'FAST_START_SOURCE=PASS'
          echo 'HOME_SHORTCUT_SOURCE=PASS'
          echo 'LIVE_MODE_SOURCE=PASS'
          echo 'CACHE_V23_SOURCE=PASS'

          root_html="$(curl -fsS --max-time 12 "https://$domain/")"
          printf '%s' "$root_html" | grep -F 'app.js?v=230' >/dev/null
          printf '%s' "$root_html" | grep -F 'id="homeShortcutBtn"' >/dev/null
          app_js="$(curl -fsS --max-time 12 "https://$domain/app.js?v=230")"
          printf '%s' "$app_js" | grep -F 'prepareTelegramShell();' >/dev/null
          printf '%s' "$app_js" | grep -F 'addToHomeScreen' >/dev/null
          printf '%s' "$app_js" | grep -F 'checkHomeScreenStatus' >/dev/null
          sw_js="$(curl -fsS --max-time 12 "https://$domain/sw.js")"
          printf '%s' "$sw_js" | grep -F 'game-zone-v23-static' >/dev/null
          echo 'PUBLIC_V23_ASSETS=PASS'

          for path in / /app.js?v=230 /api/config /api/categories /api/products /api/announcements; do
            t="$(curl -sS -o /dev/null --max-time 12 -w '%{http_code} %{time_total}' "https://$domain$path")"
            code="${t%% *}"; seconds="${t#* }"
            test "$code" = 200
            echo "HTTP_TIMING $path $seconds"
          done

          server_cid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q server)"
          bot_cid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q bot)"
          test -n "$server_cid"; test -n "$bot_cid"
          test "$(docker inspect -f '{{.State.Status}}' "$server_cid")" = running
          test "$(docker inspect -f '{{.State.Health.Status}}' "$server_cid")" = healthy
          test "$(docker inspect -f '{{.State.Status}}' "$bot_cid")" = running

          token_hash="$(docker exec "$bot_cid" sh -lc 'printf %s "$BOT_TOKEN" | sha256sum | cut -d" " -f1')"
          pollers=0
          for other in $(docker ps -q); do
            h="$(docker exec "$other" sh -lc 'if [ -n "$BOT_TOKEN" ]; then printf %s "$BOT_TOKEN" | sha256sum | cut -d" " -f1; fi' 2>/dev/null || true)"
            [ "$h" = "$token_hash" ] || continue
            if docker exec "$other" sh -lc 'ps -o args= 2>/dev/null | grep -F "node bot.js" | grep -v grep >/dev/null' 2>/dev/null; then pollers=$((pollers+1)); fi
          done
          test "$pollers" = 1
          r0="$(docker inspect -f '{{.RestartCount}}' "$bot_cid")"; sleep 8; r1="$(docker inspect -f '{{.RestartCount}}' "$bot_cid")"; test "$r0" = "$r1"
          logs="$(docker logs --since "$(docker inspect -f '{{.State.StartedAt}}' "$bot_cid")" "$bot_cid" 2>&1 || true)"
          ! printf '%s' "$logs" | grep -qiE '409 Conflict|terminated by other getUpdates request|ENOENT: no such file or directory'
          echo 'ACTIVE_BOT_POLLERS=1'
          echo 'BOT_RUNTIME_STABLE=YES'
          echo 'GAME_ZONE_MINIAPP_V23_LIVE=PASS'
          REMOTE

          {
            echo 'GAME_ZONE_MINIAPP_V23_LIVE=PASS'
            echo "verified_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            cat /tmp/game-zone-v23-live.txt
          } > ops/game-zone-miniapp-v23-status.txt

      - name: Record Mini App V23 status
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/game-zone-miniapp-v23-status.txt
          git commit -m 'ops(game-zone): record Mini App v23 live verification' || exit 0
          git push origin HEAD:game-zone/rc20-production
