name: V1-83 final registered router network path check

on:
  push:
    branches: [radius-v183/router-path-diagnosis-20261002]
    paths: [.github/workflows/radius-v183-router-network-path-final.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: UCHIHA VPS NEW
    env:
      VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.UCHIHA_VPS_USER || secrets.VPS_USER }}
      VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
      VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.UCHIHA_VPS_PORT || secrets.VPS_PORT || '22' }}

    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Check only the registered router network path
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'sudo -n bash -se' <<'REMOTE'
          set -Eeuo pipefail
          bot=/opt/uchiha-radius/release-candidates/v183-0c1ea716-20260927/telegram-bot-bundle
          python3 - "$bot" <<'PY'
          import json,pathlib,re,shlex,subprocess,sys
          unit=subprocess.check_output(["systemctl","cat","uchiha-radius-telegram-bot.service"],text=True)
          env={}
          for line in unit.splitlines():
              line=line.strip()
              if line.startswith("EnvironmentFile="):
                  try:
                      p=shlex.split(line.partition("=")[2].lstrip("-"))[0]
                      for raw in pathlib.Path(p).read_text(encoding="utf-8").splitlines():
                          if not raw or raw.startswith("#") or "=" not in raw:
                              continue
                          k,v=raw.split("=",1)
                          if re.fullmatch("[A-Z][A-Z0-9_]+",k.strip()):
                              env[k.strip()]=v.strip().strip('"').strip("'")
                  except Exception:
                      pass
              elif line.startswith("Environment="):
                  try:
                      for item in shlex.split(line.partition("=")[2]):
                          if "=" in item:
                              k,v=item.split("=",1);env[k]=v
                  except ValueError:
                      pass
          sys.path.insert(0,sys.argv[1])
          from v183_bot import V183Api
          api=V183Api(env["TELEGRAM_BOT_TOKEN"],int(env["UCHIHA_RADIUS_OWNER_TELEGRAM_ID"]))
          api.login()
          devices=api.request("/devices").get("items",[])
          print("DEVICE_COUNT",len(devices))
          if len(devices)!=1:
              raise SystemExit("expected exactly one registered tenant router")
          host=str(devices[0].get("host") or "")
          if not re.fullmatch(r"(?:\d{1,3}\.){3}\d{1,3}",host):
              raise SystemExit("registered host is not IPv4; refusing unrelated probing")

          ping=subprocess.run(["ping","-c","3","-W","2",host],text=True,capture_output=True,timeout=12)
          replies=len(re.findall(r"bytes from ",ping.stdout or "",flags=re.I))
          loss=None
          m=re.search(r"(\d+(?:\.\d+)?)% packet loss",ping.stdout or "")
          if m: loss=float(m.group(1))
          print("ICMP_RESULT "+json.dumps({
              "replies":replies,
              "packetLossPercent":loss,
              "reachableByIcmp":replies>0
          },sort_keys=True))

          route=subprocess.run(["ip","route","get",host],text=True,capture_output=True,timeout=5)
          out=(route.stdout or "").strip()
          print("ROUTE_RESULT "+json.dumps({
              "exists":route.returncode==0,
              "viaGateway":bool(re.search(r"\bvia\s+\S+",out)),
              "device":(re.search(r"\bdev\s+(\S+)",out).group(1) if re.search(r"\bdev\s+(\S+)",out) else None)
          },sort_keys=True))

          if shutil:=__import__("shutil"):
              trace=shutil.which("tracepath")
              if trace:
                  result=subprocess.run([trace,"-n","-m","12",host],text=True,capture_output=True,timeout=20)
                  lines=[line for line in (result.stdout or "").splitlines() if re.match(r"\s*\d+:",line)]
                  reached=any(re.search(r"\b"+re.escape(host)+r"\b",line) for line in lines)
                  print("TRACE_RESULT "+json.dumps({"available":True,"hopLines":len(lines),"destinationSeen":reached},sort_keys=True))
              else:
                  print("TRACE_RESULT "+json.dumps({"available":False},sort_keys=True))

          print("PASS: final path check stayed read-only and targeted only the registered router address.")
          PY
          REMOTE
