name: RADIUS V1-83 Telegram Bot - Offline Contract and Staging

on:
  pull_request:
    branches:
      - radius-v183-telegram-integration
    paths:
      - 'radius-v183/apps/telegram-bot/**'
      - 'radius-v183/apps/provider-v183-runtime/**'
      - 'radius-v183/apps/api/src/app.js'
      - 'radius-v183/packages/contracts/src/index.js'
      - 'radius-v183/scripts/build-provider-v183.mjs'
      - '.github/workflows/radius-v183-telegram-bot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radius-v183-telegram-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bot-contract-and-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: radius-v183
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: radius-v183/package-lock.json
      - name: Install pinned workspaces
        run: npm ci
      - name: Bot, permission, route-contract, and bundle regression tests
        run: python3 -m unittest discover -s apps/telegram-bot -p 'test_*.py' -q
      - name: Mini App navigation and router deeplink tests
        run: |
          set -euo pipefail
          node --test apps/provider-v183-runtime/ui-simplify.test.mjs
          if test -f apps/provider-v183-runtime/ui-deeplink.test.mjs; then
            node --test apps/provider-v183-runtime/ui-deeplink.test.mjs
          fi
      - name: Compile live V1-83 web assets
        run: node scripts/build-provider-v183.mjs server
      - name: Build and verify credential-free bot staging bundle
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/uchiha-v183-bot-release-stage"
          mirror="${RUNNER_TEMP}/uchiha-v183-bot-offline-mirror"
          python3 apps/telegram-bot/stage_bundle.py --output "$stage"
          python3 apps/telegram-bot/stage_bundle.py --verify "$stage"
          cp -a "$stage" "$mirror"
          python3 apps/telegram-bot/audit_live_bundle.py --bundle "$stage" --live "$mirror"
          test ! -e "$stage/.env"
          test ! -e "$stage/test_v183_member_workflows.py"
      - name: Publish tested, credential-free bot release bundle
        uses: actions/upload-artifact@v4
        with:
          name: uchiha-v183-telegram-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/uchiha-v183-bot-release-stage/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

  cross-workstream-integration:
    name: Current bot + UI + MikroTik backend (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: radius-v183
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: radius-v183/package-lock.json
      - name: Combine the latest sibling workstreams in this disposable checkout
        working-directory: .
        run: |
          set -euo pipefail
          for branch in radius-v183/ui-simplify radius-v183/mikrotik-core; do
            if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
              git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
              git -c user.name=UCHIHA-CI -c user.email=ci@users.noreply.github.com \
                merge --no-edit --no-ff "origin/$branch"
            else
              echo "Workstream branch $branch absent; testing current integration base"
            fi
          done
          git log -4 --format='%h %s'
          test -z "$(git status --porcelain)"
      - name: Install workspaces on the combined code tree
        run: npm ci
      - name: Combined bot, tenant permissions, and source route tests
        run: python3 -m unittest discover -s apps/telegram-bot -p 'test_*.py' -q
      - name: Combined Mini App UI and saved-device deep-link tests
        run: |
          set -euo pipefail
          node --test apps/provider-v183-runtime/ui-simplify.test.mjs
          if test -f apps/provider-v183-runtime/ui-deeplink.test.mjs; then
            node --test apps/provider-v183-runtime/ui-deeplink.test.mjs
          fi
      - name: Focused Telegram, billing, MikroTik, and RADIUS API integration
        run: |
          node --test \
            apps/api/test/telegram-miniapp-auth.test.js \
            apps/api/test/telegram-self-link.test.js \
            apps/api/test/billing-and-lifecycle.test.js \
            apps/api/test/direct-router-concurrency.test.js \
            apps/api/test/device-registration-hardening.test.js \
            apps/api/test/subscriber-access-profile.test.js \
            apps/api/test/radius-readiness.test.js \
            apps/api/test/live-bot-device-deeplink.test.js
      - name: Build combined release web UI
        run: node scripts/build-provider-v183.mjs server

  release-candidate-compatibility:
    name: Proposed owner bot + compact release candidate (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: radius-v183
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: radius-v183/package-lock.json
      - name: Apply bot-only delta to current compact candidate without overriding UI
        working-directory: .
        run: |
          set -euo pipefail
          bot_head=$(git rev-parse HEAD)
          bot_path=radius-v183/apps/telegram-bot
          # e032 is the last audited bot revision before our specific
          # HTTP-rejection classifier. The compact candidate already has
          # e032's owner retries AND separate, newer edit/delete screens.
          bot_base=e03299458e3f002cecd213961d7d75802be3a899
          git merge-base --is-ancestor "$bot_base" "$bot_head"
          git fetch origin \
            +refs/heads/radius-v183-telegram-integration:refs/remotes/origin/radius-v183-telegram-integration \
            +refs/heads/radius-v183/integration-20260926:refs/remotes/origin/radius-v183/integration-20260926 \
            +refs/heads/radius-v183/mikrotik-core:refs/remotes/origin/radius-v183/mikrotik-core
          git switch --detach origin/radius-v183/integration-20260926
          grep -Fq 'def owner_router_edit_start' "$bot_path/v183_screens.py"
          grep -Fq 'def owner_router_delete_ask' "$bot_path/v183_screens.py"
          grep -Fq 'def member_router_delete_ask' "$bot_path/v183_member_routers.py"
          grep -Fq 'expectedUpdatedAt' "$bot_path/v183_member_routers.py"
          grep -Fq 'pending["write_attempted"] = True' "$bot_path/v183_screens.py"
          git -c user.name=UCHIHA-CI -c user.email=ci@users.noreply.github.com \
            merge --no-edit --no-ff origin/radius-v183/mikrotik-core
          # The candidate retained e032's owner additions but its member
          # edit handler predates strict revision fencing. Apply exactly the
          # reviewed 14-line revision contract without replacing new delete UI.
          if ! grep -Fq 'previousUpdatedAt' "$bot_path/v183_member_routers.py"; then
            revision_runtime_patch=/tmp/v183-router-revision-runtime.patch
            git diff --binary c26b494bfd18bcd7031adf3e8260dbb922605fa6 \
              "$bot_base" -- "$bot_path/v183_member_routers.py" > "$revision_runtime_patch"
            test -s "$revision_runtime_patch"
            git apply --3way --check "$revision_runtime_patch"
            git apply --3way "$revision_runtime_patch"
          fi
          grep -Fq 'previousUpdatedAt' "$bot_path/v183_member_routers.py"
          grep -Fq 'def member_router_delete_ask' "$bot_path/v183_member_routers.py"
          # Apply only the reviewed classifier and its regression file.
          # Fail closed on a real conflict rather than overwriting candidate UI.
          patch=/tmp/v183-telegram-classifier.patch
          git diff --binary "$bot_base" "$bot_head" -- \
            "$bot_path/v183_bot.py" \
            "$bot_path/v183_screens.py" \
            "$bot_path/v183_member_workflows.py" \
            "$bot_path/v183_member_routers.py" \
            "$bot_path/test_v183_api_write_rejections.py" > "$patch"
          test -s "$patch"
          git apply --3way --check "$patch"
          git apply --3way "$patch"
          # Keep independent candidate tests, append reviewed revision tests
          # only if their exact original 18-case fixture is unchanged.
          candidate_tests=$(git hash-object "$bot_path/test_v183_member_routers.py")
          old_tests_blob=d26211aff6bf23e0b81da9c0265fdc4c48ed1bf6
          if [[ "$candidate_tests" == "$old_tests_blob" ]]; then
            revision_patch=/tmp/v183-router-revision-tests.patch
            git diff --binary origin/radius-v183-telegram-integration "$bot_base" -- \
              "$bot_path/test_v183_member_routers.py" > "$revision_patch"
            test -s "$revision_patch"
            git apply --3way --check "$revision_patch"
            git apply --3way "$revision_patch"
          else
            grep -Fq 'def test_edit_uses_exact_backend_revision_and_original_host' \
              "$bot_path/test_v183_member_routers.py"
          fi
          grep -Fq 'if explicitly_rejected_write(error)' "$bot_path/v183_screens.py"
          grep -Fq 'if explicitly_rejected_write(error)' "$bot_path/v183_member_routers.py"
          grep -Fq 'def owner_router_delete_ask' "$bot_path/v183_screens.py"
          grep -Fq 'def member_router_delete_ask' "$bot_path/v183_member_routers.py"
          git add -- "$bot_path"
          if ! git diff --cached --quiet; then
            git -c user.name=UCHIHA-CI -c user.email=ci@users.noreply.github.com \
              commit -m 'CI ONLY: preserve candidate edit/delete UI and overlay guarded bot fixes'
          fi
          git diff --check
          test -z "$(git status --porcelain)"
          git log -4 --format='%h %s'
      - name: Install pinned candidate dependencies
        run: npm ci
      - name: Entire merged Telegram bot regression suite
        run: python3 -m unittest discover -s apps/telegram-bot -p 'test_*.py' -q
      - name: Compact UI and exact saved MikroTik navigation
        run: node --test apps/provider-v183-runtime/ui-simplify.test.mjs apps/provider-v183-runtime/ui-deeplink.test.mjs
      - name: Full API suite (offline; disposable database tests run separately)
        run: npm test
      - name: Locked V1-83 fast release candidate build
        run: npm run provider:v183:fast
      - name: Verify merged candidate's credential-free bot manifest
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/uchiha-v183-merged-candidate-bot"
          python3 apps/telegram-bot/stage_bundle.py --output "$stage"
          python3 apps/telegram-bot/stage_bundle.py --verify "$stage"
          test ! -e "$stage/.env"
      - name: Publish fully tested compact candidate bot release bundle
        uses: actions/upload-artifact@v4
        with:
          name: uchiha-v183-compact-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/uchiha-v183-merged-candidate-bot/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
