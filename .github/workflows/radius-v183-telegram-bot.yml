name: RADIUS V1-83 Telegram Bot - Offline Contract and Staging

on:
  pull_request:
    branches:
      - radius-v183-telegram-integration
    paths:
      - 'radius-v183/apps/telegram-bot/**'
      - 'radius-v183/apps/provider-v183-runtime/**'
      - 'radius-v183/apps/api/src/app.js'
      - 'radius-v183/packages/contracts/src/index.js'
      - 'radius-v183/scripts/build-provider-v183.mjs'
      - '.github/workflows/radius-v183-telegram-bot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radius-v183-telegram-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bot-contract-and-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: radius-v183
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: radius-v183/package-lock.json
      - name: Install pinned workspaces
        run: npm ci
      - name: Bot, permission, route-contract, and bundle regression tests
        run: python3 -m unittest discover -s apps/telegram-bot -p 'test_*.py' -q
      - name: Mini App navigation and router deeplink tests
        run: |
          set -euo pipefail
          node --test apps/provider-v183-runtime/ui-simplify.test.mjs
          if test -f apps/provider-v183-runtime/ui-deeplink.test.mjs; then
            node --test apps/provider-v183-runtime/ui-deeplink.test.mjs
          fi
      - name: Compile live V1-83 web assets
        run: node scripts/build-provider-v183.mjs server
      - name: Build and verify credential-free bot staging bundle
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/uchiha-v183-bot-release-stage"
          mirror="${RUNNER_TEMP}/uchiha-v183-bot-offline-mirror"
          python3 apps/telegram-bot/stage_bundle.py --output "$stage"
          python3 apps/telegram-bot/stage_bundle.py --verify "$stage"
          cp -a "$stage" "$mirror"
          python3 apps/telegram-bot/audit_live_bundle.py --bundle "$stage" --live "$mirror"
          test ! -e "$stage/.env"
          test ! -e "$stage/test_v183_member_workflows.py"
      - name: Publish tested, credential-free bot release bundle
        uses: actions/upload-artifact@v4
        with:
          name: uchiha-v183-telegram-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/uchiha-v183-bot-release-stage/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

  cross-workstream-integration:
    name: Current bot + UI + MikroTik backend (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: radius-v183
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: radius-v183/package-lock.json
      - name: Combine the latest sibling workstreams in this disposable checkout
        working-directory: .
        run: |
          set -euo pipefail
          # An integration candidate already contains reviewed UI + MikroTik
          # commits. Never automatically merge *moving* sibling heads over a
          # release candidate: that mixes unreviewed changes and can generate
          # artificial CSS conflicts unrelated to the candidate being tested.
          if git cat-file -e HEAD:radius-v183/infra/postgres/migrations/016_subscriber_access_profiles.sql &&
             git cat-file -e HEAD:radius-v183/apps/provider-v183-runtime/ui-simplify.js; then
            echo "Integrated candidate detected: testing exactly the reviewed PR source."
            echo "Later UI changes remain gated in a separate integration PR."
          else
            for branch in radius-v183/ui-simplify radius-v183/mikrotik-core; do
              if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
                git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
                git -c user.name=UCHIHA-CI -c user.email=ci@users.noreply.github.com \
                  merge --no-edit --no-ff "origin/$branch"
              else
                echo "Workstream branch $branch absent; testing current integration base"
              fi
            done
          fi
          git log -4 --format='%h %s'
          test -z "$(git status --porcelain)"
      - name: Install workspaces on the combined code tree
        run: npm ci
      - name: Combined bot, tenant permissions, and source route tests
        run: python3 -m unittest discover -s apps/telegram-bot -p 'test_*.py' -q
      - name: Combined Mini App UI and saved-device deep-link tests
        run: |
          set -euo pipefail
          node --test apps/provider-v183-runtime/ui-simplify.test.mjs
          if test -f apps/provider-v183-runtime/ui-deeplink.test.mjs; then
            node --test apps/provider-v183-runtime/ui-deeplink.test.mjs
          fi
      - name: Focused Telegram, billing, MikroTik, and RADIUS API integration
        run: |
          node --test \
            apps/api/test/telegram-miniapp-auth.test.js \
            apps/api/test/telegram-self-link.test.js \
            apps/api/test/billing-and-lifecycle.test.js \
            apps/api/test/direct-router-concurrency.test.js \
            apps/api/test/device-registration-hardening.test.js \
            apps/api/test/subscriber-access-profile.test.js \
            apps/api/test/radius-readiness.test.js \
            apps/api/test/live-bot-device-deeplink.test.js
      - name: Build combined release web UI
        run: node scripts/build-provider-v183.mjs server
