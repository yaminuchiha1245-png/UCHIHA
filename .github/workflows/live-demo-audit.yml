name: UCHIHA Live Demo Audit

on:
  push:
    branches:
      - builder/v1-platform
    paths:
      - ".github/workflows/live-demo-audit.yml"
      - "builder/**"

permissions:
  contents: write

concurrency:
  group: uchiha-live-demo-audit
  cancel-in-progress: true

jobs:
  live-browser-audit:
    name: Live browser audit after VPS deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify restricted VPS credentials
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "$VPS_HOST" ]] || { echo "VPS_HOST secret is missing" >&2; exit 1; }
          [[ -n "$VPS_USER" ]] || { echo "VPS_USER secret is missing" >&2; exit 1; }
          [[ "$VPS_SSH_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]] || { echo "VPS_SSH_KEY secret is missing or malformed" >&2; exit 1; }

      - name: Configure restricted SSH audit key
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/uchiha_deploy"
          chmod 600 "$HOME/.ssh/uchiha_deploy"
          ssh-keyscan -T 15 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Wait for exact commit on the VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          # A production release intentionally performs a verified PostgreSQL backup,
          # restore test, Docker rebuild, two migration passes, and health checks.
          # Give that safety pipeline enough time before declaring the live audit stale.
          for attempt in $(seq 1 360); do
            remote_sha="$(ssh -i "$HOME/.ssh/uchiha_deploy" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" \
              'git -C /opt/uchiha-builder/repo rev-parse HEAD' 2>/dev/null || true)"
            if [[ "$remote_sha" == "$GITHUB_SHA" ]]; then
              echo "VPS reached exact commit $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for VPS commit ($attempt/360): ${remote_sha:-unavailable}"
            sleep 5
          done
          echo "VPS did not reach exact commit $GITHUB_SHA within the release window" >&2
          exit 1

      - name: Verify live HTTP and PostgreSQL storefront API
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 50); do
            ready="$(curl -fsS --max-time 12 https://uchiha-builder.com/ready 2>/dev/null || true)"
            catalog="$(curl -fsS --max-time 12 'https://demo.uchiha-builder.com/api/storefront/demo?catalogOnly=1&limit=1&offset=0' 2>/dev/null || true)"
            if [[ "$ready" == *'"persistent":true'* && "$catalog" == *'"slug":"demo"'* && "$catalog" == *'UCHIHA'* ]]; then
              echo "Live HTTP and PostgreSQL storefront API are ready."
              exit 0
            fi
            echo "Waiting for live VPS storefront ($attempt/50)"
            sleep 6
          done
          echo "Live VPS storefront did not become ready" >&2
          exit 1

      - name: Open live storefront in Chrome and verify loader dismissal
        working-directory: builder
        env:
          LIVE_DEMO_AUDIT: "true"
          LIVE_DEMO_URL: https://demo.uchiha-builder.com/
          LIVE_DEMO_SCREENSHOT: /tmp/uchiha-demo.png
          LIVE_DEMO_TIMEOUT_MS: "30000"
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/live-browser-audit.mjs | tee /tmp/uchiha-live-audit.json
          grep -q '"ok": true' /tmp/uchiha-live-audit.json

      - name: Upload live browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: uchiha-live-demo-${{ github.sha }}
          path: |
            /tmp/uchiha-live-audit.json
            /tmp/uchiha-demo.png
          if-no-files-found: error
          retention-days: 14

      - name: Publish live-verified ref
        shell: bash
        run: |
          set -Eeuo pipefail
          current_source_sha="$(git ls-remote origin refs/heads/builder/v1-platform | awk '{print $1}')"
          [[ "$current_source_sha" == "$GITHUB_SHA" ]] || {
            echo "A newer builder commit exists; refusing to publish a stale browser verification."
            exit 0
          }
          git push --force origin "HEAD:refs/heads/audit/live-demo-verified"

      - name: Audit summary
        run: |
          echo "### UCHIHA live demo verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact VPS commit: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- VPS readiness: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Storefront PostgreSQL API: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Chrome JavaScript boot: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Endless loader check: passed" >> "$GITHUB_STEP_SUMMARY"
