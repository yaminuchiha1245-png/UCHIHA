name: Game Zone Payment Receipt Policy

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-payment-receipt-policy.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
          fetch-depth: 1

      - name: Apply receipt policy
        run: |
          python ops/implement-payment-receipt-policy.py
          python ops/fix-payment-receipt-audit.py

      - name: Validate runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check server/server.js
          node --check server/lib/adminTopupPolicy.js
          node --check server/lib/publicViews.js
          node --check miniapp/app.js
          node --check admin/admin.js
          node --check server/scripts/web-security-audit.js
          cd server
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npm test
          npm run smoke
          npm run audit:routes
          node scripts/web-security-audit.js
          node scripts/secret-scan.js
          node scripts/deploy-security-audit.js

      - name: Commit receipt policy
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js server/lib/adminTopupPolicy.js server/lib/publicViews.js server/tests/adminTopupPolicy.test.js miniapp/app.js admin/admin.js server/scripts/web-security-audit.js
          git commit -m "feat(game-zone): enforce required payment receipts"
          git push origin HEAD:game-zone/rc20-production
