name: Apply Worker Hardening

on:
  push:
    branches:
      - builder/v1-platform
    paths:
      - builder/.worker-hardening.patch.xz.b64
      - .github/workflows/apply-worker-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/builder/v1-platform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: builder/v1-platform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - name: Verify and apply worker hardening
        shell: bash
        run: |
          set -euo pipefail
          base64 -d builder/.worker-hardening.patch.xz.b64 | xz -d > /tmp/worker-hardening.patch
          echo 'a6d4c586005fd593ace894fbe5e23e6c17324cf59793c72ffe815aa7f9d0b05b  /tmp/worker-hardening.patch' | sha256sum -c -
          git apply --check /tmp/worker-hardening.patch
          git apply /tmp/worker-hardening.patch
          rm builder/.worker-hardening.patch.xz.b64
          rm .github/workflows/apply-worker-hardening.yml
      - name: Validate builder
        working-directory: builder
        run: |
          npm ci
          npm run check
          npm test
      - name: Commit final worker hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'UCHIHA Builder'
          git config user.email 'builder@uchiha.local'
          git add -A builder .github/workflows
          git commit -m 'fix(builder): atomically claim worker jobs'
          git push origin HEAD:builder/v1-platform
