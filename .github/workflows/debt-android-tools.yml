name: Prepare Android 35 Signing Tools

on:
  push:
    branches:
      - debt-store-v142-build
    paths:
      - '.github/workflows/debt-android-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Collect official Android tools
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p out/lib64
          cp "$BT/lib/apksigner.jar" out/
          cp "$BT/zipalign" out/
          cp "$BT/aapt" out/
          if [ -f "$BT/lib64/libc++.so" ]; then
            cp "$BT/lib64/libc++.so" out/lib64/
          else
            LIBCPP=$(find "$ANDROID_HOME" -type f -name 'libc++.so' | head -n 1)
            test -n "$LIBCPP"
            cp "$LIBCPP" out/lib64/
          fi
          chmod +x out/zipalign out/aapt
          (cd out && sha256sum aapt zipalign apksigner.jar lib64/libc++.so > SHA256SUMS.txt)

      - name: Upload Android tools
        uses: actions/upload-artifact@v4
        with:
          name: android-35-signing-tools
          path: out/
          if-no-files-found: error
          retention-days: 2
