name: Game Zone Currency Display Consistency

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-currency-display-consistency.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
          fetch-depth: 1

      - name: Apply currency display consistency
        run: python ops/implement-currency-display-consistency.py

      - name: Validate runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check miniapp/app.js
          node --check miniapp/v21.js
          node --check server/scripts/web-security-audit.js
          cd server
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npm test
          npm run smoke
          npm run audit:routes
          node scripts/web-security-audit.js
          node scripts/secret-scan.js
          node scripts/deploy-security-audit.js

      - name: Commit currency UX
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp/app.js miniapp/v21.js server/scripts/web-security-audit.js
          git commit -m "feat(game-zone): unify display currency across storefront"
          git push origin HEAD:game-zone/rc20-production
