name: Game Zone Final Runtime Verify

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-final-runtime-verify.yml
      - ops/game-zone-ui-click-smoke.js

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Interactive Mini App click smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x /usr/bin/google-chrome || test -x /usr/bin/google-chrome-stable
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
          node ops/game-zone-ui-click-smoke.js
          node ops/game-zone-button-audit.js
      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST"; test -n "$VPS_KEY_B64"; PORT="${PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/uchiha_vps
          chmod 600 ~/.ssh/uchiha_vps
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts
      - name: Verify live V24 and Telegram bot runtime
        id: live
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"; USER="${USER:-root}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/uchiha_vps -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE' | tee /tmp/final-live.txt
          set -Eeuo pipefail
          TARGET=/opt/uchiha/projects/game-zone
          cd "$TARGET"
          grep -F 'v21.js?v=240' miniapp/index.html >/dev/null
          grep -F 'v21.css?v=240' miniapp/index.html >/dev/null
          grep -F 'game-zone-v24-static' miniapp/sw.js >/dev/null
          grep -F 'observer.observe(gate,{attributes:true,attributeFilter:["class"]})' miniapp/v21.js >/dev/null
          ! grep -F 'observer.observe(document.body,{subtree:true' miniapp/v21.js
          grep -F 'if(btn.innerHTML!==balanceHtml)btn.innerHTML=balanceHtml' miniapp/v21.js >/dev/null
          grep -F 'BOT UNHANDLED CALLBACK' bot/bot.js >/dev/null
          grep -F 'Game Zone bot v3.3 button-reliability production started' bot/bot.js >/dev/null
          node ops/game-zone-button-audit.js

          cd deploy
          ln -sfn /etc/uchiha/secrets/game-zone.env .env.production
          domain="$(awk -F= '$1=="DOMAIN"{print substr($0,index($0,"=")+1); exit}' .env.production)"
          test -n "$domain"
          cid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q bot)"
          test -n "$cid"
          test "$(docker inspect -f '{{.State.Status}}' "$cid")" = running
          r0="$(docker inspect -f '{{.RestartCount}}' "$cid")"; sleep 10; r1="$(docker inspect -f '{{.RestartCount}}' "$cid")"; test "$r0" = "$r1"
          token_hash="$(docker exec "$cid" sh -lc 'printf %s "$BOT_TOKEN" | sha256sum | cut -d" " -f1')"
          matching=0
          for other in $(docker ps -q --filter label=com.docker.compose.service=bot); do
            h="$(docker exec "$other" sh -lc 'printf %s "$BOT_TOKEN" | sha256sum | cut -d" " -f1' 2>/dev/null || true)"
            [ "$h" = "$token_hash" ] && matching=$((matching+1))
          done
          test "$matching" = 1
          docker exec "$cid" node -e 'fetch("https://api.telegram.org/bot"+process.env.BOT_TOKEN+"/getMe").then(r=>r.json()).then(x=>{if(!x.ok||x.result?.username!=="gamezone1store_bot")process.exit(2);console.log("TELEGRAM_GETME=PASS")}).catch(()=>process.exit(3))'
          webhook="$(docker exec "$cid" node -e 'fetch("https://api.telegram.org/bot"+process.env.BOT_TOKEN+"/getWebhookInfo").then(r=>r.json()).then(x=>process.stdout.write(String(x.result?.url||""))).catch(()=>process.exit(2))')"
          test -z "$webhook"
          logs="$(docker logs --since 10m "$cid" 2>&1 || true)"
          ! printf '%s' "$logs" | grep -qiE '409 Conflict|terminated by other getUpdates request|BOT ERROR'
          printf '%s' "$logs" | grep -F 'Game Zone bot v3.3 button-reliability production started' >/dev/null

          curl -fsS --max-time 15 "https://$domain/" | grep -F 'app.js?v=240' >/dev/null
          curl -fsS --max-time 15 "https://$domain/" | grep -F 'v21.js?v=240' >/dev/null
          curl -fsS --max-time 15 "https://$domain/v21.js?v=240" | grep -F 'observer.observe(gate,{attributes:true,attributeFilter:["class"]})' >/dev/null
          curl -fsS --max-time 15 "https://$domain/app.js?v=240" | grep -F 'prepareTelegramShell();' >/dev/null
          curl -fsS --max-time 15 "https://$domain/api/health/ready" >/dev/null

          echo "DEPLOYED_SHA=$(cat "$TARGET/.deployed-commit")"
          echo "MATCHING_POLLERS=1"
          echo "BOT_RESTART_COUNT=$r1"
          echo "WEBHOOK=EMPTY"
          echo "BOT_409_CONFLICT=NONE"
          echo "LIVE_V24_ASSETS=PASS"
          echo "GAME_ZONE_FINAL_RUNTIME=PASS"
          REMOTE
      - name: Record final verification status
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ops
          cp /tmp/final-live.txt ops/game-zone-final-runtime-status.txt
          {
            echo "UI_CLICK_SMOKE=PASS"
            echo "BUTTON_AUDIT=PASS"
            echo "verified_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> ops/game-zone-final-runtime-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/game-zone-final-runtime-status.txt
          git commit -m 'ops(game-zone): record final runtime verification' || exit 0
          git push origin HEAD:game-zone/rc20-production
