name: Finalize UCHIHA RADIUS clean production

on:
  workflow_dispatch:
  push:
    branches: [radius/release-cleanup-live-only-20261013]
    paths:
      - ".github/workflows/radius-finalize-clean-production-20261013.yml"

permissions:
  contents: read

concurrency:
  group: uchiha-radius-clean-production
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: UCHIHA VPS NEW
    env:
      VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.UCHIHA_VPS_USER || secrets.VPS_USER }}
      VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
      VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.UCHIHA_VPS_PORT || secrets.VPS_PORT || '22' }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Promote immutable 1.0.0 release and clean public route
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'sudo -n bash -se' <<'REMOTE'
          set -Eeuo pipefail
          release_root="/opt/uchiha-radius/releases/addbf2408c48"
          app="$release_root/app"
          public="$release_root/public"
          node24="/opt/uchiha-radius/tools/node24/node_modules/node/bin/node"
          envfile="/etc/uchiha-radius/v183-staging.env"
          prod_unit="uchiha-radius-production.service"
          current_unit="uchiha-radius-provider-api.service"
          legacy_unit="uchiha-radius-v183-staging.service"
          nginx_file="/etc/nginx/conf.d/uchiha-radius.conf"
          current_link="/opt/uchiha-radius/public-current"
          backup="/opt/uchiha-radius/backups/final-clean-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$backup"

          test -x "$node24"
          test -f "$app/apps/api/src/server.js"
          test -f "$app/packages/contracts/src/index.js"
          test -f "$public/index.html"
          test -f "$public/downloads/uchiha-site-agent.tar.gz"
          grep -q 'APP_VERSION = "1.0.0"' "$app/packages/contracts/src/index.js"
          ! grep -Eiq 'V1-[0-9]+|Provider Preview|بيانات تجريبية|sample data|demo@uchiha\.app|حساب تجريبي' "$public/index.html"
          cp -a "$nginx_file" "$backup/uchiha-radius.conf"
          for u in "$prod_unit" "$current_unit" "$legacy_unit"; do
            fragment="$(systemctl show "$u" -p FragmentPath --value 2>/dev/null || true)"
            test -n "$fragment" && test -f "$fragment" && cp -a "$fragment" "$backup/$u" || true
          done

          cat > "/etc/systemd/system/$prod_unit" <<UNIT
          [Unit]
          Description=UCHIHA RADIUS Production API
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=uchiha-radius
          Group=uchiha-radius
          WorkingDirectory=$app
          EnvironmentFile=$envfile
          Environment=NODE_ENV=staging
          Environment=ALLOW_DEV_AUTH=false
          Environment=OUTBOX_WORKER_ENABLED=false
          LoadCredential=telegram-token:/etc/uchiha-radius/telegram-bot.token
          ExecStart=$node24 apps/api/src/server.js
          StateDirectory=uchiha-radius-production
          Restart=on-failure
          RestartSec=3
          TimeoutStartSec=25
          TimeoutStopSec=20
          NoNewPrivileges=true
          PrivateTmp=true
          PrivateDevices=true
          ProtectSystem=strict
          ProtectHome=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          ProtectClock=true
          RestrictSUIDSGID=true
          CapabilityBoundingSet=
          RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
          SystemCallArchitectures=native
          UMask=0077

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload

          previous=""
          if systemctl is-active --quiet "$current_unit"; then previous="$current_unit"; fi
          if test -z "$previous" && systemctl is-active --quiet "$legacy_unit"; then previous="$legacy_unit"; fi
          systemctl stop "$current_unit" >/dev/null 2>&1 || true
          systemctl stop "$legacy_unit" >/dev/null 2>&1 || true
          systemctl restart "$prod_unit"

          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8794/ready 2>/dev/null | grep -q '"ready":true' &&
               curl -fsS --max-time 2 http://127.0.0.1:8794/health 2>/dev/null | grep -q '"1.0.0"'; then
              ok=1; break
            fi
            sleep 1
          done
          if test "$ok" != 1; then
            journalctl -u "$prod_unit" -n 100 --no-pager || true
            systemctl stop "$prod_unit" || true
            test -n "$previous" && systemctl start "$previous" || true
            echo "PRODUCTION_API_PROMOTION_FAILED" >&2
            exit 1
          fi
          systemctl enable "$prod_unit" >/dev/null
          systemctl disable "$current_unit" >/dev/null 2>&1 || true
          systemctl disable "$legacy_unit" >/dev/null 2>&1 || true
          ln -sfn "$public" "$current_link"

          cat > "$nginx_file.new" <<'NGINX'
          server {
            listen 80;
            listen [::]:80;
            server_name radius.uchiha-builder.com;
            location ^~ /.well-known/acme-challenge/ {
              root /var/www/uchiha-radius-acme;
              default_type text/plain;
              try_files $uri =404;
            }
            location / { return 301 https://$host$request_uri; }
          }

          server {
            listen 443 ssl http2;
            listen [::]:443 ssl http2;
            server_name radius.uchiha-builder.com;
            ssl_certificate /etc/letsencrypt/live/radius.uchiha-builder.com/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/radius.uchiha-builder.com/privkey.pem;
            client_max_body_size 256k;
            client_header_timeout 10s;
            client_body_timeout 10s;
            keepalive_timeout 30s;
            limit_conn uchiha_radius_conn 64;
            limit_req zone=uchiha_radius_req burst=200 nodelay;
            limit_req_status 429;
            limit_conn_status 503;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;

            location = /healthz {
              default_type application/json;
              add_header Cache-Control "no-store" always;
              return 200 '{"ok":true,"service":"uchiha-radius-edge","tlsReady":true}';
            }

            location = /telegram { return 302 /; }
            location /telegram/ { return 302 /; }

            location = /site-agent/install.sh {
              alias /opt/uchiha-radius/telegram-app/site-agent-install.sh;
              default_type text/plain;
              add_header Cache-Control "no-store" always;
              add_header X-Content-Type-Options "nosniff" always;
            }

            location = /telegram-assets/telegram-runtime-v101.js {
              alias /opt/uchiha-radius/telegram-app/web/telegram-runtime-v101.js;
              add_header Cache-Control "public, max-age=300" always;
              add_header X-Content-Type-Options "nosniff" always;
            }

            location ^~ /telegram-api/ {
              proxy_pass http://127.0.0.1:8788;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_read_timeout 20s;
              proxy_connect_timeout 3s;
              client_max_body_size 256k;
            }

            location ^~ /api/v1/ {
              proxy_pass http://127.0.0.1:8794;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_connect_timeout 3s;
              proxy_read_timeout 20s;
              client_max_body_size 256k;
              add_header Cache-Control "no-store" always;
            }

            location ^~ /connectors/radius/ {
              limit_except POST { deny all; }
              proxy_pass http://127.0.0.1:8794;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_connect_timeout 3s;
              proxy_read_timeout 20s;
              proxy_send_timeout 20s;
              client_max_body_size 256k;
              add_header Cache-Control "no-store" always;
            }

            location ^~ /api/radius-agent/ {
              proxy_pass http://127.0.0.1:8788;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_read_timeout 20s;
              proxy_connect_timeout 3s;
              client_max_body_size 256k;
            }

            location ^~ /api/connectors/radius/ {
              proxy_pass http://127.0.0.1:8792;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-Host $host;
              proxy_set_header X-Forwarded-Port 443;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_connect_timeout 5s;
              proxy_read_timeout 60s;
              proxy_send_timeout 60s;
            }

            location = /v183 { return 301 /; }
            location ^~ /v183/ { rewrite ^/v183/(.*)$ /$1 permanent; }

            location ^~ /assets/ {
              alias /opt/uchiha-radius/public-current/assets/;
              gzip_static on;
              add_header Cache-Control "public, max-age=31536000, immutable" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header Cross-Origin-Resource-Policy "same-origin" always;
              access_log off;
            }

            location ^~ /downloads/ {
              alias /opt/uchiha-radius/public-current/downloads/;
              add_header Cache-Control "no-store" always;
              add_header X-Content-Type-Options "nosniff" always;
            }

            location / {
              root /opt/uchiha-radius/public-current;
              try_files $uri $uri/ /index.html;
              gzip_static on;
              add_header Cache-Control "no-store" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header X-Robots-Tag "noindex, nofollow" always;
              add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
            }
          }
          NGINX

          mv "$nginx_file.new" "$nginx_file"
          if ! nginx -t; then
            cp -a "$backup/uchiha-radius.conf" "$nginx_file"
            nginx -t
            systemctl reload nginx || true
            systemctl stop "$prod_unit" || true
            test -n "$previous" && systemctl start "$previous" || true
            echo "CLEAN_NGINX_FAILED_ROLLED_BACK" >&2
            exit 1
          fi
          systemctl reload nginx

          rollback() {
            cp -a "$backup/uchiha-radius.conf" "$nginx_file"
            nginx -t >/dev/null && systemctl reload nginx || true
            systemctl stop "$prod_unit" >/dev/null 2>&1 || true
            test -n "$previous" && systemctl start "$previous" >/dev/null 2>&1 || true
          }

          body="$(curl -fsS --max-time 8 https://radius.uchiha-builder.com/)" || { rollback; exit 1; }
          if printf '%s' "$body" | grep -Eiq 'V1-[0-9]+|Provider Preview|بيانات تجريبية|sample data|demo@uchiha\.app|حساب تجريبي'; then
            echo "PUBLIC_BRANDING_LEAK" >&2; rollback; exit 1
          fi
          runtime="$(printf '%s' "$body" | grep -oE 'src="/assets/[^"]+\.js"' | head -1 | cut -d'"' -f2)"
          test -n "$runtime" || { echo "PUBLIC_RUNTIME_MISSING" >&2; rollback; exit 1; }
          js="$(curl -fsS --max-time 8 "https://radius.uchiha-builder.com$runtime")" || { rollback; exit 1; }
          if printf '%s' "$js" | grep -Eiq 'Atlas Connect|NovaLink|WaveGrid|SkyNet North|MTK-A0[267]|omar\.mansour|sample\.suspended|VC-0926-01|admin@atlas\.example'; then
            echo "PUBLIC_FIXTURE_LEAK" >&2; rollback; exit 1
          fi
          curl -fsS --max-time 8 https://radius.uchiha-builder.com/api/v1/meta | grep -q '"1.0.0"' || { echo "API_VERSION_CHECK_FAILED" >&2; rollback; exit 1; }
          curl -fsSI --max-time 8 https://radius.uchiha-builder.com/downloads/uchiha-site-agent.tar.gz | grep -Eq '^HTTP/[0-9.]+ 200' || { echo "AGENT_DOWNLOAD_CHECK_FAILED" >&2; rollback; exit 1; }
          legacy="$(curl -ksSI --max-time 8 https://radius.uchiha-builder.com/v183/)"
          printf '%s' "$legacy" | grep -Eq '^HTTP/[0-9.]+ 301' || { echo "LEGACY_STATUS_FAILED" >&2; rollback; exit 1; }
          printf '%s' "$legacy" | grep -Eiq '^location: .*\/($|[[:space:]]*$)' || { echo "LEGACY_LOCATION_FAILED" >&2; rollback; exit 1; }

          echo "PRODUCTION_UNIT=$(systemctl is-active "$prod_unit")"
          echo "PRODUCTION_WORKDIR=$(systemctl show "$prod_unit" -p WorkingDirectory --value)"
          echo "OLD_PROVIDER_UNIT=$(systemctl is-active "$current_unit" 2>/dev/null || true)"
          echo "OLD_STAGING_UNIT=$(systemctl is-active "$legacy_unit" 2>/dev/null || true)"
          echo "FREERADIUS=$(systemctl is-active freeradius 2>/dev/null || true)"
          echo "PUBLIC_ROOT_CLEAN=PASS"
          echo "API_VERSION_1_0_0=PASS"
          echo "LIVE_ONLY_RUNTIME=PASS"
          echo "SITE_AGENT_DOWNLOAD=PASS"
          echo "LEGACY_REDIRECT=PASS"
          echo "FINAL_CLEAN_PRODUCTION=PASS"
          echo "BACKUP=$backup"
          REMOTE
