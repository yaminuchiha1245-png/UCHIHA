name: Build Debt Store APK

on:
  push:
    branches: [debt-store-build]
    paths:
      - 'debt-build/**'
      - '.github/workflows/debt-store-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat debt-build/source.part* | base64 -d > /tmp/debt-source.zip
          echo 'f9b1921583b0b9fc9cb50c0b9ac74e7efd17cc5410dc0c93a58800ff1d3396ca  /tmp/debt-source.zip' | sha256sum -c -
          mkdir -p debt-app
          unzip -q /tmp/debt-source.zip -d debt-app
          test -f debt-app/app/src/main/assets/app.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate JavaScript
        working-directory: debt-app
        run: node --check app/src/main/assets/app.js

      - name: Build installable APK
        working-directory: debt-app
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        run: |
          cp debt-app/app/build/outputs/apk/debug/app-debug.apk UCHIHA-Debt-Store.apk
          sha256sum UCHIHA-Debt-Store.apk > UCHIHA-Debt-Store.apk.sha256
          ls -lh UCHIHA-Debt-Store.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UCHIHA-Debt-Store-APK
          path: |
            UCHIHA-Debt-Store.apk
            UCHIHA-Debt-Store.apk.sha256
          if-no-files-found: error
          retention-days: 30
