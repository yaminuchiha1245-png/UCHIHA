name: Build Debt Store APK

on:
  push:
    branches: [debt-store-build]
    paths:
      - 'debt-build/**'
      - '.github/workflows/debt-store-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re
          parts=sorted(Path('debt-build').glob('source.part*'))
          text=''.join(p.read_text(encoding='utf-8') for p in parts)
          data=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','',text),validate=False)
          digest=hashlib.sha256(data).hexdigest()
          expected='f9b1921583b0b9fc9cb50c0b9ac74e7efd17cc5410dc0c93a58800ff1d3396ca'
          if digest!=expected: raise SystemExit(f'source hash mismatch: {digest}')
          Path('/tmp/debt-source.zip').write_bytes(data)
          PY
          mkdir -p debt-app
          unzip -q /tmp/debt-source.zip -d debt-app
          sed -i 's/import android\.app\.biometric\.BiometricPrompt;/import android.hardware.biometrics.BiometricPrompt;/' debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java
          python3 debt-build/patch_v101.py debt-app
          python3 debt-build/patch_v102.py debt-app
          python3 debt-build/patch_v103.py debt-app

          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,tarfile,re
          parts=sorted(Path('debt-build').glob('v110payload.part*'))
          if len(parts)!=5: raise SystemExit(f'expected 5 v110 payload parts, found {len(parts)}')
          data=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','',''.join(p.read_text(encoding='utf-8') for p in parts)),validate=True)
          digest=hashlib.sha256(data).hexdigest(); expected='cb2605e2766f0f4dfa3a53ff7a6dfd4d0637d7c39906705187427bbae39dd55b'
          if digest!=expected: raise SystemExit(f'v110 payload hash mismatch: {digest}')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf: tf.extractall('debt-app')
          PY

          python3 debt-build/patch_v111.py debt-app

          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,tarfile,re
          parts=sorted(Path('debt-build').glob('v112payload.part*'))
          if len(parts)!=4: raise SystemExit(f'expected 4 v112 payload parts, found {len(parts)}')
          data=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','',''.join(p.read_text(encoding='utf-8') for p in parts)),validate=True)
          digest=hashlib.sha256(data).hexdigest(); expected='66dc5cabeadc1fb4b58f10f10861c4d67c482966e6e667e0be81ced0dde68da3'
          if digest!=expected: raise SystemExit(f'v112 payload hash mismatch: {digest}')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf: tf.extractall('debt-app')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,tarfile,re
          parts=sorted(Path('debt-build').glob('v120payload.part*'))
          if len(parts)!=5: raise SystemExit(f'expected 5 v120 payload parts, found {len(parts)}')
          data=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','',''.join(p.read_text(encoding='utf-8') for p in parts)),validate=True)
          digest=hashlib.sha256(data).hexdigest(); expected='81909bbeafee7ce5e71de20e07834743bde286c190f2275e0b827c5561f82fc9'
          print('v120 payload bytes:',len(data),'sha256:',digest)
          if digest!=expected: raise SystemExit(f'v120 payload hash mismatch: {digest}')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf: tf.extractall('debt-app')
          PY

          grep -q "versionName '1.2.0'" debt-app/app/build.gradle
          grep -q "versionCode 8" debt-app/app/build.gradle
          grep -q "applicationId 'com.uchiha.debtstore'" debt-app/app/build.gradle
          grep -q "okhttp:4.12.0" debt-app/app/build.gradle
          grep -q 'app-v120.js' debt-app/app/src/main/assets/index.html
          grep -q 'cloudRealtimeStart' debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java
          grep -q '/functions/v1/send-whatsapp' debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java
          grep -q 'WhatsApp Business Cloud API' debt-app/app/src/main/assets/app-v120.js
          grep -q 'realtimeConnected' debt-app/app/src/main/assets/app-v120.js
          grep -q 'mobile-ledger' debt-app/app/src/main/assets/app-v110.css
          grep -q 'final int pageW = 420, pageH = 840' debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java
          grep -q 'AES/GCM/NoPadding' debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate JavaScript
        working-directory: debt-app
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/app-v110.js
          node --check app/src/main/assets/app-v120.js

      - name: Prepare persistent release signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          python3 - <<'PY' > /tmp/signing_artifact_id
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts?name=UCHIHA-Debt-Store-Signing-Key&per_page=100',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try:
            with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
            valid=[a for a in data.get('artifacts',[]) if not a.get('expired')]
            valid.sort(key=lambda a:a.get('created_at',''),reverse=True)
            print(valid[0]['id'] if valid else '')
          except Exception: print('')
          PY
          ARTIFACT_ID="$(cat /tmp/signing_artifact_id)"
          if [ -n "$ARTIFACT_ID" ]; then
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/signing.zip
            unzip -q /tmp/signing.zip -d signing
          else
            PASS="$(openssl rand -hex 24)"
            keytool -genkeypair -noprompt -v -keystore signing/uchiha-release.jks -storepass "$PASS" -keypass "$PASS" -alias uchiha-release -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=UCHIHA Debt Store, OU=UCHIHA, O=UCHIHA, L=Idlib, C=SY"
            printf '%s' "$PASS" > signing/password.txt
          fi
          test -s signing/uchiha-release.jks
          test -s signing/password.txt

      - name: Build signed release APK
        shell: bash
        working-directory: debt-app
        run: |
          set -euo pipefail
          PASS="$(cat ../signing/password.txt)"
          export UCHIHA_KEYSTORE="$GITHUB_WORKSPACE/signing/uchiha-release.jks"
          export UCHIHA_STORE_PASSWORD="$PASS"
          export UCHIHA_KEY_PASSWORD="$PASS"
          export UCHIHA_KEY_ALIAS=uchiha-release
          gradle --no-daemon clean assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=debt-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.uchiha.debtstore'" | grep "versionCode='8'" | grep "versionName='1.2.0'"

      - name: Prepare deliverables
        shell: bash
        run: |
          cp debt-app/app/build/outputs/apk/release/app-release.apk UCHIHA-Debt-Store-v1.2.0-RELEASE.apk
          sha256sum UCHIHA-Debt-Store-v1.2.0-RELEASE.apk > UCHIHA-Debt-Store-v1.2.0-RELEASE.apk.sha256
          (cd debt-app && zip -qr ../UCHIHA-Debt-Store-v1.2.0-source.zip .)

      - name: Preserve signing key for future updates
        uses: actions/upload-artifact@v4
        with:
          name: UCHIHA-Debt-Store-Signing-Key
          path: |
            signing/uchiha-release.jks
            signing/password.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: UCHIHA-Debt-Store-v1.2.0-RELEASE
          path: |
            UCHIHA-Debt-Store-v1.2.0-RELEASE.apk
            UCHIHA-Debt-Store-v1.2.0-RELEASE.apk.sha256
            UCHIHA-Debt-Store-v1.2.0-source.zip
          if-no-files-found: error
          retention-days: 90
