name: UCHIHA v6 Mobile Integration Inspect

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/uchiha-v6-mobile-integration-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v6
        shell: bash
        run: |
          cat control-center/v6/package/part-* > /tmp/v6.tgz.b64
          base64 --decode /tmp/v6.tgz.b64 > /tmp/v6.tgz
          mkdir -p /tmp/v6
          tar -xzf /tmp/v6.tgz -C /tmp/v6
      - name: Print integration files
        shell: bash
        run: |
          echo '===SERVER_JS_BEGIN==='; cat /tmp/v6/server.js; echo '===SERVER_JS_END==='
          echo '===PACKAGE_JSON_BEGIN==='; cat /tmp/v6/package.json; echo '===PACKAGE_JSON_END==='
          echo '===COMPOSE_BEGIN==='; cat /tmp/v6/compose.yaml; echo '===COMPOSE_END==='
          echo '===DOCKERFILE_BEGIN==='; cat /tmp/v6/Dockerfile; echo '===DOCKERFILE_END==='
