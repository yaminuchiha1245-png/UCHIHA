name: V1-83 FreeRADIUS deep startup inspect

on:
  push:
    branches: [radius-v183/real-router-diagnosis-20261003]
    paths: [.github/workflows/radius-v183-freeradius-deep-startup-inspect-20261004.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: UCHIHA VPS NEW
    env:
      VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.UCHIHA_VPS_USER || secrets.VPS_USER }}
      VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
      VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.UCHIHA_VPS_PORT || secrets.VPS_PORT || '22' }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deep inspect
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'sudo -n bash -se' <<'REMOTE'
          set -Eeuo pipefail
          echo "STATUS_BEGIN"
          systemctl status freeradius --no-pager -l 2>&1 | tail -80 || true
          echo "STATUS_END"
          echo "UNIT_BEGIN"
          systemctl cat freeradius --no-pager 2>&1 | sed -E 's/(EnvironmentFile=).*/\1[configured]/' | tail -120 || true
          echo "UNIT_END"
          echo "RADIUS_LOG_BEGIN"
          for f in /var/log/freeradius/radius.log /var/log/freeradius/freeradius.log /var/log/syslog; do
            if test -r "$f"; then
              echo "LOGFILE $f"
              tail -160 "$f" | sed -E 's/(secret[[:space:]]*=[[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig'
            fi
          done
          echo "RADIUS_LOG_END"
          echo "DEFAULT_LISTEN_BEGIN"
          awk '
            /^[[:space:]]*listen[[:space:]]*\{/ {inlisten=1; print FNR ":" $0; next}
            inlisten && /^[[:space:]]*\}/ {print FNR ":" $0; inlisten=0; next}
            inlisten {print FNR ":" $0}
          ' /etc/freeradius/3.0/sites-enabled/default 2>/dev/null | head -120 || true
          echo "DEFAULT_LISTEN_END"
          echo "DEEP_STARTUP_INSPECT=PASS"
          REMOTE
