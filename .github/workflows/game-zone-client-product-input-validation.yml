name: Game Zone Client Product Input Validation

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-client-product-input-validation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
          fetch-depth: 1

      - name: Apply client input validation
        run: python ops/implement-client-product-input-validation.py

      - name: Validate runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check miniapp/app.js
          node --check server/scripts/web-security-audit.js
          node server/scripts/web-security-audit.js
          cd server
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npm test
          npm run smoke
          npm run audit:routes
          node scripts/secret-scan.js
          node scripts/deploy-security-audit.js

      - name: Commit client input validation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp/app.js server/scripts/web-security-audit.js
          git commit -m "feat(game-zone): validate product input before checkout"
          git push origin HEAD:game-zone/rc20-production
