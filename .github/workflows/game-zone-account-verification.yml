          p.write_text(s)

          p=Path('admin/admin.js'); s=p.read_text()
          anchor=' support:[{id:"ticket_1",telegramId:"8120730186",subject:"مشكلة في طلب",message:"أحتاج متابعة الطلب.",status:"open",createdAt:new Date().toISOString()}],'
          if anchor not in s: raise SystemExit('admin mock anchor missing')
          s=s.replace(anchor,' verification:[{id:"verify_preview_1",telegramId:"8120730186",status:"pending",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),reviewedAt:null,rejectionReason:null}],\n'+anchor,1)
          old='const [dashboard,categories,products,orders,topups,users,profits,coupons,providers,providerLogs,payments,announcements,support,broadcasts,settings,audit,inventorySummary,inventory,security,syncWorker,maintenance,integrity,schema,locks,adminSession,backups,storage,financialMirror,financialJournal,walletAuthority,businessAuthority,storageHistory,readiness]=await Promise.all(['
