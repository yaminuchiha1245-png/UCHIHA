      - name: Validate implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check server/lib/verificationPolicy.js
          node --check server/lib/migrations.js
          node --check server/lib/accountLifecycle.js
          node --check server/server.js
          node --check miniapp/v21.js
          node --check admin/admin.js
          cd server
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npm test
          npm run smoke
          npm run audit:routes
          node scripts/web-security-audit.js
          node scripts/secret-scan.js
          node scripts/deploy-security-audit.js

      - name: Commit verification feature
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/lib/verificationPolicy.js server/tests/verificationPolicy.test.js server/lib/migrations.js server/lib/accountLifecycle.js server/tests/accountLifecycle.test.js server/server.js miniapp/v21.js admin/index.html admin/admin.js
          git commit -m "feat(game-zone): add dedicated account verification lifecycle"
          git push origin HEAD:game-zone/rc20-production
