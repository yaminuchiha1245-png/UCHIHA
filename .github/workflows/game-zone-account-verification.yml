name: Game Zone Account Verification

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-account-verification.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
          fetch-depth: 1

      - name: Add verification policy and collection
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > server/lib/verificationPolicy.js <<'JS'
          const STATUSES=new Set(["pending","verified","rejected"]);
          function sanitizeDecision(body={}){
            const status=String(body.status||"").trim();
            if(!["verified","rejected"].includes(status))throw new Error("invalid_verification_status");
            let rejectionReason=null;
            if(status==="rejected"){
              rejectionReason=String(body.rejectionReason||"").trim().replace(/\s+/g," ");
              if(rejectionReason.length>500)throw new Error("verification_reason_too_long");
            }
            return {status,rejectionReason:rejectionReason||null};
          }
          function publicVerification(row,{admin=false}={}){
            if(!row)return {status:"none"};
            const out={id:row.id,status:STATUSES.has(row.status)?row.status:"pending",createdAt:row.createdAt,updatedAt:row.updatedAt||row.createdAt,reviewedAt:row.reviewedAt||null,rejectionReason:row.rejectionReason||null};
            if(admin)out.telegramId=String(row.telegramId||"");
            return out;
          }
          module.exports={STATUSES,sanitizeDecision,publicVerification};
          JS

          cat > server/tests/verificationPolicy.test.js <<'JS'
          const test=require("node:test");
          const assert=require("node:assert/strict");
          const {sanitizeDecision,publicVerification}=require("../lib/verificationPolicy");
          test("verification decision only allows reviewed terminal states",()=>{
            assert.deepEqual(sanitizeDecision({status:"verified"}),{status:"verified",rejectionReason:null});
            assert.throws(()=>sanitizeDecision({status:"pending"}),/invalid_verification_status/);
          });
          test("customer verification view does not expose telegram id",()=>{
            const row={id:"v1",telegramId:"123",status:"pending",createdAt:"2026-01-01T00:00:00Z"};
            assert.equal(publicVerification(row).telegramId,undefined);
            assert.equal(publicVerification(row,{admin:true}).telegramId,"123");
          });
          JS

          python - <<'PY'
          from pathlib import Path
          p=Path('server/lib/migrations.js'); s=p.read_text()
          s=s.replace('const CURRENT_SCHEMA_VERSION=8;','const CURRENT_SCHEMA_VERSION=9;',1)
          old='  "deletedAccounts","couponUsages"\n];'
          new='  "deletedAccounts","couponUsages","verificationRequests"\n];'
          if old not in s: raise SystemExit('migration anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('server/lib/accountLifecycle.js'); s=p.read_text()
          s=s.replace('    supportTickets:(db.supportTickets||[]).length,\n    devicePairs:(db.devicePairs||[]).length,','    supportTickets:(db.supportTickets||[]).length,\n    verificationRequests:(db.verificationRequests||[]).length,\n    devicePairs:(db.devicePairs||[]).length,',1)
          s=s.replace('  db.supportTickets=(db.supportTickets||[]).filter(x=>String(x.telegramId)!==tid);\n  db.devicePairs=(db.devicePairs||[]).filter(x=>String(x.telegramId)!==tid);','  db.supportTickets=(db.supportTickets||[]).filter(x=>String(x.telegramId)!==tid);\n  db.verificationRequests=(db.verificationRequests||[]).filter(x=>String(x.telegramId)!==tid);\n  db.devicePairs=(db.devicePairs||[]).filter(x=>String(x.telegramId)!==tid);',1)
          s=s.replace('    supportTickets:before.supportTickets-db.supportTickets.length,\n    devicePairs:before.devicePairs-db.devicePairs.length,','    supportTickets:before.supportTickets-db.supportTickets.length,\n    verificationRequests:before.verificationRequests-db.verificationRequests.length,\n    devicePairs:before.devicePairs-db.devicePairs.length,',1)
          p.write_text(s)

          p=Path('server/tests/accountLifecycle.test.js'); s=p.read_text()
          s=s.replace('    supportTickets:[{telegramId:"123",id:"t1"}],\n    devicePairs:[{telegramId:"123",id:"pair1"}],','    supportTickets:[{telegramId:"123",id:"t1"}],\n    verificationRequests:[{telegramId:"123",id:"verify1"}],\n    devicePairs:[{telegramId:"123",id:"pair1"}],',1)
          s=s.replace('  assert.equal(db.supportTickets.length,0);\n  assert.equal(db.devicePairs.length,0);','  assert.equal(db.supportTickets.length,0);\n  assert.equal(db.verificationRequests.length,0);\n  assert.equal(db.devicePairs.length,0);',1)
          p.write_text(s)
          PY

      - name: Add dedicated verification API
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('server/server.js'); s=p.read_text()
          anchor='const { publicCurrencies, sanitizeAdminCurrencies } = require("./lib/currencyConfig");\n'
          if anchor not in s: raise SystemExit('server import anchor missing')
          s=s.replace(anchor,anchor+'const { sanitizeDecision:sanitizeVerificationDecision, publicVerification } = require("./lib/verificationPolicy");\n',1)

          anchor='app.get("/api/support/tickets",userOnly,(req,res)=>{'
          if anchor not in s: raise SystemExit('customer route anchor missing')
          block='''app.get("/api/verification",userOnly,(req,res)=>{\n  const db=readDB(),tid=String(req.authTelegramId||"");\n  const row=(db.verificationRequests||[]).filter(x=>String(x.telegramId)===tid).sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")))[0]||null;\n  res.json(publicVerification(row));\n});\n\napp.post("/api/verification",rateLimit("verification_request",3,86400000),userOnly,financialLocks(locksForUser),async(req,res)=>{\n  if(String(req.body?.confirmation||"")!=="REQUEST_VERIFICATION")return res.status(400).json({ok:false,error:"verification_confirmation_required"});\n  const db=readDB(),tid=String(req.authTelegramId||"");\n  const latest=(db.verificationRequests||[]).filter(x=>String(x.telegramId)===tid).sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")))[0]||null;\n  if(latest?.status==="pending")return res.status(409).json({ok:false,error:"verification_already_pending",verification:publicVerification(latest)});\n  if(latest?.status==="verified")return res.status(409).json({ok:false,error:"verification_already_verified",verification:publicVerification(latest)});\n  const row={id:id("verify"),telegramId:tid,status:"pending",rejectionReason:null,createdAt:now(),updatedAt:now(),reviewedAt:null};\n  db.verificationRequests||=[];db.verificationRequests.unshift(row);\n  addNotification(db,tid,"تم استلام طلب التحقق","طلب التحقق قيد المراجعة الآن.","verification",row.id);\n  pushAudit(db,req,"verification_request",{verificationId:row.id,telegramId:tid});\n  await persistCritical(db);\n  notifyAdmins(`🪪 طلب تحقق حساب جديد\\nTelegram ID: <code>${tgEsc(tid)}</code>\\nالحالة: قيد المراجعة`);\n  res.status(201).json({ok:true,verification:publicVerification(row)});\n});\n\n'''+anchor
          s=s.replace(anchor,block,1)

          anchor='app.get("/api/admin/support-tickets",adminOnly,(req,res)=>res.json((readDB().supportTickets||[]).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))));'
          if anchor not in s: raise SystemExit('admin route anchor missing')
          block='''app.get("/api/admin/verifications",adminOnly,(req,res)=>{\n  const rows=(readDB().verificationRequests||[]).slice().sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));\n  res.json(rows.map(x=>publicVerification(x,{admin:true})));\n});\napp.patch("/api/admin/verifications/:id",adminOnly,financialLocks(req=>[`verification:${String(req.params?.id||"")}`]),async(req,res)=>{\n  const db=readDB(),row=(db.verificationRequests||[]).find(x=>String(x.id)===String(req.params.id));\n  if(!row)return res.status(404).json({ok:false,error:"verification_not_found"});\n  if(row.status!=="pending")return res.status(409).json({ok:false,error:"verification_already_reviewed",verification:publicVerification(row,{admin:true})});\n  let decision;try{decision=sanitizeVerificationDecision(req.body||{});}catch(e){return res.status(400).json({ok:false,error:String(e.message||"invalid_verification_decision")});}\n  row.status=decision.status;row.rejectionReason=decision.rejectionReason;row.reviewedAt=now();row.updatedAt=now();\n  const verified=row.status==="verified";\n  addNotification(db,row.telegramId,verified?"تم توثيق حسابك":"تعذر اعتماد التحقق",verified?"تم اعتماد التحقق بنجاح.":(row.rejectionReason||"يمكنك إرسال طلب جديد بعد مراجعة البيانات."),"verification",row.id);\n  pushAudit(db,req,verified?"verification_approve":"verification_reject",{verificationId:row.id,telegramId:String(row.telegramId)});\n  await persistCritical(db);\n  sendTelegramMessage(row.telegramId,verified?"✅ تم <b>توثيق حساب Game Zone</b> بنجاح.":`⚠️ تعذر اعتماد طلب التحقق في Game Zone.${row.rejectionReason?`\\nالسبب: ${tgEsc(row.rejectionReason)}`:""}`);\n  res.json({ok:true,verification:publicVerification(row,{admin:true})});\n});\n\n'''+anchor
          s=s.replace(anchor,block,1)
          p.write_text(s)
          PY

      - name: Replace temporary support-ticket verification in Mini App
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('miniapp/v21.js'); s=p.read_text()
          start=s.index('  function kycTicket(){')
          end=s.index('\n  function renderPairUpgrade(){',start)
          new=r'''  function kycStatus(){
    const row=kycCache;
    if(!row||row.status==="none")return {key:"none",label:"غير موثق",request:null};
    if(row.status==="verified")return {key:"verified",label:"موثق",request:row};
    if(row.status==="rejected")return {key:"rejected",label:"مرفوض",request:row};
    return {key:"pending",label:"قيد المراجعة",request:row};
  }
  function refreshKycBadge(){
    const pill=$q("#gz21KycStatus");if(!pill)return;
    const st=kycStatus();pill.className=`gz21-status-pill ${st.key}`;pill.textContent=st.label;
  }
  async function loadKycStatus(){
    const s=safeState();
    if(!s||s.preview||!s.sessionToken){kycCache={status:"none"};refreshKycBadge();return kycCache}
    try{kycCache=await api("/api/verification")}catch{kycCache={status:"none"}}
    refreshKycBadge();return kycCache;
  }
  function kycSheetBody(st){
    if(st.key==="verified")return `<h3>تحقق KYC</h3><div class="gz21-kyc-box"><h4>✅ الحساب موثق</h4><p>تم اعتماد التحقق من إدارة Game Zone.</p></div><button data-sheet-close class="gz21-sheet-action">تم</button>`;
    if(st.key==="pending")return `<h3>تحقق KYC</h3><div class="gz21-kyc-box"><h4>⏳ الطلب قيد المراجعة</h4><p>تم إنشاء طلب التحقق. إذا احتاجت الإدارة مطابقة هوية إضافية فستتم عبر قناة أو مزود تحقق رسمي.</p></div><div class="gz21-privacy-note">Game Zone لا يطلب منك إدخال رقم وثيقة أو كلمة مرور داخل هذه الصفحة.</div><button data-sheet-close class="gz21-sheet-action">إغلاق</button>`;
    const reason=st.request?.rejectionReason?`<p>السبب: ${String(st.request.rejectionReason).replace(/[<>]/g,"")}</p>`:"";
    const rejected=st.key==="rejected"?`<div class="gz21-kyc-box"><h4>تعذر اعتماد الطلب السابق</h4>${reason}<p>يمكنك إرسال طلب جديد للمراجعة.</p></div>`:"";
    return `<h3>تحقق KYC</h3>${rejected}<div class="gz21-kyc-box"><h4>طلب توثيق الحساب</h4><p>أرسل طلب التحقق من هنا. لن نخزن رقم وثيقة أو صورة هوية داخل هذه الصفحة. عند الحاجة لمطابقة إضافية ستظهر لك تعليمات القناة الرسمية.</p></div><button id="gz21SubmitKyc" class="gz21-sheet-action">إرسال طلب التحقق</button>`;
  }
  async function openKyc(){
    const s=safeState();if(!s)return;
    if(s.preview)return openSheet(`<h3>تحقق KYC</h3><p>يظهر التحقق الحقيقي بعد ربط حساب Telegram.</p>`);
    await loadKycStatus();const st=kycStatus();openSheet(kycSheetBody(st));
    const submit=$q("#gz21SubmitKyc");if(!submit)return;
    submit.onclick=async()=>{
      submit.disabled=true;submit.textContent="جارٍ الإرسال...";
      try{const r=await api("/api/verification",{method:"POST",body:JSON.stringify({confirmation:"REQUEST_VERIFICATION"})});kycCache=r.verification||{status:"pending"};refreshKycBadge();closeSheet();safeToast("تم إرسال طلب التحقق للمراجعة")}
      catch{submit.disabled=false;submit.textContent="إرسال طلب التحقق";safeToast("تعذر إرسال طلب التحقق")}
    };
  }
  function installKyc(){
    const settings=$q('.screen[data-screen="account"] .settings');if(!settings||$q("#gz21KycBtn"))return;
    const button=document.createElement("button");button.id="gz21KycBtn";button.className="gz21-kyc-row";
    button.innerHTML=`تحقق KYC <span id="gz21KycStatus" class="gz21-status-pill">...</span>`;
    const anchor=$q("#privacyBtn");settings.insertBefore(button,anchor||settings.firstChild);
    button.onclick=openKyc;loadKycStatus().catch(()=>{});
  }
'''
          s=s[:start]+new+s[end:]
          s=s.replace('refreshBalanceChip();renderPaymentCards();refreshKycBadge();safeToast("تم ربط حساب Telegram بنجاح");','refreshBalanceChip();renderPaymentCards();loadKycStatus().catch(()=>{});safeToast("تم ربط حساب Telegram بنجاح");',1)
          p.write_text(s)
          PY

      - name: Add verification queue to Admin Center
