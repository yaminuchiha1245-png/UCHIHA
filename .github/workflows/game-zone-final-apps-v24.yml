name: Game Zone Final Apps V24

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-final-apps-v24.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate final Android sources
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'applicationId = "com.gamezone.store"' android/handoff/client/build.gradle.kts
          grep -F 'versionCode = 33' android/handoff/client/build.gradle.kts
          grep -F 'versionName = "3.1.2"' android/handoff/client/build.gradle.kts
          grep -F 'applicationId = "com.gamezone.admin"' android/handoff/admin/build.gradle.kts
          grep -F 'versionCode = 26' android/handoff/admin/build.gradle.kts
          grep -F 'versionName = "2.1.5"' android/handoff/admin/build.gradle.kts
          grep -F 'GameZoneAdmin/2.1.5' android/handoff/admin/src/main/java/com/gamezone/admin/MainActivity.java
          grep -F 'setSafeBrowsingEnabled(true)' android/handoff/admin/src/main/java/com/gamezone/admin/MainActivity.java
          grep -F 'setAcceptThirdPartyCookies(webView, false)' android/handoff/admin/src/main/java/com/gamezone/admin/MainActivity.java
          grep -F 'gamezone1store_bot' android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java
          grep -F '/api/device/activation/redeem' android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java

      - name: Build final APKs
        shell: bash
        run: |
          set -Eeuo pipefail
          cd android/handoff
          gradle --no-daemon :client:assembleDebug :admin:assembleDebug
          cd ../..
          mkdir -p dist/final-v24
          cp android/handoff/client/build/outputs/apk/debug/client-debug.apk dist/final-v24/Game-Zone-Client-v3.1.2.apk
          cp android/handoff/admin/build/outputs/apk/debug/admin-debug.apk dist/final-v24/Game-Zone-Admin-v2.1.5.apk
          test -s dist/final-v24/Game-Zone-Client-v3.1.2.apk
          test -s dist/final-v24/Game-Zone-Admin-v2.1.5.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging dist/final-v24/Game-Zone-Client-v3.1.2.apk | tee /tmp/client-badging.txt
          "$AAPT" dump badging dist/final-v24/Game-Zone-Admin-v2.1.5.apk | tee /tmp/admin-badging.txt
          grep -F "package: name='com.gamezone.store' versionCode='33' versionName='3.1.2'" /tmp/client-badging.txt
          grep -F "package: name='com.gamezone.admin' versionCode='26' versionName='2.1.5'" /tmp/admin-badging.txt
          (cd dist/final-v24 && sha256sum Game-Zone-Client-v3.1.2.apk Game-Zone-Admin-v2.1.5.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: game-zone-final-v24-apps
          path: dist/final-v24/*
          retention-days: 90

      - name: Publish client release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag=game-zone-client-v3.1.2
          gh release delete "$tag" --yes >/dev/null 2>&1 || true
          git push origin ":refs/tags/$tag" >/dev/null 2>&1 || true
          gh release create "$tag" dist/final-v24/Game-Zone-Client-v3.1.2.apk dist/final-v24/SHA256SUMS.txt \
            --target game-zone/rc20-production \
            --title "Game Zone Client v3.1.2" \
            --notes "Final Game Zone client handoff after V24 bot/Mini App reliability work. Native Android client uses the live Game Zone backend, the same customer account/order/balance system, and one-time Telegram bot activation. Debug-signed direct-install APK; Play Store publishing requires owner-controlled release signing."

      - name: Publish admin release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag=game-zone-admin-v2.1.5
          gh release delete "$tag" --yes >/dev/null 2>&1 || true
          git push origin ":refs/tags/$tag" >/dev/null 2>&1 || true
          gh release create "$tag" dist/final-v24/Game-Zone-Admin-v2.1.5.apk dist/final-v24/SHA256SUMS.txt \
            --target game-zone/rc20-production \
            --title "Game Zone Admin v2.1.5" \
            --notes "Final Game Zone Admin handoff for the current live owner dashboard. Hardened same-host HTTPS WebView, safe browsing, loading/error recovery, file chooser support and current production integration. Debug-signed direct-install APK; Play Store publishing requires owner-controlled release signing."
