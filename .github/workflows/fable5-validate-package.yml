name: Fable5 Validate and Package

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Test storefront core
        run: python -m unittest tests/test_storefront_core.py

      - name: Test storefront hardening
        run: python -m unittest tests/test_storefront_hardening.py

      - name: Test Binance compatibility
        run: python -m unittest tests/test_binance_compat.py

      - name: Run Binance smoke test
        run: python tests/binance_integration_smoke.py

      - name: Build clean runtime ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile

          output = Path("UCHIHA-FABLE5-DEVELOPED.zip")
          tracked = subprocess.check_output(
              ["git", "ls-files"],
              text=True,
          ).splitlines()

          excluded_prefixes = (
              ".git/",
              ".github/",
              "tests/",
              "__pycache__/",
          )
          excluded_names = {
              ".env",
              ".env.example",
              ".gitignore",
              "FABLE5_REPORT.md",
              "TEST_REPORT.md",
              "README.md",
          }
          excluded_suffixes = (
              ".db",
              ".sqlite",
              ".sqlite3",
              ".log",
              ".zip",
              ".bak",
              ".backup",
              ".pyc",
              ".pyo",
          )

          included = []
          for raw in tracked:
              path = Path(raw)
              normalized = path.as_posix()
              if normalized in excluded_names:
                  continue
              if normalized.startswith(excluded_prefixes):
                  continue
              if normalized.endswith(excluded_suffixes):
                  continue
              if any(part in {"__pycache__", ".pytest_cache", ".mypy_cache"} for part in path.parts):
                  continue
              if not path.is_file():
                  continue
              included.append(path)

          with zipfile.ZipFile(
              output,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
          ) as archive:
              for path in included:
                  archive.write(path, path.as_posix())

          if not included or output.stat().st_size == 0:
              raise SystemExit("Runtime ZIP is empty")
          print(f"Packaged {len(included)} tracked runtime files into {output}")
          PY

      - name: Upload runtime ZIP
        uses: actions/upload-artifact@v4
        with:
          name: UCHIHA-FABLE5-DEVELOPED
          path: UCHIHA-FABLE5-DEVELOPED.zip
          if-no-files-found: error
          retention-days: 7
