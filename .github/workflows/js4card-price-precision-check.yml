name: JS4Card Price Precision Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile precision files
        run: python -m py_compile js4card_price_precision.py storefront_launcher.py tests/test_js4card_price_precision.py
      - name: Run precision tests
        run: python -m unittest -v tests.test_js4card_price_precision tests.test_js4card_purchase_options
