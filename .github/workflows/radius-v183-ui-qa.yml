name: RADIUS V1-83 UI-only QA

on:
  push:
    branches:
      - radius-v183/ui-simplify
    paths:
      - radius-v183/apps/provider-v183-runtime/**
      - radius-v183/scripts/qa-ui-v183.mjs
      - .github/workflows/radius-v183-ui-qa.yml
  pull_request:
    branches:
      - radius-v183-telegram-integration
    paths:
      - radius-v183/apps/provider-v183-runtime/**
      - radius-v183/scripts/qa-ui-v183.mjs
      - .github/workflows/radius-v183-ui-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v183-ui-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-ui:
    name: Node 24, web/mobile build and five-viewport Chrome smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: radius-v183
    steps:
      - name: Check out this reviewed branch (no production deployment)
        uses: actions/checkout@v4

      - name: Use declared Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: radius-v183/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit locked production dependencies before adding temporary browser QA tools
        run: npm audit --omit=dev --audit-level=high

      - name: Run the complete frontend and signed-route unit suites
        run: node --test apps/provider-v183-runtime/ui-*.test.mjs

      - name: Build release web assets from frozen design
        run: npm run provider:v183:server

      - name: Prepare isolated Android web assets
        run: npm run mobile:prepare

      - name: Check project source, static safety and syntax
        run: npm run check

      - name: Install isolated browser QA dependency and bundled Chrome
        run: npm install --no-save --no-package-lock puppeteer@24

      - name: Assert compact drawer and all three live health slots at five widths
        env:
          UI_QA_SCREENSHOTS: ${{ runner.temp }}/uchiha-v183-ui-screenshots
        run: node scripts/qa-ui-v183.mjs

      - name: Attach layout evidence (preview fixtures only, no user data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radius-v183-ui-viewport-evidence
          path: ${{ runner.temp }}/uchiha-v183-ui-screenshots
          retention-days: 7
          if-no-files-found: ignore
