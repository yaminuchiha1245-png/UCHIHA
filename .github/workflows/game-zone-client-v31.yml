name: Game Zone Client v3.1

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-client-v31.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Apply bot and Android v3.1 changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python ops/implement-game-zone-client-v31.py
          python ops/update-game-zone-client-v31-tests.py

      - name: Validate backend bot activation and storefront sharing
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check server/server.js
          node --check server/lib/appActivation.js
          node --check bot/bot.js
          grep -F 'const ACTIVATION_MINUTES = 5' server/lib/appActivation.js
          grep -E '^[[:space:]]*code:.*randomCode\(8\)' server/lib/appActivation.js
          grep -F '📱 <b>ربط تطبيق المتجر</b>' bot/bot.js
          grep -F 'صالح لـ <b>5 دقائق</b>' bot/bot.js
          grep -F '🛍️ فتح متجر Game Zone' bot/bot.js
          grep -F '🗂️ الأقسام' bot/bot.js
          grep -F '📦 طلباتي' bot/bot.js
          grep -F '💳 شحن الرصيد' bot/bot.js
          grep -F '📱 ربط تطبيق المتجر' bot/bot.js
          grep -F '🛟 الدعم الفني' bot/bot.js
          grep -F 'catalogTile' android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java
          grep -F 'imageUrl' android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java
          grep -F '/api/config' android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java
          grep -F '/api/categories' android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java
          grep -F '/api/products' android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java
          cd server
          npm test
          npm run smoke
          npm run audit:routes
          node scripts/web-security-audit.js
          node scripts/secret-scan.js
          node scripts/deploy-security-audit.js
          cd ..

      - name: Build Game Zone Client v3.1.0
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'versionName = "3.1.0"' android/handoff/client/build.gradle.kts
          grep -F 'XXXX-XXXX' android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java
          grep -F 'الكود صالح 5 دقائق' android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java
          cd android/handoff
          gradle --no-daemon :client:assembleDebug
          cd ../..
          mkdir -p dist/client-v3.1.0
          cp android/handoff/client/build/outputs/apk/debug/client-debug.apk dist/client-v3.1.0/Game-Zone-Client-v3.1.0.apk
          sha256sum dist/client-v3.1.0/Game-Zone-Client-v3.1.0.apk > dist/client-v3.1.0/SHA256SUMS.txt
          test -s dist/client-v3.1.0/Game-Zone-Client-v3.1.0.apk

      - name: Commit production source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/lib/appActivation.js server/tests/appActivation.test.js bot/bot.js android/handoff/client/build.gradle.kts android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'feat(game-zone): polish bot and add photo-first Android client v3.1'
            git push origin HEAD:game-zone/rc20-production
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: game-zone-client-v3.1.0
          path: dist/client-v3.1.0/*
          retention-days: 90

      - name: Publish client v3.1.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag=game-zone-client-v3.1.0
          gh release delete "$tag" --yes >/dev/null 2>&1 || true
          git push origin ":refs/tags/$tag" >/dev/null 2>&1 || true
          gh release create "$tag" dist/client-v3.1.0/Game-Zone-Client-v3.1.0.apk dist/client-v3.1.0/SHA256SUMS.txt --target game-zone/rc20-production --title 'Game Zone Client v3.1.0' --notes 'Photo-first standalone Android storefront. Shares Game Zone categories, products, product images, payment methods, wallet and orders with Telegram. One-time bot linking code uses XXXX-XXXX format and expires after 5 minutes.'
