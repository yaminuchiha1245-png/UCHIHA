name: Game Zone RC20 Recovery Check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/game-zone-rc20-recover-check.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Game Zone staging
        uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
          path: staged
          fetch-depth: 0

      - name: Checkout trusted checksum manifest
        uses: actions/checkout@v4
        with:
          ref: main
          path: control

      - name: Search historical transports for exact RC20
        id: recover
        shell: bash
        run: |
          set -Eeuo pipefail
          S="$GITHUB_WORKSPACE/staged"
          EXPECTED="$GITHUB_WORKSPACE/control/ops/game-zone-rc20-runtime.sha256"
          FOUND="$RUNNER_TEMP/found-runtime"
          rm -rf "$FOUND"

          common_fix=(
            "$S/game-zone-release/runtime-parts/part-00.b64"
            "$S/game-zone-release/runtime-parts/part-01.b64"
            "$S/game-zone-release/runtime-parts/part-02-03.b64"
            "$S/game-zone-release/runtime-parts/part-04-05.b64"
            "$S/game-zone-release/runtime-v2/fix-06-07.b64"
            "$S/game-zone-release/runtime-parts/part-08-09.b64"
            "$S/game-zone-release/runtime-parts/part-10-11.b64"
            "$S/game-zone-release/runtime-parts/part-12-13.b64"
            "$S/game-zone-release/runtime-v2/part-14-15.b64"
            "$S/game-zone-release/runtime-v2/part-16-17.b64"
            "$S/game-zone-release/runtime-v2/part-18-19.b64"
            "$S/game-zone-release/runtime-v2/part-20-21.b64"
            "$S/game-zone-release/runtime-v2/part-22-23.b64"
            "$S/game-zone-release/runtime-v2/part-24-25.b64"
          )

          common_old=(
            "$S/game-zone-release/runtime-parts/part-00.b64"
            "$S/game-zone-release/runtime-parts/part-01.b64"
            "$S/game-zone-release/runtime-parts/part-02-03.b64"
            "$S/game-zone-release/runtime-parts/part-04-05.b64"
            "$S/game-zone-release/runtime-parts/part-06-07.b64"
            "$S/game-zone-release/runtime-parts/part-08-09.b64"
            "$S/game-zone-release/runtime-parts/part-10-11.b64"
            "$S/game-zone-release/runtime-parts/part-12-13.b64"
            "$S/game-zone-release/runtime-v2/part-14-15.b64"
            "$S/game-zone-release/runtime-v2/part-16-17.b64"
            "$S/game-zone-release/runtime-v2/part-18-19.b64"
            "$S/game-zone-release/runtime-v2/part-20-21.b64"
            "$S/game-zone-release/runtime-v2/part-22-23.b64"
            "$S/game-zone-release/runtime-v2/part-24-25.b64"
          )

          exact_check() {
            local root="$1"
            [ "$(find "$root" -type f | wc -l)" -eq "$(wc -l < "$EXPECTED")" ] || return 1
            (
              cd "$root"
              sha256sum -c "$EXPECTED" >/dev/null 2>&1
              awk '{sub(/^[^ ]+  /, ""); print}' "$EXPECTED" | LC_ALL=C sort > "$RUNNER_TEMP/expected-files"
              find . -type f -printf '%p\n' | LC_ALL=C sort > "$RUNNER_TEMP/actual-files"
              cmp -s "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
            )
          }

          try_candidate() {
            local name="$1"; shift
            local work="$RUNNER_TEMP/candidate-$name"
            rm -rf "$work" && mkdir -p "$work/extracted"
            : > "$work/joined.b64"
            local f
            for f in "$@"; do
              [ -f "$f" ] || { echo "[$name] missing: $f"; return 0; }
              cat "$f" >> "$work/joined.b64"
            done
            if ! tr -d '\r\n' < "$work/joined.b64" | base64 --decode > "$work/archive.xz" 2>/dev/null; then
              echo "[$name] base64=FAIL"; return 0
            fi
            echo "[$name] bytes=$(stat -c%s "$work/archive.xz") sha=$(sha256sum "$work/archive.xz" | awk '{print $1}')"
            xz -t "$work/archive.xz" >/dev/null 2>&1 || { echo "[$name] xz=FAIL"; return 0; }
            tar -xJf "$work/archive.xz" -C "$work/extracted" >/dev/null 2>&1 || { echo "[$name] tar=FAIL"; return 0; }
            local compose root
            compose="$(find "$work/extracted" -type f -path '*/deploy/docker-compose.yml' -print -quit)"
            [ -n "$compose" ] || { echo "[$name] compose=MISS"; return 0; }
            root="${compose%/deploy/docker-compose.yml}"
            if exact_check "$root"; then
              echo "[$name] EXACT_RC20=PASS"
              rm -rf "$FOUND"
              mkdir -p "$FOUND"
              cp -a "$root"/. "$FOUND"/
              echo "$name" > "$RUNNER_TEMP/found-name"
              return 9
            fi
            echo "[$name] checksum=MISS files=$(find "$root" -type f | wc -l)"
            return 0
          }

          run_candidate() {
            set +e
            try_candidate "$@"
            rc=$?
            set -e
            [ "$rc" -eq 9 ] && return 9
            return 0
          }

          found=0
          run_candidate fix-tail "${common_fix[@]}" "$S/game-zone-release/runtime-v2/tail-26-33.b64" || found=$?
          if [ "$found" -ne 9 ]; then run_candidate fix-tail-plus30 "${common_fix[@]}" "$S/game-zone-release/runtime-v2/tail-26-33.b64" "$S/game-zone-release/runtime-v2/part-30-31.b64" || found=$?; fi
          if [ "$found" -ne 9 ]; then run_candidate fix-26-33 "${common_fix[@]}" "$S/game-zone-release/runtime-v2/part-26-27.b64" "$S/game-zone-release/runtime-v2/part-30-31.b64" "$S/game-zone-release/runtime-v2/part-32-33.b64" || found=$?; fi
          if [ "$found" -ne 9 ]; then run_candidate fix-26-39 "${common_fix[@]}" "$S/game-zone-release/runtime-v2/part-26-27.b64" "$S/game-zone-release/runtime-v2/part-32-35.b64" "$S/game-zone-release/runtime-v2/part-36-39.b64" || found=$?; fi
          if [ "$found" -ne 9 ]; then run_candidate old-tail "${common_old[@]}" "$S/game-zone-release/runtime-v2/tail-26-33.b64" || found=$?; fi
          if [ "$found" -ne 9 ]; then run_candidate old-26-33 "${common_old[@]}" "$S/game-zone-release/runtime-v2/part-26-27.b64" "$S/game-zone-release/runtime-v2/part-30-31.b64" "$S/game-zone-release/runtime-v2/part-32-33.b64" || found=$?; fi
          if [ "$found" -ne 9 ]; then
            mapfile -t bundle_parts < <(find "$S/release-runtime/.bundle" -maxdepth 1 -type f -name 'part-*.b64' | LC_ALL=C sort)
            run_candidate release-bundle "${bundle_parts[@]}" || found=$?
          fi
          if [ "$found" -ne 9 ]; then
            mapfile -t old_parts < <(find "$S/game-zone-release/parts" -maxdepth 1 -type f -name '*.b64' | LC_ALL=C sort)
            run_candidate old-deploy "${old_parts[@]}" || found=$?
          fi

          if [ "$found" -ne 9 ] || [ ! -d "$FOUND" ]; then
            echo "EXACT_RC20_RECOVERY=NOT_FOUND"
            exit 2
          fi

          echo "EXACT_RC20_RECOVERY=FOUND"
          echo "candidate=$(cat "$RUNNER_TEMP/found-name")" >> "$GITHUB_OUTPUT"
          echo "runtime=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Publish recovered clean RC20 branch
        if: success()
        shell: bash
        env:
          RUNTIME: ${{ steps.recover.outputs.runtime }}
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/staged"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNTIME"/. .
          test -f deploy/docker-compose.yml
          test -f server/server.js
          test -f bot/bot.js
          test -f miniapp/index.html
          test -f admin/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release(game-zone): recover exact verified RC20 runtime"
          git push origin HEAD:game-zone/rc20-production --force-with-lease
          echo "CLEAN_RC20_BRANCH=PUBLISHED"
