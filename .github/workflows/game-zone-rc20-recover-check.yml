name: Game Zone RC20 Recovery Check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/game-zone-rc20-recover-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Game Zone staging
        uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
          path: staged
      - name: Checkout checksum manifest
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
      - name: Reconstruct historical RC20 runtime candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          S="$GITHUB_WORKSPACE/staged"
          OUT="$RUNNER_TEMP/candidate.b64"
          : > "$OUT"
          cat "$S/game-zone-release/runtime-parts/part-00.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-parts/part-01.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-parts/part-02-03.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-parts/part-04-05.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-v2/fix-06-07.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-parts/part-08-09.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-parts/part-10-11.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-parts/part-12-13.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-v2/part-14-15.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-v2/part-16-17.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-v2/part-18-19.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-v2/part-20-21.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-v2/part-22-23.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-v2/part-24-25.b64" >> "$OUT"
          cat "$S/game-zone-release/runtime-v2/tail-26-33.b64" >> "$OUT"

          tr -d '\r\n' < "$OUT" | base64 --decode > "$RUNNER_TEMP/candidate.bin"
          echo "candidate_b64_bytes=$(tr -d '\r\n' < "$OUT" | wc -c)"
          echo "candidate_bytes=$(stat -c%s "$RUNNER_TEMP/candidate.bin")"
          echo "candidate_sha256=$(sha256sum "$RUNNER_TEMP/candidate.bin" | awk '{print $1}')"
          file "$RUNNER_TEMP/candidate.bin"
          xz -t "$RUNNER_TEMP/candidate.bin"
          mkdir -p "$RUNNER_TEMP/extracted"
          tar -xJf "$RUNNER_TEMP/candidate.bin" -C "$RUNNER_TEMP/extracted"
          echo "XZ_AND_TAR=PASS"

          compose="$(find "$RUNNER_TEMP/extracted" -type f -path '*/deploy/docker-compose.yml' -print -quit)"
          test -n "$compose"
          root="${compose%/deploy/docker-compose.yml}"
          echo "runtime_root=$root"
          actual_count="$(find "$root" -type f | wc -l)"
          echo "actual_file_count=$actual_count"

          cd "$root"
          expected="$GITHUB_WORKSPACE/control/ops/game-zone-rc20-runtime.sha256"
          awk '{sub(/^[^ ]+  /, ""); print}' "$expected" | LC_ALL=C sort > "$RUNNER_TEMP/expected.txt"
          find . -type f -printf '%p\n' | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          echo '--- FILE LIST DIFFERENCE ---'
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt" || true
          echo '--- CHECKSUM RESULTS ---'
          sha256sum -c "$expected" || true

          matched=0; missing=0; mismatch=0
          while read -r hash path; do
            if [ ! -f "$path" ]; then
              missing=$((missing+1))
            elif [ "$(sha256sum "$path" | awk '{print $1}')" = "$hash" ]; then
              matched=$((matched+1))
            else
              mismatch=$((mismatch+1))
            fi
          done < "$expected"
          echo "MATCHED=$matched"
          echo "MISSING=$missing"
          echo "MISMATCH=$mismatch"
          echo "TOTAL_EXPECTED=$(wc -l < "$expected")"
