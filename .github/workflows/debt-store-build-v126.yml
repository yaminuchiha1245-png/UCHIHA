name: Build Debt Store v1.2.6

on:
  push:
    branches: [debt-store-build]
    paths:
      - '.github/workflows/debt-store-build-v126.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v1.2.6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,re
          parts=sorted(Path('debt-build').glob('source.part*'))
          data=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','',''.join(p.read_text() for p in parts)),validate=False)
          if hashlib.sha256(data).hexdigest()!='f9b1921583b0b9fc9cb50c0b9ac74e7efd17cc5410dc0c93a58800ff1d3396ca': raise SystemExit('base source hash mismatch')
          Path('/tmp/debt-source.zip').write_bytes(data)
          PY
          mkdir -p debt-app
          unzip -q /tmp/debt-source.zip -d debt-app
          sed -i 's/import android\.app\.biometric\.BiometricPrompt;/import android.hardware.biometrics.BiometricPrompt;/' debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java
          python3 debt-build/patch_v101.py debt-app
          python3 debt-build/patch_v102.py debt-app
          python3 debt-build/patch_v103.py debt-app
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,tarfile,re
          parts=sorted(Path('debt-build').glob('v110payload.part*'))
          data=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','',''.join(p.read_text() for p in parts)),validate=True)
          if len(parts)!=5 or hashlib.sha256(data).hexdigest()!='cb2605e2766f0f4dfa3a53ff7a6dfd4d0637d7c39906705187427bbae39dd55b': raise SystemExit('v110 payload mismatch')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf: tf.extractall('debt-app')
          PY
          python3 debt-build/patch_v111.py debt-app
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,tarfile,re
          def apply(prefix,count,expected):
              parts=sorted(Path('debt-build').glob(prefix+'*'))
              data=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','',''.join(p.read_text() for p in parts)),validate=True)
              if len(parts)!=count or hashlib.sha256(data).hexdigest()!=expected: raise SystemExit(prefix+' mismatch')
              with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf: tf.extractall('debt-app')
          apply('v112payload.part',4,'66dc5cabeadc1fb4b58f10f10861c4d67c482966e6e667e0be81ced0dde68da3')
          apply('v120payload.part',5,'81909bbeafee7ce5e71de20e07834743bde286c190f2275e0b827c5561f82fc9')
          PY
          python3 debt-build/patch_v121.py debt-app
          python3 debt-build/patch_v122.py debt-app
          python3 debt-build/patch_v122_cleanup.py debt-app
          python3 debt-build/patch_v123.py debt-app
          python3 debt-build/patch_v124.py debt-app
          python3 debt-build/patch_v125.py debt-app
          python3 debt-build/patch_v126.py debt-app
          grep -q "versionCode 14" debt-app/app/build.gradle
          grep -q "versionName '1.2.6'" debt-app/app/build.gradle
          grep -q "applicationId 'com.uchiha.debtstore'" debt-app/app/build.gradle
          grep -q "التركي محوّل بالدولار" debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java
          grep -q '"$"+summary.optString("tryConvertedUsd"' debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java
          if grep -q 'String\[\] labs={"الرصيد بالدولار","الرصيد بالتركي"' debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java; then exit 1; fi
          grep -q "searchRenderV125" debt-app/app/src/main/assets/app-v121.js
          grep -q "totalDueUsd" debt-app/app/src/main/assets/app-v121.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate JavaScript
        working-directory: debt-app
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/app-v110.js
          node --check app/src/main/assets/app-v120.js
          node --check app/src/main/assets/app-v121.js

      - name: Prepare persistent release signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          python3 - <<'PY' > /tmp/signing_artifact_id
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts?name=UCHIHA-Debt-Store-Signing-Key&per_page=100',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
          valid=[a for a in data.get('artifacts',[]) if not a.get('expired')]; valid.sort(key=lambda a:a.get('created_at',''),reverse=True)
          print(valid[0]['id'] if valid else '')
          PY
          ARTIFACT_ID="$(cat /tmp/signing_artifact_id)"
          test -n "$ARTIFACT_ID"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/signing.zip
          unzip -q /tmp/signing.zip -d signing
          test -s signing/uchiha-release.jks
          test -s signing/password.txt

      - name: Build signed release APK
        working-directory: debt-app
        shell: bash
        run: |
          PASS="$(cat ../signing/password.txt)"
          export UCHIHA_KEYSTORE="$GITHUB_WORKSPACE/signing/uchiha-release.jks"
          export UCHIHA_STORE_PASSWORD="$PASS"
          export UCHIHA_KEY_PASSWORD="$PASS"
          export UCHIHA_KEY_ALIAS=uchiha-release
          gradle --no-daemon clean assembleRelease

      - name: Verify signed APK
        run: |
          APK=debt-app/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.uchiha.debtstore'" | grep "versionCode='14'" | grep "versionName='1.2.6'"

      - name: Prepare deliverables
        run: |
          cp debt-app/app/build/outputs/apk/release/app-release.apk UCHIHA-Debt-Store-v1.2.6-RELEASE.apk
          sha256sum UCHIHA-Debt-Store-v1.2.6-RELEASE.apk > UCHIHA-Debt-Store-v1.2.6-RELEASE.apk.sha256
          (cd debt-app && zip -qr ../UCHIHA-Debt-Store-v1.2.6-source.zip .)

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: UCHIHA-Debt-Store-v1.2.6-RELEASE
          path: |
            UCHIHA-Debt-Store-v1.2.6-RELEASE.apk
            UCHIHA-Debt-Store-v1.2.6-RELEASE.apk.sha256
            UCHIHA-Debt-Store-v1.2.6-source.zip
          if-no-files-found: error
          retention-days: 90
