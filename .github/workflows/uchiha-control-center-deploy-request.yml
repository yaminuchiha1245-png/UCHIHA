name: UCHIHA Control Center Deploy Request

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: uchiha-control-center-deploy-request
  cancel-in-progress: false

jobs:
  request:
    if: github.event.issue.title == '[UCHIHA-DEPLOY-CONTROL]' && github.event.issue.user.login == 'yaminuchiha1245-png'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: UCHIHA VPS NEW

    steps:
      - name: Validate owner deployment request
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          issue=event['issue']
          try:
              body=json.loads(issue.get('body') or '')
          except Exception:
              print('Issue body must be one JSON object.', file=sys.stderr)
              raise SystemExit(2)
          if body != {'confirm':'DEPLOY','target':'control-center'}:
              print('Deployment confirmation payload is invalid.', file=sys.stderr)
              raise SystemExit(2)
          PY

      - name: Validate VPS deployment secrets
        env:
          VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          VPS_USER: ${{ secrets.UCHIHA_VPS_USER }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_KEY_B64"
          test -n "$VPS_KNOWN_HOSTS"

      - name: Prepare SSH
        env:
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Backup current persistent data
        env:
          VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          VPS_USER: ${{ secrets.UCHIHA_VPS_USER }}
        shell: bash
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          BACKUP_DIR="$HOME/uchiha-control-center/backups"
          BACKUP_FILE="$BACKUP_DIR/uchiha-data-before-deploy-$RUN_ID.tgz"
          mkdir -p "$BACKUP_DIR"
          docker inspect uchiha-control-center >/dev/null
          docker exec uchiha-control-center sh -lc 'tar czf - -C /app/data .' > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          chmod 600 "$BACKUP_FILE"
          echo "Persistent data backup created."
          REMOTE

      - name: Dispatch guarded production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/dispatch.json
          import json
          print(json.dumps({'ref':'main','inputs':{'confirm':'DEPLOY'}}, separators=(',',':')))
          PY
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/uchiha-control-center-deploy.yml/dispatches" \
            --data-binary @/tmp/dispatch.json

      - name: Mark request accepted
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "UCHIHA production deployment was requested after a persistent-data backup. The guarded deployment workflow will perform health checks and rollback on failure."
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
