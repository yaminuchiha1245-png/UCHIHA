name: UCHIHA Control Center APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control-center/android-apk/**'
      - 'control-center/team-api/**'
      - '.github/workflows/uchiha-control-center-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'control-center/android-apk/**'
      - 'control-center/team-api/**'
      - '.github/workflows/uchiha-control-center-apk.yml'

permissions:
  contents: read

jobs:
  validate-team-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Team API dependencies
        working-directory: control-center/team-api
        run: npm install --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Test Team API
        working-directory: control-center/team-api
        run: npm test

  validate-v6-mobile-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct v6
        shell: bash
        run: |
          cat control-center/v6/package/part-* > /tmp/v6-mobile.tgz.b64
          base64 --decode /tmp/v6-mobile.tgz.b64 > /tmp/v6-mobile.tgz
          rm -rf /tmp/v6-mobile
          mkdir -p /tmp/v6-mobile
          tar -xzf /tmp/v6-mobile.tgz -C /tmp/v6-mobile

      - name: Integrate mobile API
        run: node control-center/team-api/integrate-v6.js /tmp/v6-mobile

      - name: Install integrated dependencies
        working-directory: /tmp/v6-mobile
        run: npm install --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Syntax check integrated runtime
        working-directory: /tmp/v6-mobile
        run: |
          node --check server.js
          node --check mobile/server.js
          node --check mobile/auth-store.js
          node --check mobile/preview-source.js
          node --check mobile/source-browser.js
          grep -q "api/mobile" server.js
          grep -q "previewFileMatch" mobile/server.js
          grep -q "sourceTreeMatch" mobile/server.js
          grep -q "UCHIHA_VAULT_MASTER_KEY" compose.yaml
          grep -q "COPY --chown=node:node mobile ./mobile" Dockerfile

      - name: Smoke test owner preview and source guards through v6
        shell: bash
        run: |
          export SETUP_CODE="$(openssl rand -hex 16)"
          SETUP_HASH="$(printf '%s' "$SETUP_CODE" | sha256sum | awk '{print $1}')"
          MASTER_KEY="$(openssl rand -hex 32)"
          OWNER_BODY="$(node -e 'process.stdout.write(JSON.stringify({setupCode:process.env.SETUP_CODE,username:"ciowner",displayName:"CI Owner",password:"OwnerPassword-123"}))')"
          cd /tmp/v6-mobile
          UCHIHA_TEAM_AUTH_STORE=/tmp/uchiha-ci-team-auth.json \
          UCHIHA_CONTROL_STATE_PATH=/tmp/v6-mobile/data/state.json \
          UCHIHA_CONNECTION_VAULT=/tmp/uchiha-ci-vault.json \
          UCHIHA_CONNECTION_STORE=/tmp/uchiha-ci-connections.json \
          UCHIHA_VAULT_MASTER_KEY="$MASTER_KEY" \
          UCHIHA_TEAM_SETUP_CODE_HASH="$SETUP_HASH" \
          APP_ENV=development HOST=127.0.0.1 PORT=8793 node server.js >/tmp/uchiha-v6-mobile.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8793/api/health >/tmp/v6-health.json; then break; fi
            sleep 0.25
          done
          grep -q '"guardedExecutor":true' /tmp/v6-health.json
          curl -fsS http://127.0.0.1:8793/api/mobile/setup >/tmp/mobile-setup.json
          grep -q '"needsOwner":true' /tmp/mobile-setup.json
          grep -q '"setupReady":true' /tmp/mobile-setup.json
          curl -fsS -H 'Content-Type: application/json' -d "$OWNER_BODY" \
            http://127.0.0.1:8793/api/mobile/setup/owner >/tmp/mobile-owner.json
          grep -q '"role":"OWNER"' /tmp/mobile-owner.json
          TOKEN="$(node -e "const x=require('/tmp/mobile-owner.json');process.stdout.write(x.token)")"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8793/api/mobile/me >/tmp/mobile-me.json
          grep -q '"username":"ciowner"' /tmp/mobile-me.json
          curl -fsS http://127.0.0.1:8793/api/mobile/setup >/tmp/mobile-setup-after.json
          grep -q '"needsOwner":false' /tmp/mobile-setup-after.json
          PREVIEW_CODE="$(curl -sS -o /tmp/mobile-preview.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8793/api/mobile/projects/uchiha-control-center/preview)"
          test "$PREVIEW_CODE" = '409'
          grep -q 'preview_github_not_linked' /tmp/mobile-preview.json
          SOURCE_CODE="$(curl -sS -o /tmp/mobile-source.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8793/api/mobile/projects/uchiha-control-center/source/tree)"
          test "$SOURCE_CODE" = '409'
          grep -q 'source_github_not_linked' /tmp/mobile-source.json

  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: control-center/android-apk
        run: gradle --no-daemon assembleDebug

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p dist
          cp control-center/android-apk/app/build/outputs/apk/debug/app-debug.apk dist/UCHIHA-Control-Center-v2.0.0-alpha09.apk
          sha256sum dist/UCHIHA-Control-Center-v2.0.0-alpha09.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UCHIHA-Control-Center-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
