name: UCHIHA Alpha14 Inspect

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/uchiha-alpha14-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v6
        shell: bash
        run: |
          cat control-center/v6/package/part-* > /tmp/v6.tgz.b64
          base64 --decode /tmp/v6.tgz.b64 > /tmp/v6.tgz
          mkdir -p /tmp/v6
          tar -xzf /tmp/v6.tgz -C /tmp/v6
      - name: Print guarded deploy contract only
        working-directory: /tmp/v6
        shell: bash
        run: |
          echo '=== bridge-command.js ==='
          nl -ba scripts/bridge-command.js
          echo '=== lib/executor.js ==='
          nl -ba lib/executor.js
          echo '=== deploy-related server routes ==='
          grep -n -C 8 -E 'deploy|approval|execution' server.js | head -n 320
