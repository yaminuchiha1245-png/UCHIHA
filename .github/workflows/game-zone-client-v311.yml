name: Game Zone Client v3.1.1

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-client-v311.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Apply image layer polish
        shell: bash
        run: |
          set -Eeuo pipefail
          python ops/fix-game-zone-client-v311-images.py
          grep -F 'versionName = "3.1.1"' android/handoff/client/build.gradle.kts
          python - <<'PY'
          from pathlib import Path
          s=Path('android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java').read_text()
          a=s.index('TextView fallback=text("GAME ZONE"')
          b=s.index('ImageView image=new ImageView',a)
          assert a < b, 'image must render over fallback placeholder'
          assert 'catalogTile' in s and 'imageUrl' in s
          print('PHOTO_LAYER_ORDER=PASS')
          PY
      - name: Build APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd android/handoff
          gradle --no-daemon :client:assembleDebug
          cd ../..
          mkdir -p dist/client-v3.1.1
          cp android/handoff/client/build/outputs/apk/debug/client-debug.apk dist/client-v3.1.1/Game-Zone-Client-v3.1.1.apk
          sha256sum dist/client-v3.1.1/Game-Zone-Client-v3.1.1.apk > dist/client-v3.1.1/SHA256SUMS.txt
          test -s dist/client-v3.1.1/Game-Zone-Client-v3.1.1.apk
      - name: Commit Android source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/handoff/client/build.gradle.kts android/handoff/client/src/main/java/com/gamezone/store/MainActivity.java
          if ! git diff --cached --quiet; then
            git commit -m 'fix(game-zone): keep catalog photos above fallback labels'
            git push origin HEAD:game-zone/rc20-production
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: game-zone-client-v3.1.1
          path: dist/client-v3.1.1/*
          retention-days: 90
      - name: Publish v3.1.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag=game-zone-client-v3.1.1
          gh release delete "$tag" --yes >/dev/null 2>&1 || true
          git push origin ":refs/tags/$tag" >/dev/null 2>&1 || true
          gh release create "$tag" dist/client-v3.1.1/Game-Zone-Client-v3.1.1.apk dist/client-v3.1.1/SHA256SUMS.txt --target game-zone/rc20-production --title 'Game Zone Client v3.1.1' --notes 'Photo-polished standalone Android client. Category/product/payment images display cleanly above the fallback placeholder. Keeps the same shared Game Zone backend and 5-minute one-time bot linking.'
