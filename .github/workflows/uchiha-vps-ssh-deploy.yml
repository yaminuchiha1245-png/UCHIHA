name: UCHIHA VPS SSH Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - builder/v1-platform
    paths:
      - .github/workflows/uchiha-vps-ssh-deploy.yml

permissions:
  contents: write

concurrency:
  group: uchiha-vps-ssh-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated Builder to VPS over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout validated Builder commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify VPS deployment secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "$VPS_HOST" ]] || { echo "VPS_HOST secret is missing" >&2; exit 1; }
          [[ -n "$VPS_USER" ]] || { echo "VPS_USER secret is missing" >&2; exit 1; }
          [[ "$VPS_SSH_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]] || { echo "VPS_SSH_KEY secret is missing or malformed" >&2; exit 1; }

      - name: Publish immutable deploy ref
        shell: bash
        run: |
          set -Eeuo pipefail
          git push --force origin "HEAD:refs/heads/deploy/builder-v1-platform"

      - name: Reconstruct and validate restricted SSH key
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          python3 - <<'PY'
          import base64
          import os
          import re
          import textwrap
          from pathlib import Path

          header = "-----BEGIN OPENSSH PRIVATE KEY-----"
          footer = "-----END OPENSSH PRIVATE KEY-----"
          raw = os.environ["VPS_SSH_KEY"].strip()
          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in {'"', "'"}:
              raw = raw[1:-1]
          raw = raw.replace("\\r", "").replace("\\n", "\n").replace("\r", "")
          if header not in raw or footer not in raw:
              raise SystemExit("VPS_SSH_KEY does not contain a complete OpenSSH private-key envelope")

          body_raw = raw.split(header, 1)[1].split(footer, 1)[0]
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body_raw)
          try:
              decoded = base64.b64decode(body, validate=True)
          except Exception as exc:
              raise SystemExit("VPS_SSH_KEY body is not valid Base64; replace the GitHub secret with the original private key") from exc
          if not decoded.startswith(b"openssh-key-v1\x00"):
              raise SystemExit("VPS_SSH_KEY payload is not a valid OpenSSH private key")

          normalized = base64.b64encode(decoded).decode("ascii")
          pem = header + "\n" + "\n".join(textwrap.wrap(normalized, 70)) + "\n" + footer + "\n"
          Path.home().joinpath(".ssh/uchiha_deploy").write_text(pem, encoding="utf-8")
          PY
          chmod 600 "$HOME/.ssh/uchiha_deploy"
          ssh-keygen -y -f "$HOME/.ssh/uchiha_deploy" >/dev/null
          ssh-keyscan -T 15 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact commit to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/uchiha_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            'sudo -n /usr/bin/bash /opt/uchiha-builder/repo/builder/scripts/update-vps.sh'

      - name: Verify exact release and production health
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          remote_sha="$(ssh -i "$HOME/.ssh/uchiha_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            'git -C /opt/uchiha-builder/repo rev-parse HEAD')"
          [[ "$remote_sha" == "$GITHUB_SHA" ]] || {
            echo "VPS commit mismatch: expected $GITHUB_SHA, got $remote_sha" >&2
            exit 1
          }
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://uchiha-builder.com/ready >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://uchiha-builder.com/ -o /tmp/uchiha-home.html
          grep -qi '<html' /tmp/uchiha-home.html

      - name: Deployment summary
        run: |
          echo "### UCHIHA VPS production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Domain: \`https://uchiha-builder.com\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Transport: restricted SSH deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health verification: passed" >> "$GITHUB_STEP_SUMMARY"
