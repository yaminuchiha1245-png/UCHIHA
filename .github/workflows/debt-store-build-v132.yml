name: Build Debt Store v1.3.2 Safe Camera

on:
  push:
    branches: [debt-store-build]
    paths:
      - '.github/workflows/debt-store-build-v132.yml'
      - 'debt-build/patch_v132.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and patch v1.3.2 safe camera
        shell: bash
        run: |
          set -euo pipefail
          bash debt-build/reconstruct_v130.sh
          python3 debt-build/patch_v131.py debt-app
          python3 debt-build/patch_v132.py debt-app
          grep -q "versionCode 19" debt-app/app/build.gradle
          grep -q "versionName '1.3.2'" debt-app/app/build.gradle
          grep -q "com.google.zxing:core:3.5.3" debt-app/app/build.gradle
          grep -q "androidx.core:core:1.15.0" debt-app/app/build.gradle
          grep -q "android.useAndroidX=true" debt-app/gradle.properties
          ! grep -q 'android.permission.CAMERA' debt-app/app/src/main/AndroidManifest.xml
          ! grep -q 'BarcodeCaptureActivity' debt-app/app/src/main/AndroidManifest.xml
          ! test -e debt-app/app/src/main/java/com/uchiha/debtstore/BarcodeCaptureActivity.java
          grep -q 'openSystemCameraBarcodeFallback' debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java
          grep -q 'ACTION_IMAGE_CAPTURE' debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java
          grep -q 'decodeBarcodeBitmap' debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java
          grep -q 'FileProvider.getUriForFile' debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java
          ! grep -q 'IntentIntegrator' debt-app/app/src/main/java/com/uchiha/debtstore/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source
        working-directory: debt-app
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/app-v110.js
          node --check app/src/main/assets/app-v120.js
          node --check app/src/main/assets/app-v121.js
          node --check app/src/main/assets/app-v130.js
          test -s app/src/main/res/xml/file_paths.xml

      - name: Prepare persistent release signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          python3 - <<'PY' > /tmp/signing_artifact_id
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts?name=UCHIHA-Debt-Store-Signing-Key&per_page=100',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
          valid=[a for a in data.get('artifacts',[]) if not a.get('expired')]; valid.sort(key=lambda a:a.get('created_at',''),reverse=True)
          print(valid[0]['id'] if valid else '')
          PY
          ARTIFACT_ID="$(cat /tmp/signing_artifact_id)"
          test -n "$ARTIFACT_ID"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/signing.zip
          unzip -q /tmp/signing.zip -d signing
          test -s signing/uchiha-release.jks
          test -s signing/password.txt

      - name: Build release APK
        working-directory: debt-app
        run: gradle --no-daemon clean assembleRelease

      - name: Zipalign and sign V1 V2 V3
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="$(find debt-app/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -n1)"
          test -n "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" /tmp/uchiha-v132-aligned.apk
          PASS="$(cat signing/password.txt)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/uchiha-release.jks \
            --ks-key-alias uchiha-release \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --min-sdk-version 23 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out UCHIHA-Debt-Store-v1.3.2-COMPAT.apk \
            /tmp/uchiha-v132-aligned.apk

      - name: Verify signed APK and safe-camera contract
        shell: bash
        run: |
          set -euo pipefail
          APK=UCHIHA-Debt-Store-v1.3.2-COMPAT.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$APK"
          VERIFY="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 23 --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY"
          echo "$VERIFY" | grep -F 'Verified using v1 scheme (JAR signing): true'
          echo "$VERIFY" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          echo "$VERIFY" | grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true'
          echo "$VERIFY" | grep -F 'Signer #1 certificate SHA-256 digest: dd89d1b90fc8d1566f00af7dd460ae7affd98991731637fa4df6aa9716656197'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep "package: name='com.uchiha.debtstore'" /tmp/badging.txt | grep "versionCode='19'" | grep "versionName='1.3.2'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q "android.permission.CAMERA"; then
            echo 'ERROR: CAMERA permission unexpectedly present in safe-camera build' >&2
            exit 1
          fi
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -t "$APK" >/dev/null

      - name: Prepare deliverables
        run: |
          sha256sum UCHIHA-Debt-Store-v1.3.2-COMPAT.apk > UCHIHA-Debt-Store-v1.3.2-COMPAT.apk.sha256
          (cd debt-app && zip -qr ../UCHIHA-Debt-Store-v1.3.2-source.zip .)

      - name: Upload compatibility package
        uses: actions/upload-artifact@v4
        with:
          name: UCHIHA-Debt-Store-v1.3.2-COMPAT
          path: |
            UCHIHA-Debt-Store-v1.3.2-COMPAT.apk
            UCHIHA-Debt-Store-v1.3.2-COMPAT.apk.sha256
            UCHIHA-Debt-Store-v1.3.2-source.zip
          if-no-files-found: error
          retention-days: 90
