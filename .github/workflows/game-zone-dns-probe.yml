name: Game Zone DNS Probe

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-dns-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/uchiha_vps
          chmod 600 ~/.ssh/uchiha_vps
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts

      - name: Probe VPS resolver and public HTTPS
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"
          USER="${USER:-root}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/uchiha_vps -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ENV_FILE=/etc/uchiha/secrets/game-zone.env
          DOMAIN="$(awk -F= '$1=="DOMAIN"{print substr($0,index($0,"=")+1); exit}' "$ENV_FILE")"
          test -n "$DOMAIN"
          resolve_ok=0
          https_ok=0
          for i in $(seq 1 8); do
            if getent ahosts "$DOMAIN" >/dev/null 2>&1; then resolve_ok=$((resolve_ok+1)); fi
            if curl -fsSI --max-time 8 "https://$DOMAIN/admin/" >/dev/null 2>&1; then https_ok=$((https_ok+1)); fi
            sleep 2
          done
          echo "DNS_RESOLVE_PASSES=$resolve_ok/8"
          echo "HTTPS_ADMIN_PASSES=$https_ok/8"
          test "$resolve_ok" -ge 7
          test "$https_ok" -ge 7
          echo 'GAME_ZONE_DNS_READINESS=PASS'
          REMOTE
