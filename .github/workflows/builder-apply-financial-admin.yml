name: UCHIHA Builder Apply Financial Admin

on:
  push:
    branches:
      - "builder/v1-platform"
    paths:
      - ".github/agent-financial-admin/**"
      - ".github/workflows/builder-apply-financial-admin.yml"

permissions:
  contents: write

concurrency:
  group: builder-financial-admin
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: builder/v1-platform
          fetch-depth: 0
      - name: Verify and apply financial admin patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-financial-admin/part-* | base64 --decode | gzip --decompress > /tmp/financial-admin.patch
          echo "bb7ae4705e04050d49998868fdfc59c8247432afb8609089edd31d9c5281bc44  /tmp/financial-admin.patch" | sha256sum --check --strict
          git apply --check /tmp/financial-admin.patch
          git apply --index /tmp/financial-admin.patch
          rm -rf .github/agent-financial-admin
          rm -f .github/workflows/builder-apply-financial-admin.yml
          git add -A
          git diff --cached --check
      - name: Commit financial administration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(builder): complete store financial administration"
          git push origin HEAD:builder/v1-platform
