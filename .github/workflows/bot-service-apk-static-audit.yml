name: Bot Service APK tenant and signature static audit

on:
  push:
    branches:
      - bot-service/coordinator-android-qa-20260927
    paths:
      - .github/workflows/bot-service-apk-static-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect two existing private APK files without approving or publishing
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
          KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s' "$KEY_B64" | base64 -d > ~/.ssh/bot_apk_audit
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/bot_apk_audit ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${PORT:-22}" -i ~/.ssh/bot_apk_audit "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/opt/uchiha/projects/bot-service-stage/uchiha-bot-service
          test "$(cat "$root/VERSION")" = '0.5.51'
          export PYTHONPATH="$root/android/native-shell"
          export PYTHONDONTWRITEBYTECODE=1
          python3 - <<'PY'
          import hashlib,re,struct,subprocess,zipfile
          from pathlib import Path
          from release_preflight import png_image_digest,PNG,TOOLS,INTERNET
          from tenant_config import load_dynamic_config
          base=Path('/opt/uchiha/projects/bot-service-stage/workstream-05-signed-private-20260926')
          entries=((1,'uchiha-demo-v1.0.0.apk','com.uchiha.store.demo'),
                   (2,'uchiha-game-zone-v1.0.0.apk','com.uchiha.gamezone'))
          def run(*cmd):
              p=subprocess.run(cmd,capture_output=True,text=True,timeout=70)
              if p.returncode: raise RuntimeError('Static tool failed: '+Path(cmd[0]).name)
              return p.stdout
          for id,name,package in entries:
              apk=base/f'bot-{id}'/name
              assert apk.is_file() and 20000<=apk.stat().st_size<=15000000
              badges=run(str(TOOLS/'aapt'),'dump','badging',str(apk))
              m=re.search(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",badges,re.M)
              assert m and (m.group(1),m.group(2),m.group(3))==(package,'1','1.0.0')
              assert "sdkVersion:'24'" in badges and "targetSdkVersion:'34'" in badges
              perms=run(str(TOOLS/'aapt'),'dump','permissions',str(apk))
              assert re.findall(r"uses-permission(?:-sdk-\\d+)?: name='([^']+)'",perms)==[INTERNET]
              run(str(TOOLS/'zipalign'),'-c','-v','4',str(apk))
              with zipfile.ZipFile(apk) as archive:
                  assert archive.testzip() is None
                  assert {'AndroidManifest.xml','resources.arsc','classes.dex'}.issubset(archive.namelist())
                  ids=re.findall(rb'https://uchiha-bot\\.155-254-35-187\\.sslip\\.io/\\?bot_id=(\\d+)',archive.read('classes.dex'))
                  assert ids==[str(id).encode()], (id,ids)
                  art=[f for f in archive.namelist() if re.fullmatch(r'res/drawable-nodpi(?:-v\\d+)?/store_icon\\.png',f)]
                  assert len(art)==1
                  icon=archive.read(art[0])
                  assert icon.startswith(PNG) and struct.unpack('>II',icon[16:24])==(512,512)
              signed=subprocess.run([str(TOOLS/'apksigner'),'verify','--verbose','--print-certs',str(apk)],capture_output=True,text=True,timeout=70)
              scheme=signed.returncode==0 and 'Verified using v2 scheme (APK Signature Scheme v2): true' in signed.stdout
              merchant=load_dynamic_config(id,'https://uchiha-bot.155-254-35-187.sslip.io')
              image_same=hashlib.sha256(merchant['icon_bytes']).digest()==hashlib.sha256(icon).digest()
              if not image_same:
                  image_same=png_image_digest(merchant['icon_bytes'])==png_image_digest(icon)
              assert image_same,'APK icon does not match live merchant'
              assert f"application-label:'{merchant['name']}'" in badges,'APK name changed since packaging'
              print(f'BOT_{id}_PACKAGE={package}')
              print(f'BOT_{id}_VERSION=1.0.0')
              print(f'BOT_{id}_START_URL=TENANT_{id}')
              print(f'BOT_{id}_CURRENT_NAME_AND_ICON=PASS')
              print(f'BOT_{id}_APK_V2_SIGNATURE_TECHNICAL={scheme}')
              print(f'BOT_{id}_CUSTOMER_SIGNING_APPROVAL=NOT_VERIFIED')
          print('PRIVATE_APK_STATIC_AUDIT=PASS')
          print('PUBLIC_RELEASE=NOT_APPROVED')
          PY
          echo 'PRODUCTION_FILES_MODIFIED=NO'
          REMOTE
