name: Game Zone Provider Vault V7 Postdeploy

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-provider-vault-v7-postdeploy.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST"; test -n "$VPS_KEY_B64"; PORT="${PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/uchiha_vps
          chmod 600 ~/.ssh/uchiha_vps
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts
      - name: Verify live provider vault UI and readiness
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"; USER="${USER:-root}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/uchiha_vps -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          TARGET=/opt/uchiha/projects/game-zone
          ENV=/etc/uchiha/secrets/game-zone.env
          cd "$TARGET"
          grep -Fq 'API Token / Secret' admin/admin.js
          grep -Fq 'providerSecretConfigured' server/server.js
          test -f server/lib/providerCredential.js
          echo 'PROVIDER_VAULT_SOURCE=PASS'
          cd deploy
          ln -sfn "$ENV" .env.production
          domain="$(awk -F= '$1=="DOMAIN"{print substr($0,index($0,"=")+1); exit}' .env.production)"
          test -n "$domain"
          public_js="$(curl -fsS --max-time 15 "https://$domain/admin/admin.js")"
          grep -Fq 'API Token / Secret' <<<"$public_js"
          echo 'PROVIDER_VAULT_PUBLIC_UI=PASS'
          server_cid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q server)"
          test -n "$server_cid"
          docker exec "$server_cid" node -e 'const b="http://127.0.0.1:3000";(async()=>{const l=await fetch(b+"/api/admin/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:process.env.ADMIN_PASSWORD})});if(!l.ok)process.exit(2);const x=await l.json();const r=await fetch(b+"/api/admin/readiness",{headers:{authorization:"Bearer "+x.token}});if(!r.ok)process.exit(3);const d=await r.json();const p=(d.checks||[]).filter(x=>!x.ok);console.log("READINESS_TOTAL="+(d.checks||[]).length);console.log("READINESS_PENDING="+p.length);console.log("READINESS_PENDING_IDS="+p.map(x=>x.id).join(","));console.log("READINESS_PENDING_LABELS="+p.map(x=>x.label).join(" | "))})().catch(()=>process.exit(4))'
          echo "DEPLOYED_SHA=$(cat "$TARGET/.deployed-commit")"
          echo 'GAME_ZONE_PROVIDER_VAULT_V7=PASS'
          REMOTE
