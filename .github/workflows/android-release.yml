name: UCHIHA Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - "builder/android-release-v1"
    paths:
      - "builder/mobile/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: uchiha-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    name: Build unsigned Android release payload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: builder/mobile

    steps:
      - name: Remove obsolete bootstrap signing artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9727556943" || true

      - name: Checkout clean source tree
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: builder/mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install exact mobile dependencies
        run: npm ci

      - name: Synchronize Capacitor projects
        run: npm run sync

      - name: Build unsigned Android release payload
        shell: bash
        run: |
          set -Eeuo pipefail
          unset UCHIHA_ANDROID_KEYSTORE UCHIHA_ANDROID_STORE_PASSWORD UCHIHA_ANDROID_KEY_ALIAS UCHIHA_ANDROID_KEY_PASSWORD || true
          chmod +x android/gradlew
          npm run apk:release
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Export Android apksigner tool
        shell: bash
        run: |
          set -Eeuo pipefail
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          jar="$build_tools_dir/lib/apksigner.jar"
          test -s "$jar"
          java -cp "$jar" com.android.apksigner.ApkSignerTool --version
          output="$RUNNER_TEMP/uchiha-release-payload"
          install -d "$output"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$output/UCHIHA-Owner-1.0-release-unsigned.apk"
          cp "$jar" "$output/apksigner.jar"
          sha256sum "$output/UCHIHA-Owner-1.0-release-unsigned.apk" > "$output/UCHIHA-Owner-1.0-release-unsigned.sha256"
          echo "UCHIHA_RELEASE_PAYLOAD=$output" >> "$GITHUB_ENV"

      - name: Upload release payload and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: uchiha-owner-android-release-payload
          path: |
            ${{ env.UCHIHA_RELEASE_PAYLOAD }}/UCHIHA-Owner-1.0-release-unsigned.apk
            ${{ env.UCHIHA_RELEASE_PAYLOAD }}/UCHIHA-Owner-1.0-release-unsigned.sha256
            ${{ env.UCHIHA_RELEASE_PAYLOAD }}/apksigner.jar
          if-no-files-found: error
          retention-days: 2
