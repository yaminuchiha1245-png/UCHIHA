name: Game Zone Native v3 Postdeploy Verify

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-native-v3-postdeploy-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST"; test -n "$VPS_KEY_B64"; PORT="${PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/uchiha_vps
          chmod 600 ~/.ssh/uchiha_vps
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify live activation APK and bot
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"; USER="${USER:-root}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/uchiha_vps -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          target=/opt/uchiha/projects/game-zone
          grep -F 'bot.action("android_link"' "$target/bot/bot.js"
          grep -F '/api/device/activation/issue' "$target/server/server.js"
          grep -F '/api/device/activation/redeem' "$target/server/server.js"

          cd "$target/deploy"
          ln -sfn /etc/uchiha/secrets/game-zone.env .env.production
          sid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q server)"; test -n "$sid"
          test "$(docker inspect -f '{{.State.Status}}' "$sid")" = running
          docker exec "$sid" node -e 'const {createActivationRecord}=require("./lib/appActivation"); const at=Date.now(),r=createActivationRecord({id:"verify",telegramId:"verify",at}); if(new Date(r.expiresAt).getTime()-at!==600000)process.exit(2); console.log("ACTIVATION_TTL_SECONDS=600")'

          code="$(curl -sS -o /tmp/gz-act.json -w '%{http_code}' -H 'content-type: application/json' -d '{"code":"AAAAAA"}' http://127.0.0.1:3100/api/device/activation/redeem)"
          test "$code" = 404
          grep -q 'activation_invalid' /tmp/gz-act.json

          curl -fsSL --max-time 25 --range 0-1023 'https://github.com/yaminuchiha1245-png/UCHIHA/releases/download/game-zone-client-v3.0.0/Game-Zone-Client-v3.0.0.apk' -o /tmp/gz-apk-head
          test -s /tmp/gz-apk-head

          cid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q bot)"; test -n "$cid"
          test "$(docker inspect -f '{{.State.Status}}' "$cid")" = running
          r0="$(docker inspect -f '{{.RestartCount}}' "$cid")"; sleep 8; r1="$(docker inspect -f '{{.RestartCount}}' "$cid")"; test "$r0" = "$r1"
          token_hash="$(docker exec "$cid" sh -lc 'printf %s "$BOT_TOKEN" | sha256sum | cut -d" " -f1')"
          matching=0
          for other in $(docker ps -q --filter label=com.docker.compose.service=bot); do
            h="$(docker exec "$other" sh -lc 'printf %s "$BOT_TOKEN" | sha256sum | cut -d" " -f1' 2>/dev/null || true)"
            [ "$h" = "$token_hash" ] && matching=$((matching+1))
          done
          test "$matching" = 1
          logs="$(docker logs --since 120s "$cid" 2>&1 || true)"; ! printf '%s' "$logs" | grep -qiE '409 Conflict|terminated by other getUpdates request'
          echo 'APK_RELEASE_REACHABLE=YES'
          echo 'MATCHING_POLLERS_RUNNING=1'
          echo 'GAME_ZONE_NATIVE_V3_POSTDEPLOY=PASS'
          REMOTE
