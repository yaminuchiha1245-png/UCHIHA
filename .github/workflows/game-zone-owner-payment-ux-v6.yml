name: Game Zone Owner Payment UX V6

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-owner-payment-ux-v6.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simplify owner payment setup
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ops/apply-owner-payment-ux-v6.py
          node --check admin/admin.js
          grep -Fq 'id:`pay-${Date.now().toString(36)}`' admin/admin.js
          grep -Fq 'أدخل الحساب أو الرقم الذي سيحوّل إليه العميل' admin/admin.js
          grep -Fq '<option value="true" selected>مطلوب</option>' admin/admin.js
          node server/scripts/web-security-audit.js
      - name: Commit owner payment UX
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/admin.js
          git commit -m 'feat(game-zone): simplify owner payment setup' || exit 0
          git push origin HEAD:game-zone/rc20-production
