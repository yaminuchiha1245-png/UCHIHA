name: V1-83 build encrypted MikroTik bootstrap

on:
  push:
    branches: [radius-v183/real-router-diagnosis-20261003]
    paths: [.github/workflows/radius-v183-build-encrypted-mikrotik-bootstrap-20261004.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: UCHIHA VPS NEW
    env:
      VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.UCHIHA_VPS_USER || secrets.VPS_USER }}
      VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
      VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.UCHIHA_VPS_PORT || secrets.VPS_PORT || '22' }}
      DEVICE_ID: dev_b3f6cdc1077c4c588c2b1f7186f57fa2
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Install temporary transfer certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/uchiha-transfer-cert.pem <<'CERT'
-----BEGIN CERTIFICATE-----
MIIENzCCAp+gAwIBAgIUECXqbRPFOq7/S/+mzM2rKoT01A8wDQYJKoZIhvcNAQEL
