name: V1-83 build encrypted MikroTik bootstrap

on:
  push:
    branches: [radius-v183/real-router-diagnosis-20261003]
    paths:
      - .github/workflows/radius-v183-build-encrypted-mikrotik-bootstrap-20261004.yml
      - radius-v183/scripts/build-mikrotik-bootstrap.py
      - radius-v183/ops/bootstrap-transfer-cert.pem

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: UCHIHA VPS NEW
    env:
      VPS_HOST: ${{ secrets.UCHIHA_VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.UCHIHA_VPS_USER || secrets.VPS_USER }}
      VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
      VPS_KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.UCHIHA_VPS_PORT || secrets.VPS_PORT || '22' }}
      DEVICE_ID: dev_b3f6cdc1077c4c588c2b1f7186f57fa2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: radius-v183/real-router-diagnosis-20261003
          fetch-depth: 1

      - name: Validate public generator
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile radius-v183/scripts/build-mikrotik-bootstrap.py
          openssl x509 -in radius-v183/ops/bootstrap-transfer-cert.pem -noout -subject >/dev/null

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload generator and public certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes             radius-v183/scripts/build-mikrotik-bootstrap.py             radius-v183/ops/bootstrap-transfer-cert.pem             "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Generate secret bootstrap on VPS and encrypt it
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST"             "sudo -n env DEVICE_ID='$DEVICE_ID' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          root=/opt/uchiha-radius/secure/wireguard-v183
          peers="$root/peers"
          out="$root/bootstrap"
          material="$peers/$DEVICE_ID-material.json"
          passfile="$peers/$DEVICE_ID.router-password"
          rsc="$out/$DEVICE_ID.rsc"
          mkdir -p "$out"

          test -s "$material"
          test -s "$root/v183-nas.secret"
          test "$(systemctl is-active wg-quick@wg-v183)" = active
          test "$(systemctl is-active freeradius)" = active
          test "$(systemctl is-active uchiha-radius-v183-agent.service)" = active

          if test ! -s "$passfile"; then
            openssl rand -hex 24 > "$passfile"
          fi
          chmod 0600 "$passfile"

          python3 /tmp/build-mikrotik-bootstrap.py "$material" "$passfile" "$rsc"
          chmod 0600 "$rsc"
          test -s "$rsc"
          grep -Fq 'persistent-keepalive=25s' "$rsc"
          grep -Fq 'address=10.83.0.1/32' "$rsc"
          grep -Fq 'policy=read,write,api' "$rsc"
          if grep -Eq '^/radius |^/ppp |^/ip hotspot|^/ip route|^/ip firewall nat' "$rsc"; then
            echo "UNSAFE_BOOTSTRAP_COMMAND"; exit 42
          fi

          openssl cms -encrypt -binary -aes256 -outform DER             -in "$rsc"             -out /tmp/uchiha-mikrotik-bootstrap.cms             /tmp/bootstrap-transfer-cert.pem
          test -s /tmp/uchiha-mikrotik-bootstrap.cms
          echo "BOOTSTRAP_CREATED=PASS"
          echo "BOOTSTRAP_SHA256 $(sha256sum "$rsc" | cut -d' ' -f1)"
          rm -f /tmp/build-mikrotik-bootstrap.py /tmp/bootstrap-transfer-cert.pem
          REMOTE

      - name: Retrieve ciphertext only
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST:/tmp/uchiha-mikrotik-bootstrap.cms"             /tmp/uchiha-mikrotik-bootstrap.cms
          test -s /tmp/uchiha-mikrotik-bootstrap.cms

      - name: Upload encrypted artifact only
        uses: actions/upload-artifact@v4
        with:
          name: uchiha-radius-v183-mikrotik-bootstrap-encrypted
          path: /tmp/uchiha-mikrotik-bootstrap.cms
          retention-days: 1
          if-no-files-found: error
