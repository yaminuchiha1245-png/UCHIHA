name: Game Zone Final Closeout V24

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-final-closeout-v24.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify interactive UI and callback coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          test -n "$CHROME_BIN"
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
          node ops/game-zone-ui-click-smoke.js
          node ops/game-zone-button-audit.js
      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          VPS_KEY_B64: ${{ secrets.UCHIHA_VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.UCHIHA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST"; test -n "$VPS_KEY_B64"; PORT="${PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 --decode > ~/.ssh/uchiha_vps
          chmod 600 ~/.ssh/uchiha_vps
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts
      - name: Verify final live bot and V24 runtime
        shell: bash
        env:
          HOST: ${{ secrets.UCHIHA_VPS_HOST }}
          PORT: ${{ secrets.UCHIHA_VPS_PORT }}
          USER: ${{ secrets.UCHIHA_VPS_USER }}
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"; USER="${USER:-root}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/uchiha_vps -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE' | tee /tmp/game-zone-final-closeout.txt
          set -Eeuo pipefail
          TARGET=/opt/uchiha/projects/game-zone
          ENV=/etc/uchiha/secrets/game-zone.env
          cd "$TARGET"
          grep -Fq 'v21.js?v=240' miniapp/index.html
          grep -Fq 'v21.css?v=240' miniapp/index.html
          grep -Fq 'game-zone-v24-static' miniapp/sw.js
          grep -Fq 'observer.observe(gate,{attributes:true,attributeFilter:["class"]})' miniapp/v21.js
          if grep -Fq 'observer.observe(document.body,{subtree:true' miniapp/v21.js; then exit 21; fi
          grep -Fq 'if(btn.innerHTML!==balanceHtml)btn.innerHTML=balanceHtml' miniapp/v21.js
          echo 'MINIAPP_V24_FREEZE_FIX=PASS'

          cd deploy
          ln -sfn "$ENV" .env.production
          domain="$(awk -F= '$1=="DOMAIN"{print substr($0,index($0,"=")+1); exit}' .env.production)"
          test -n "$domain"
          cid="$(docker compose --env-file .env.production -f docker-compose.yml ps -q bot)"
          test -n "$cid"
          test "$(docker inspect -f '{{.State.Status}}' "$cid")" = running
          r0="$(docker inspect -f '{{.RestartCount}}' "$cid")"
          sleep 10
          r1="$(docker inspect -f '{{.RestartCount}}' "$cid")"
          test "$r0" = "$r1"
          echo "BOT_RESTART_COUNT=$r1"

          docker exec "$cid" grep -Fq 'Game Zone bot v3.3 button-reliability production started' /app/bot/bot.js
          docker exec "$cid" grep -Fq 'BOT UNHANDLED CALLBACK' /app/bot/bot.js
          echo 'BOT_V33_CONTAINER_SOURCE=PASS'
          docker exec "$cid" sh -lc 'case "$ANDROID_APK_URL" in *game-zone-client-v3.1.2/Game-Zone-Client-v3.1.2.apk) exit 0;; *) exit 1;; esac'
          echo 'BOT_ANDROID_APK_V312=PASS'

          token_hash="$(docker exec "$cid" sh -lc 'printf %s "$BOT_TOKEN" | sha256sum | cut -d" " -f1')"
          matching=0
          for other in $(docker ps -q --filter label=com.docker.compose.service=bot); do
            h="$(docker exec "$other" sh -lc 'printf %s "$BOT_TOKEN" | sha256sum | cut -d" " -f1' 2>/dev/null || true)"
            [ "$h" = "$token_hash" ] && matching=$((matching+1))
          done
          test "$matching" = 1
          echo 'MATCHING_POLLERS=1'

          tg=0
          for i in $(seq 1 6); do
            if docker exec "$cid" node -e 'fetch("https://api.telegram.org/bot"+process.env.BOT_TOKEN+"/getMe").then(r=>r.json()).then(x=>{if(!x.ok||x.result?.username!=="gamezone1store_bot")process.exit(2)}).catch(()=>process.exit(3))'; then tg=1; break; fi
            sleep 3
          done
          test "$tg" = 1
          echo 'TELEGRAM_GETME=PASS'

          wh_ok=0; wh='__failed__'
          for i in $(seq 1 6); do
            if value="$(docker exec "$cid" node -e 'fetch("https://api.telegram.org/bot"+process.env.BOT_TOKEN+"/getWebhookInfo").then(r=>r.json()).then(x=>{if(!x.ok)process.exit(2);process.stdout.write(String(x.result?.url||""))}).catch(()=>process.exit(3))' 2>/dev/null)"; then wh="$value"; wh_ok=1; break; fi
            sleep 3
          done
          test "$wh_ok" = 1
          test -z "$wh"
          echo 'WEBHOOK_EMPTY=YES'

          logs="$(docker logs --since 15m "$cid" 2>&1 || true)"
          if grep -qiE '409 Conflict|terminated by other getUpdates request' <<<"$logs"; then exit 31; fi
          if grep -qi 'BOT ERROR' <<<"$logs"; then exit 32; fi
          echo 'BOT_409_CONFLICT=NONE'
          echo 'BOT_ERROR_RECENT=NONE'

          root="$(curl -fsS --retry 3 --retry-delay 1 --max-time 15 "https://$domain/")"
          grep -Fq 'app.js?v=240' <<<"$root"
          grep -Fq 'v21.js?v=240' <<<"$root"
          curl -fsS --retry 3 --retry-delay 1 --max-time 15 "https://$domain/api/health/ready" >/dev/null
          echo 'LIVE_V24_ASSETS=PASS'
          echo "DEPLOYED_SHA=$(cat "$TARGET/.deployed-commit")"
          echo 'GAME_ZONE_FINAL_CLOSEOUT=PASS'
          REMOTE
      - name: Record closeout status
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ops
          cp /tmp/game-zone-final-closeout.txt ops/game-zone-final-closeout-status.txt
          {
            echo 'UI_CLICK_SMOKE=PASS'
            echo 'BUTTON_AUDIT=PASS'
            echo "verified_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> ops/game-zone-final-closeout-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/game-zone-final-closeout-status.txt
          git commit -m 'ops(game-zone): record final V24 closeout' || exit 0
          git push origin HEAD:game-zone/rc20-production
