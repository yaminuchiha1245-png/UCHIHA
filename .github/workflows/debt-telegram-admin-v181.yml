name: Validate Debt Telegram Admin v1.2 Renewal and Recovery
on:
  push:
    branches: [debt/telegram-admin-bot-v181-stability]
    paths:
      - "build/debt180/**"
      - "build/debt181/**"
      - ".github/workflows/debt-telegram-admin-v181.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python sources
        run: |
          python3 -m py_compile build/debt180/bot/bot.py build/debt180/bot/setup.py
      - name: Test admin authorization, financial operations, renewal and crash recovery
        run: |
          python3 -m unittest discover -s build/debt180/tests -p 'test_*.py' -v
      - name: Assert additive and private database migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("build/debt181/sql/002_admin_renewals.sql").read_text().lower()
          for expected in (
              "create table if not exists debt_service.telegram_admin_requests",
              "alter table debt_service.telegram_admin_requests enable row level security",
              "create or replace function public.debt_telegram_admin_license_action",
              "revoke all on function public.debt_telegram_admin_license_action",
              "to anon,authenticated,service_role",
              "pg_advisory_xact_lock",
              "return previous.result||jsonb_build_object('replayed',true)",
              "bot_license_renewed", "bot_device_limit_updated"
          ):
              assert expected in s,expected
          for forbidden in ("drop table","truncate table","delete from debt_service.licenses","update debt_service.digital_wallets"):
              assert forbidden not in s,forbidden
          print("PASS: additive, audit logged and idempotent subscription operations")
          PY
      - name: Create portable release archive without secrets
        run: |
          set -euo pipefail
          ! test -e build/debt180/bot/.env
          ! test -e build/debt180/bot/bot.sqlite3
          find build/debt180 -type d -name __pycache__ -exec rm -rf {} +
          zip -q -r UCHIHA-Debt-Telegram-Admin-v1.2.zip \
            build/debt180/bot \
            build/debt180/tests \
            build/debt180/README.md \
            build/debt181/README.md \
            build/debt181/sql \
            -x '*.pyc' '*__pycache__*'
          unzip -t UCHIHA-Debt-Telegram-Admin-v1.2.zip | tail -1
          sha256sum UCHIHA-Debt-Telegram-Admin-v1.2.zip \
            > UCHIHA-Debt-Telegram-Admin-v1.2.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: UCHIHA-Debt-Telegram-Admin-v1.2
          path: |
            UCHIHA-Debt-Telegram-Admin-v1.2.zip
            UCHIHA-Debt-Telegram-Admin-v1.2.zip.sha256
          retention-days: 90
          if-no-files-found: error
