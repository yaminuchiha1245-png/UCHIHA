name: Game Zone v2.1 Source Upgrade

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-v21-source-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
          fetch-depth: 1

      - name: Apply production UX and bot patches
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          index=Path('miniapp/index.html')
          text=index.read_text()
          text=text.replace('<link rel="stylesheet" href="./styles.css" />','<link rel="stylesheet" href="./styles.css" />\n  <link rel="stylesheet" href="./v21.css?v=210" />')
          text=text.replace('<script src="./app.js"></script>','<script src="./app.js"></script>\n<script src="./v21.js?v=210"></script>')
          text=text.replace('/assets/game-zone-logo.jpg','./icon-192.png')
          index.write_text(text)

          sw=Path('miniapp/sw.js')
          text=sw.read_text()
          text=text.replace('const CACHE="game-zone-v1-rc13-static";','const CACHE="game-zone-v21-static";')
          text=text.replace('"/","/styles.css","/app.js","/manifest.webmanifest",','"/","/styles.css","/v21.css","/app.js","/v21.js","/manifest.webmanifest",')
          text=text.replace(',"/icon-192.png","/icon-512.png","/assets/game-zone-logo.jpg"',',"/icon-192.png","/icon-512.png"')
          sw.write_text(text)

          bot=Path('bot/bot.js')
          text=bot.read_text()
          text=text.replace('path.join(__dirname,"../assets/game-zone-logo.jpg")','path.join(__dirname,"../miniapp/icon-512.png")')
          old='await ctx.reply(" تم ربط تطبيق Game Zone بحسابك بنجاح. يمكنك الرجوع إلى التطبيق الآن.");'
          new='await ctx.reply(`🔐 <b>كود ربط Game Zone</b>\\n\\n<code>${escapeHtml(code)}</code>\\n\\nانسخ هذا الكود وارجع إلى التطبيق ثم اكتبه في خانة الربط. الكود مؤقت ولا تشاركه مع أي شخص.`,{parse_mode:"HTML",...Markup.inlineKeyboard([[Markup.button.webApp("العودة إلى Game Zone",MINI_APP_URL)]])});'
          if old not in text:
              raise SystemExit('pair reply anchor not found')
          text=text.replace(old,new,1)

          old_block='''bot.action("adm_tickets",async ctx=>{\n  if(!isAdmin(ctx))return;\n  await ctx.answerCbQuery();\n  try{\n    const ts=(await api("/api/admin/support-tickets",{},true)).filter(t=>t.status==="open").slice(0,8);\n    const text=ts.map(t=>`• <code>${t.id}</code>\\n  ${escapeHtml(t.subject)} — <code>${t.telegramId}</code>`).join("\\n\\n");\n    ctx.reply(` <b>تذاكر الدعم المفتوحة</b>\\n\\n${text||"لا توجد تذاكر"}`,{parse_mode:"HTML",...adminMenu()});\n  }catch{ctx.reply("تعذر تحميل التذاكر.")}\n});'''
          new_block='''bot.action("adm_tickets",async ctx=>{\n  if(!isAdmin(ctx))return;\n  await ctx.answerCbQuery();\n  try{\n    const ts=(await api("/api/admin/support-tickets",{},true)).filter(t=>["open","pending"].includes(t.status)).slice(0,8);\n    if(!ts.length)return ctx.reply("لا توجد تذاكر مفتوحة.",adminMenu());\n    for(const t of ts){\n      const isKyc=String(t.subject||"").startsWith("[KYC]");\n      const rows=isKyc?[[Markup.button.callback("✅ اعتماد KYC",`adm_kyc_approve:${t.id}`),Markup.button.callback("❌ رفض KYC",`adm_kyc_reject:${t.id}`)]]:[];\n      rows.push([Markup.button.callback("رجوع للإدارة","adm_stats")]);\n      await ctx.reply(`${isKyc?"🪪 <b>طلب KYC</b>":"🎫 <b>تذكرة دعم</b>"}\\n\\nID: <code>${escapeHtml(t.id)}</code>\\nالمستخدم: <code>${escapeHtml(t.telegramId)}</code>\\nالعنوان: ${escapeHtml(t.subject||"")}\\n\\n${escapeHtml(t.message||"")}`,{parse_mode:"HTML",...Markup.inlineKeyboard(rows)});\n    }\n  }catch{ctx.reply("تعذر تحميل التذاكر.")}\n});\n\nbot.action(/^adm_kyc_(approve|reject):(.+)$/,async ctx=>{\n  if(!isAdmin(ctx))return;\n  const action=ctx.match[1],ticketId=ctx.match[2];\n  await ctx.answerCbQuery();\n  try{\n    const reply=action==="approve"?"KYC_VERIFIED — تم توثيق الحساب بعد المراجعة اليدوية.":"KYC_REJECTED — تعذر اعتماد التحقق. راجع البيانات أو تواصل مع الدعم.";\n    await api(`/api/admin/support-tickets/${encodeURIComponent(ticketId)}`,{method:"PATCH",body:JSON.stringify({status:"closed",reply})},true);\n    await ctx.editMessageReplyMarkup({inline_keyboard:[]}).catch(()=>{});\n    await ctx.reply(action==="approve"?"✅ تم اعتماد KYC.":"❌ تم رفض طلب KYC.");\n  }catch(e){ctx.reply("تعذر تحديث KYC: "+e.message)}\n});'''
          if old_block not in text:
              raise SystemExit('admin ticket anchor not found')
          text=text.replace(old_block,new_block,1)
          text=text.replace('Game Zone bot v1.0 RC20 started','Game Zone bot v2.1 production started')
          bot.write_text(text)
          PY

          node --check miniapp/v21.js
          node --check miniapp/app.js
          node --check bot/bot.js
          test -s miniapp/v21.css
          grep -F 'v21.js?v=210' miniapp/index.html >/dev/null
          grep -F 'كود ربط Game Zone' bot/bot.js >/dev/null
          grep -F 'adm_kyc_approve' bot/bot.js >/dev/null

      - name: Commit upgraded source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/game-zone-v21-source-upgrade.yml
          git add -A
          git commit -m "feat(game-zone): production account linking wallet balance and KYC"
          git push origin HEAD:game-zone/rc20-production
