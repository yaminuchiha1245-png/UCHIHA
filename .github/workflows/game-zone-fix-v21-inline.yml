name: Game Zone Fix v2.1 CSP Source

on:
  push:
    branches: [game-zone/rc20-production]
    paths:
      - .github/workflows/game-zone-fix-v21-inline.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game-zone/rc20-production
          fetch-depth: 1

      - name: Remove inline fallback and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('miniapp/v21.js')
          s=p.read_text()
          old=' onerror="this.src=\'./icon-192.png\'"'
          if old not in s:
              raise SystemExit('inline image fallback not found')
          p.write_text(s.replace(old,'',1))
          PY
          node --check miniapp/v21.js
          node server/scripts/web-security-audit.js
          ! grep -F 'onerror="this.src=' miniapp/v21.js

      - name: Commit source fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp/v21.js
          git commit -m "fix(game-zone): keep v2.1 pairing screen CSP-safe"
          git push origin HEAD:game-zone/rc20-production
