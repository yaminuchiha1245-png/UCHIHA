name: UCHIHA Project Task
description: مهمة تطوير أو إصلاح مرتبطة بأحد مشاريع UCHIHA
title: "[Project] "
body:
  - type: dropdown
    id: project
    attributes:
      label: المشروع
      description: اختر مصدر الحقيقة الذي تنتمي له المهمة.
      options:
        - UCHIHA Store (main)
        - UCHIHA Builder (builder/v1-platform)
        - UCHIHA Debt Store (debt-store-build)
        - Repository / Infrastructure
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: الأولوية
      options:
        - P1 - حرجة / إنتاج
        - P2 - عالية
        - P3 - متوسطة
        - P4 - منخفضة
        - P5 - تنظيف / صيانة
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: الهدف
      description: اكتب النتيجة المطلوبة بشكل واضح، وليس فقط اسم الملف المراد تعديله.
      placeholder: ما الذي يجب أن يعمل عند إغلاق هذه المهمة؟
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: النطاق
      description: الملفات أو الأنظمة التي تتوقع أن تتأثر.
      placeholder: مثال: الدفع، المحفظة، storefront، builder worker...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: شروط الإغلاق
      description: ضع قائمة تحقق قابلة للاختبار.
      placeholder: |
        - [ ] الاختبارات ناجحة
        - [ ] لا يوجد تكرار للعمليات
        - [ ] تم التحقق على Staging/الجهاز عند الحاجة
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: المخاطر أو الملاحظات
      description: اذكر أي تأثير محتمل على الإنتاج أو البيانات أو الدفع أو الأسرار.

  - type: checkboxes
    id: safety
    attributes:
      label: تأكيدات
      options:
        - label: لن أضع أسرارًا أو مفاتيح API أو كلمات مرور داخل Issue أو Commit.
          required: true
        - label: حددت فرع مصدر الحقيقة للمشروع قبل بدء العمل.
          required: true
