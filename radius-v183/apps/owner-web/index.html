<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102d47">
  <meta name="description" content="تطبيق مالك منصة UCHIHA RADIUS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="public/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="public/icons/icon-192.png">
  <link rel="stylesheet" href="src/styles.css">
  <title>UCHIHA RADIUS · المالك</title>
</head>
<body class="owner-body">
  <section id="login-view" class="login-view">
    <div class="login-card owner-login">
      <div class="brand-lockup brand-large"><span class="brand-mark">U</span><span><b>UCHIHA</b><small>OWNER CONTROL</small></span></div>
      <div class="owner-emblem" aria-hidden="true"><svg viewBox="0 0 120 120"><path d="M60 13 22 29v27c0 25 15 43 38 54 23-11 38-29 38-54V29z"/><path d="M42 61 55 74 80 45"/></svg></div>
      <p class="eyebrow">تطبيق منفصل لمالك المنصة</p>
      <h1>قرارات المنصة كلها في مساحة محمية</h1>
      <p class="login-copy">إدارة الشبكات والاشتراكات والمهام وسجل التدقيق دون خلطها بتطبيق المزود.</p>
      <div id="google-login" class="google-slot"></div>
      <button id="dev-login" class="button button-primary button-wide" hidden>الدخول إلى بيئة المالك</button>
      <p id="login-status" class="form-note" role="status"></p>
    </div>
  </section>

  <div id="app-shell" class="app-shell" hidden>
    <header class="topbar owner-topbar"><div class="topbar-inner"><div class="brand-lockup"><span class="brand-mark">U</span><span><b>UCHIHA</b><small>OWNER CONTROL</small></span></div><div class="owner-top-actions"><span class="status-pill status-active">وصول المالك</span><button class="icon-button" data-action="refresh" aria-label="تحديث"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M18.5 9A7 7 0 0 0 6.8 6.8L4 9m16 6-2.8 2.2A7 7 0 0 1 5.5 15"/></svg></button></div></div></header>
    <main id="main-content" class="main-content owner-content" tabindex="-1"></main>
    <nav class="bottom-nav owner-nav" aria-label="التنقل الرئيسي">
      <button class="nav-button active" data-view="dashboard"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg><span>الرئيسية</span></button>
      <button class="nav-button" data-view="tenants"><svg viewBox="0 0 24 24"><path d="M4 20V8l8-4 8 4v12M8 11h2M14 11h2M8 15h2M14 15h2M10 20v-2h4v2"/></svg><span>الشبكات</span></button>
      <button class="nav-button" data-view="subscriptions"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>الاشتراكات</span></button>
      <button class="nav-button" data-view="jobs"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 9h6M9 13h6M9 17h4"/></svg><span>المهام</span></button>
      <button class="nav-button" data-view="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><span>المزيد</span></button>
    </nav>
  </div>

  <dialog id="dialog" class="dialog"><form id="dialog-form"><header><div><small id="dialog-kicker"></small><h2 id="dialog-title"></h2></div><button class="icon-button" type="button" data-action="close-dialog" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><div id="dialog-body" class="dialog-body"></div><footer id="dialog-actions"></footer></form></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
