<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="تطبيق مزود الإنترنت UCHIHA RADIUS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="public/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="public/icons/icon-192.png">
  <link rel="stylesheet" href="src/styles.css">
  <title>UCHIHA RADIUS · المزود</title>
</head>
<body>
  <section id="login-view" class="login-view" aria-labelledby="login-title">
    <div class="login-card">
      <div class="brand-lockup brand-large" aria-label="UCHIHA RADIUS">
        <span class="brand-mark" aria-hidden="true">U</span>
        <span><b>UCHIHA</b><small>RADIUS</small></span>
      </div>
      <div class="login-art" aria-hidden="true">
        <svg viewBox="0 0 240 160" role="img"><path d="M32 118h176"/><rect x="62" y="42" width="116" height="78" rx="20"/><path d="M82 64h76M82 82h50M82 100h64"/><circle cx="160" cy="99" r="7"/><path d="M120 42V25m-19 9 19-9 19 9"/></svg>
      </div>
      <p class="eyebrow">مساحة عمل مزود الإنترنت</p>
      <h1 id="login-title">شبكتك واضحة، وكل قرار موثّق</h1>
      <p class="login-copy">سجّل الدخول لمتابعة المشتركين والجلسات والتحصيل والتنبيهات من مكان واحد.</p>
      <div id="google-login" class="google-slot"></div>
      <div id="demo-login" class="demo-login" hidden>
        <div class="demo-login-head">
          <span>معاينة فقط</span>
          <b>حساب تجريبي جاهز</b>
        </div>
        <div class="demo-credentials" aria-label="بيانات الحساب التجريبي">
          <label><span>البريد</span><input value="demo@uchiha.app" readonly tabindex="-1" dir="ltr"></label>
          <label><span>كلمة المرور</span><input value="123456" type="text" readonly tabindex="-1" dir="ltr"></label>
        </div>
        <button id="dev-login" class="button button-primary button-wide" type="button">الدخول للحساب التجريبي</button>
      </div>
      <p id="login-status" class="form-note" role="status"></p>
      <small class="secure-note">تُحدّد الصلاحيات والاشتراك من الخادم، ولا تُحفظ كلمة مرور داخل التطبيق.</small>
    </div>
  </section>

  <div id="app-shell" class="app-shell" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <button class="icon-button" type="button" data-action="drawer" aria-label="فتح القائمة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">U</span>
          <span><b>UCHIHA</b><small>RADIUS</small></span>
        </div>
        <button class="icon-button" type="button" data-action="refresh" aria-label="تحديث البيانات">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M18.5 9A7 7 0 0 0 6.8 6.8L4 9m16 6-2.8 2.2A7 7 0 0 1 5.5 15"/></svg>
        </button>
      </div>
    </header>

    <button id="subscription-strip" class="subscription-strip" type="button" data-view="subscriptions">
      <span class="subscription-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 7.5h16v11H4zM7 5h10M8 11h8M8 15h5"/></svg>
      </span>
      <span class="subscription-copy"><small>الاشتراك</small><b id="subscription-label">جارٍ التحقق…</b></span>
      <span id="subscription-state" class="status-pill status-neutral">—</span>
      <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>

    <main id="main-content" class="main-content" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button class="nav-button active" type="button" data-view="dashboard" aria-current="page">
        <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg><span>الرئيسية</span>
      </button>
      <button class="nav-button" type="button" data-view="subscribers">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19v-1.5A4.5 4.5 0 0 1 8 13h2a4.5 4.5 0 0 1 4.5 4.5V19M16 6.5a3 3 0 0 1 0 5.8M17 14a4 4 0 0 1 3.5 4v1"/></svg><span>المشتركون</span>
      </button>
      <button class="nav-button" type="button" data-view="sessions">
        <svg viewBox="0 0 24 24"><path d="M5 8.5a9 9 0 0 1 14 0M8 12a5.5 5.5 0 0 1 8 0M11 15.5a1.5 1.5 0 1 1 2 0M12 17v3"/></svg><span>الجلسات</span>
      </button>
      <button class="nav-button" type="button" data-view="billing">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>التحصيل</span>
      </button>
      <button class="nav-button" type="button" data-view="more">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><span>المزيد</span>
      </button>
    </nav>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden data-action="close-drawer"></div>
  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="القائمة الجانبية">
    <div class="drawer-head">
      <div class="brand-lockup"><span class="brand-mark">U</span><span><b>UCHIHA</b><small>RADIUS</small></span></div>
      <button class="icon-button" type="button" data-action="close-drawer" aria-label="إغلاق القائمة"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="profile-card">
      <span id="profile-initial" class="avatar">م</span>
      <span><b id="profile-name">مدير الشبكة</b><small id="profile-role">—</small></span>
    </div>
    <div class="drawer-links">
      <button type="button" data-view="plans"><span>الباقات</span><small>السرعات والأسعار</small></button>
      <button type="button" data-view="devices"><span>الأجهزة والربط</span><small>MikroTik وRADIUS</small></button>
      <button type="button" data-view="telegram"><span>بوت Telegram</span><small>كل التنبيهات من مدخل واحد</small></button>
      <button type="button" data-view="team"><span>الفريق والصلاحيات</span><small>الأدوار والوصول</small></button>
      <button type="button" data-view="audit"><span>سجل النشاط</span><small>من فعل ماذا ومتى</small></button>
    </div>
    <div class="drawer-footer">
      <button type="button" data-action="theme">تبديل المظهر</button>
      <button type="button" data-action="logout" class="danger-text">تسجيل الخروج</button>
    </div>
  </aside>

  <dialog id="dialog" class="dialog">
    <form id="dialog-form" method="dialog">
      <header><div><small id="dialog-kicker"></small><h2 id="dialog-title"></h2></div><button class="icon-button" type="button" data-action="close-dialog" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
      <div id="dialog-body" class="dialog-body"></div>
      <footer id="dialog-actions"></footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
