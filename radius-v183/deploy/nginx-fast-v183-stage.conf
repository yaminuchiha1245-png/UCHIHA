# Include inside radius.uchiha-builder.com's HTTPS server only.
# For the speed-first visual rollout, serve the correct V1-83 entry at
# this subdomain's exact root. Other paths and domains are unchanged.
location = / {
    return 302 /v183/;
    gzip_static on;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
}
# The v101 Telegram and unrelated sites remain unchanged until v183 API/auth are ready.
location ^~ /v183/assets/ {
    alias /opt/uchiha-radius/v183-stage/assets/;
    gzip_static on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    access_log off;
}
location ^~ /v183/ {
    alias /opt/uchiha-radius/v183-stage/;
    try_files $uri $uri/ /v183/index.html;
    gzip_static on;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
}
