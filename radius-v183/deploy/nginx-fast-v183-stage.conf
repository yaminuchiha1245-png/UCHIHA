# Include inside radius.uchiha-builder.com's HTTPS server only.
# For the speed-first visual rollout, serve the correct V1-83 entry at
# this subdomain's exact root. Other paths and domains are unchanged.
location = / {
    return 302 /v183/;
    gzip_static on;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
}
# After verified promotion, replace this zone's old /telegram and /telegram/ locations
# with return 302 /v183/ so cached Telegram menu links never show the V101 UI.
# This has been applied on the active VPS. Keep unrelated domains and legacy APIs untouched.

# Isolated V1-83 backend (no cross-wiring to v101's provider database).
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:8794;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    client_max_body_size 256k;
    add_header Cache-Control "no-store" always;
}
location ^~ /v183/assets/ {
    alias /opt/uchiha-radius/v183-stage/assets/;
    gzip_static on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    access_log off;
}
location ^~ /v183/ {
    alias /opt/uchiha-radius/v183-stage/;
    try_files $uri $uri/ /v183/index.html;
    gzip_static on;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
}
