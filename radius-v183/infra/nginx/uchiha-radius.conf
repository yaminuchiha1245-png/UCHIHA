server_tokens off;
limit_req_zone $binary_remote_addr zone=uchiha_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=uchiha_webhook:10m rate=30r/s;

upstream uchiha_radius_api {
  server 127.0.0.1:8787;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name radius.uchiha-builder.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name radius.uchiha-builder.com;

  ssl_certificate /etc/letsencrypt/live/radius.uchiha-builder.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/radius.uchiha-builder.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  client_max_body_size 1m;
  client_body_timeout 10s;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /api/v1/auth/google {
    limit_req zone=uchiha_login burst=5 nodelay;
    proxy_pass http://uchiha_radius_api;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location ~ ^/(webhooks|connectors)/ {
    limit_req zone=uchiha_webhook burst=100 nodelay;
    proxy_pass http://uchiha_radius_api;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location = /metrics {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://uchiha_radius_api;
    include proxy_params;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location / {
    proxy_pass http://uchiha_radius_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }
}
