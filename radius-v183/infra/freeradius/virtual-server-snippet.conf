# أضف أسماء الوحدات التالية إلى الأقسام المطابقة في virtual server الفعلي.
# لا تستبدل إعداد default كاملًا بهذا الملف.

authorize {
  uchiha_rest
  chap
  mschap
  pap
}

authenticate {
  Auth-Type PAP {
    pap
  }
  Auth-Type CHAP {
    chap
  }
  Auth-Type MS-CHAP {
    mschap
  }
  # مسار PAP المباشر الاحتياطي؛ يمكن حذفه إن كانت كل الطلبات تمر عبر authorize أعلاه.
  Auth-Type uchiha_rest {
    uchiha_rest
  }
}

accounting {
  uchiha_rest
}

post-auth {
  uchiha_rest
  Post-Auth-Type REJECT {
    uchiha_rest
  }
}
