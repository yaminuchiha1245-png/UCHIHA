# UCHIHA RADIUS-A v101 / Backend v37
# Requires RADIUS-A-Connector-Backend-v37-nginx-limits.example.conf in nginx http{}.
# Replace radius.example.com and certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name radius.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radius.example.com;

    ssl_certificate     /etc/letsencrypt/live/radius.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radius.example.com/privkey.pem;

    client_max_body_size 256k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;

    limit_conn uchiha_radius_conn 64;
    limit_req zone=uchiha_radius_req burst=200 nodelay;
    limit_req_status 429;
    limit_conn_status 503;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Browser operators authenticate to Backend v37 using HttpOnly/Secure SameSite=Strict sessions.
# Automation uses signed Gateway HMAC directly to the same backend through this HTTPS boundary.
# Keep the backend bound to 127.0.0.1 and never trust 0.0.0.0/0 as a proxy CIDR.
