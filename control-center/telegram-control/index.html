<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>UCHIHA Analytics</title>
<style>
:root{--bg:#05080d;--panel:#0b121a;--panel2:#101a24;--line:#1d2b38;--text:#f5f7fb;--muted:#8192a4;--red:#ff3157;--green:#22d892;--amber:#ffbd45;--blue:#55a8ff;--violet:#a874ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Kufi Arabic",sans-serif;min-height:100%}body{padding:0 0 28px}
.hero{position:relative;overflow:hidden;padding:18px 16px 16px;background:linear-gradient(180deg,#0b1119 0%,#070c12 100%);border-bottom:1px solid var(--line)}
.hero:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-80px;top:-120px;background:radial-gradient(circle,#8e17304d 0,#8e173015 48%,transparent 70%);pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}.brand{display:flex;align-items:center;gap:11px}.mark{width:45px;height:45px;border-radius:15px;background:linear-gradient(145deg,#ff3157,#6a1021);display:grid;place-items:center;font-size:21px;font-weight:950;box-shadow:inset 0 0 0 1px #ff6d8844}.brand h1{margin:0;font-size:17px;letter-spacing:.4px}.brand small,.muted{color:var(--muted)}.live{font-size:12px;padding:7px 10px;border:1px solid #1e503f;background:#08231a;color:#72edb7;border-radius:999px;white-space:nowrap}
.heroStats{display:grid;grid-template-columns:1.25fr .75fr;gap:10px;margin-top:16px}.heroCard{background:linear-gradient(145deg,#111c27,#091019);border:1px solid var(--line);border-radius:19px;padding:15px;min-width:0}.score{font-size:40px;font-weight:950;line-height:1}.score small{font-size:14px;color:var(--muted)}.statusLine{display:flex;align-items:center;gap:8px;margin-top:9px;color:#b7c4d1;font-size:13px}.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px #22d89213}.miniRing{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--red) var(--p),#1a2530 0);position:relative;margin:auto}.miniRing:after{content:"";position:absolute;inset:8px;background:#0b131d;border-radius:50%}.miniRing b{position:relative;z-index:1;font-size:14px}
.tabs{position:sticky;top:0;z-index:10;display:flex;gap:7px;overflow:auto;padding:10px 12px;background:#05080ded;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{border:1px solid var(--line);background:#0b1219;color:#9aacbd;border-radius:11px;padding:9px 12px;font-weight:800;white-space:nowrap}.tabs button.active{background:#281019;border-color:#7d2438;color:#fff}
.wrap{padding:12px}.section{display:none}.section.active{display:block}.title{display:flex;justify-content:space-between;align-items:end;margin:8px 2px 10px}.title h2{margin:0;font-size:17px}.title span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{background:linear-gradient(145deg,#0d1720,#091018);border:1px solid var(--line);border-radius:16px;padding:13px;min-width:0}.card.wide{grid-column:1/-1}.k{font-size:12px;color:var(--muted);margin-bottom:7px}.v{font-size:22px;font-weight:900;overflow-wrap:anywhere}.sub{font-size:12px;color:#9aacbd;margin-top:6px;line-height:1.5}.bar{height:7px;border-radius:99px;background:#18232e;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3157,#ff6a81);border-radius:inherit;transition:width .5s ease}
.spark{width:100%;height:100px;display:block}.spark polyline{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.spark .fill{fill:url(#g);stroke:none}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#9aacbd}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px}.g{background:var(--green)}.r{background:var(--red)}.a{background:var(--amber)}.b{background:var(--blue)}
.list{display:grid;gap:8px}.row{background:#0a121a;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}.rowTop{display:flex;align-items:center;gap:9px}.rowTop strong{flex:1;min-width:0}.pill{font-size:11px;padding:5px 8px;border-radius:999px;border:1px solid #2b3b49;color:#aebdcc;white-space:nowrap}.meta{margin-top:7px;font-size:12px;color:var(--muted);line-height:1.65;overflow-wrap:anywhere}.projectFilters{display:flex;gap:7px;overflow:auto;padding-bottom:8px;scrollbar-width:none}.projectFilters button{border:1px solid var(--line);background:#0b131c;color:#9badbe;border-radius:10px;padding:8px 10px;white-space:nowrap}.projectFilters button.active{color:#fff;border-color:#813046;background:#251019}.project{cursor:pointer}.project.open{border-color:#6e2638}.projectDetails{display:none;margin-top:9px;padding-top:9px;border-top:1px solid #1c2a36}.project.open .projectDetails{display:block}.money{font-variant-numeric:tabular-nums}.alert{border-color:#5a2431;background:linear-gradient(145deg,#1b1016,#0d1117)}.okBox{border-color:#174a39;background:#081b15;color:#8eeec3}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed #263644;border-radius:14px}.code{direction:ltr;unicode-bidi:plaintext;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.foot{padding:15px;text-align:center;color:#647587;font-size:11px}
@media(min-width:700px){.wrap{max-width:980px;margin:auto}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card.wide{grid-column:span 2}.heroStats{max-width:980px;margin:16px auto 0}.top{max-width:980px;margin:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="top">
    <div class="brand"><div class="mark">う</div><div><h1>UCHIHA Analytics</h1><small>مراقبة متقدمة · بدون أوامر تشغيل</small></div></div>
    <div class="live" id="live">● مباشر</div>
  </div>
  <div class="heroStats">
    <div class="heroCard"><div class="k">Health Score</div><div class="score" id="healthScore">—<small>/100</small></div><div class="statusLine"><span class="pulse"></span><span id="healthText">جاري القراءة…</span></div></div>
    <div class="heroCard"><div class="miniRing" id="ramRing" style="--p:0%"><b id="ramRingText">RAM</b></div><div class="sub" style="text-align:center">استخدام الذاكرة</div></div>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="overview" class="active">نظرة عامة</button>
  <button data-tab="infra">البنية</button>
  <button data-tab="projects">المشاريع</button>
  <button data-tab="finance">المالية</button>
  <button data-tab="activity">النشاط</button>
</nav>
<main class="wrap">
  <section id="overview" class="section active"></section>
  <section id="infra" class="section"></section>
  <section id="projects" class="section"></section>
  <section id="finance" class="section"></section>
  <section id="activity" class="section"></section>
</main>
<div class="foot">الإدارة والتشغيل والتعديل تتم من أزرار البوت فقط · هذه الواجهة للقراءة والإحصائيات</div>
<script>
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch(e){}
const initData=tg?.initData||"";let DATA=null;const $=id=>document.getElementById(id);
const esc=v=>String(v??"—").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(path){const r=await fetch("/api/telegram-control"+path,{headers:{"X-Telegram-Init-Data":initData},cache:"no-store"});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"request_failed");return j}
function pct(v){v=Number(v);return Number.isFinite(v)?Math.max(0,Math.min(100,v)):0}
function li(status){return status==="online"?"🟢":status==="partial"?"🟡":status==="offline"?"🔴":"⚪️"}
function num(v,d=0){const n=Number(v);return Number.isFinite(n)?n.toFixed(d):"—"}
function healthScore(){const s=DATA?.infra?.server||{};let x=100;x-=Math.max(0,pct(s.memoryPercent)-75)*.5;x-=Math.max(0,pct(s.diskPercent)-75)*.6;x-=Number(s.containersUnhealthy||0)*18;if(String(s.health).toLowerCase()!=="healthy")x-=15;return Math.max(0,Math.round(x))}
function sparkPoints(values,w=320,h=90){if(!values.length)return "";const min=Math.min(...values),max=Math.max(...values),r=max-min||1;return values.map((v,i)=>((i/(values.length-1||1))*w).toFixed(1)+","+(h-((v-min)/r)*(h-12)-6).toFixed(1)).join(" ")}
function renderHero(){const s=DATA.infra?.server||{},score=healthScore();$("healthScore").innerHTML=score+'<small>/100</small>';$("healthText").textContent=(s.health==="healthy"?"كل الأنظمة الأساسية مستقرة":"توجد حالة تحتاج مراجعة")+" · "+new Date(DATA.infra?.generatedAt||Date.now()).toLocaleTimeString("ar");$("ramRing").style.setProperty("--p",pct(s.memoryPercent)+"%");$("ramRingText").textContent=num(s.memoryPercent)+"%"}
function renderOverview(){const s=DATA.infra?.server||{},d=DATA.databaseStats||{},ps=DATA.managedProjects||[],alerts=DATA.alerts||[],daily=DATA.infra?.history?.daily||[],vals=daily.map(x=>Number(x.healthPercent||0));const online=ps.filter(x=>x.liveStatus==="online").length;const due=(DATA.billingAlerts||[]).length;$("overview").innerHTML=`
<div class="title"><h2>النبض الآن</h2><span>Live telemetry</span></div>
<div class="grid">
<div class="card"><div class="k">المشاريع Online</div><div class="v">${online}/${ps.length}</div><div class="bar"><i style="width:${ps.length?online/ps.length*100:0}%"></i></div></div>
<div class="card"><div class="k">الحاويات السليمة</div><div class="v">${esc(s.containersHealthy)}</div><div class="sub">من ${esc(s.containersRunning)} تعمل الآن</div></div>
<div class="card"><div class="k">PostgreSQL</div><div class="v">${d.connected?"ONLINE":"OFF"}</div><div class="sub">${esc(d.size)} · ${esc(d.publicTables)} جدول</div></div>
<div class="card"><div class="k">مستحقات</div><div class="v">${due}</div><div class="sub">مشاريع تحتاج متابعة مالية</div></div>
<div class="card wide"><div class="k">Health Trend</div><svg class="spark" viewBox="0 0 320 100" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff3157" stop-opacity=".28"/><stop offset="1" stop-color="#ff3157" stop-opacity="0"/></linearGradient></defs><polyline points="${sparkPoints(vals)}"/></svg><div class="legend"><span><i class="dot g"></i>صحي</span><span><i class="dot r"></i>تنبيه</span><span>${vals.length} يوم مسجل</span></div></div>
<div class="card wide ${alerts.length?"alert":"okBox"}"><div class="k">مركز التنبيهات</div><div class="v">${alerts.length?alerts.length+" تنبيه":"لا توجد مشاكل"}</div><div class="sub">${alerts.length?alerts.slice(0,3).map(x=>esc(x.title)).join(" · "):"الوضع الحالي طبيعي"}</div></div>
</div>`}
function renderInfra(){const s=DATA.infra?.server||{},o=DATA.operations||{},containers=o.containers||[],dom=DATA.infra?.domains||{};$("infra").innerHTML=`
<div class="title"><h2>البنية التحتية</h2><span>${esc(s.provider)} · ${esc(s.host)}</span></div>
<div class="grid">
<div class="card"><div class="k">RAM</div><div class="v">${num(s.memoryPercent)}%</div><div class="bar"><i style="width:${pct(s.memoryPercent)}%"></i></div></div>
<div class="card"><div class="k">Disk</div><div class="v">${num(s.diskPercent)}%</div><div class="bar"><i style="width:${pct(s.diskPercent)}%"></i></div></div>
<div class="card"><div class="k">Load 1m</div><div class="v">${esc(s.load1)}</div><div class="sub">IP <span class="code">${esc(s.publicIp)}</span></div></div>
<div class="card"><div class="k">Nginx</div><div class="v">${esc(o.nginx)}</div><div class="sub">Bot ${esc(o.bot)} · API ${esc(o.controlCenter)}</div></div>
<div class="card wide"><div class="k">Domains</div><div class="v">${dom.items?.length||0}</div><div class="sub">${(dom.items||[]).map(x=>(x.ssl?"🔒 ":"⚪️ ")+esc(x.domain)).join(" · ")||"—"}</div></div>
<div class="card wide"><div class="k">Database</div><div class="v">${esc(DATA.databaseStats?.database)}</div><div class="sub">${esc(DATA.databaseStats?.size)} · ${esc(DATA.databaseStats?.connections)} اتصال · ${esc(DATA.databaseStats?.publicTables)} جدول</div></div>
</div>
<div class="title"><h2>الحاويات</h2><span>${containers.length}</span></div>
<div class="list">${containers.map(c=>`<div class="row"><div class="rowTop"><span>${c.healthy===true?"🟢":c.healthy===false?"🔴":"⚪️"}</span><strong class="code">${esc(c.name)}</strong><span class="pill">${esc(c.status)}</span></div><div class="meta">${esc(c.image)}</div></div>`).join("")||'<div class="empty">لا توجد حاويات.</div>'}</div>`}
let projectFilter="all";
function renderProjects(){const all=DATA.managedProjects||[],rows=projectFilter==="all"?all:all.filter(x=>x.type===projectFilter);$("projects").innerHTML=`
<div class="title"><h2>خريطة المشاريع</h2><span>${rows.length} من ${all.length}</span></div>
<div class="projectFilters"><button data-f="all" class="${projectFilter==="all"?"active":""}">الكل</button><button data-f="app" class="${projectFilter==="app"?"active":""}">📱 تطبيقات</button><button data-f="website" class="${projectFilter==="website"?"active":""}">🌐 مواقع</button><button data-f="bot" class="${projectFilter==="bot"?"active":""}">🤖 بوتات</button><button data-f="bundle" class="${projectFilter==="bundle"?"active":""}">🧩 متكاملة</button></div>
<div class="list">${rows.map(p=>`<div class="row project" data-id="${esc(p.id)}"><div class="rowTop"><span>${li(p.liveStatus)}</span><strong>${esc(p.name)}</strong><span class="pill">${esc(p.type)}</span></div><div class="meta">الإصدار: <b>${esc(p.currentVersion||"—")}</b> · التحديثات: ${p.versions?.length||0}<br>العميل: ${esc(p.client||"—")} · الشهري: <span class="money">${esc(p.billing?.monthlyFee||0)} ${esc(p.billing?.currency||"USD")}</span></div><div class="projectDetails"><div class="meta">GitHub: <span class="code">${esc(p.repository||"غير مربوط")}</span><br>Domain: <span class="code">${esc(p.domain||"غير مربوط")}</span><br>Timer: <span class="code">${esc(p.expiresAt||"غير مفعّل")}</span><br>Runtime: ${(p.runtimeState||[]).map(x=>(x.active?"🟢 ":"🔴 ")+esc(x.name)).join(" · ")||"غير مربوط"}</div></div></div>`).join("")||'<div class="empty">لا توجد مشاريع في هذا القسم.</div>'}</div>`;
document.querySelectorAll(".projectFilters button").forEach(b=>b.onclick=()=>{projectFilter=b.dataset.f;renderProjects()});document.querySelectorAll(".project").forEach(r=>r.onclick=()=>r.classList.toggle("open"))}
function renderFinance(){const rows=DATA.managedProjects||[],alerts=DATA.billingAlerts||[];const groups={};rows.forEach(p=>{const b=p.billing||{},c=b.currency||"USD";groups[c]=(groups[c]||0)+Number(b.monthlyFee||0)});$("finance").innerHTML=`
<div class="title"><h2>الإيراد الشهري المسجل</h2><span>حسب العملة</span></div>
<div class="grid">${Object.entries(groups).map(([c,v])=>`<div class="card"><div class="k">${esc(c)}</div><div class="v money">${v.toFixed(2)}</div><div class="sub">إجمالي الاشتراكات</div></div>`).join("")||'<div class="card wide"><div class="sub">لم تسجل مبالغ شهرية بعد.</div></div>'}</div>
<div class="title"><h2>المستحقات</h2><span>${alerts.length}</span></div>
<div class="list">${alerts.map(x=>`<div class="row alert"><div class="rowTop"><span>🔴</span><strong>${esc(x.name)}</strong><span class="pill">${esc(x.currency)}</span></div><div class="meta">المبلغ: <b>${esc(x.monthlyFee)} ${esc(x.currency)}</b> · العميل: ${esc(x.client||"—")}<br>الاستحقاق: <span class="code">${esc(x.dueAt)}</span></div></div>`).join("")||'<div class="row okBox">✅ لا توجد مستحقات متأخرة حاليًا.</div>'}</div>`}
function renderActivity(){const audit=(DATA.audit||[]).slice().reverse(),alerts=DATA.alerts||[],backs=DATA.backups||[];$("activity").innerHTML=`
<div class="title"><h2>آخر النشاطات</h2><span>${audit.length}</span></div>
<div class="list">${audit.slice(0,30).map(x=>`<div class="row"><div class="rowTop"><span>•</span><strong>${esc(x.type)}</strong><span class="pill">${esc(x.source)}</span></div><div class="meta code">${esc(x.at)}<br>${esc(x.id)}</div></div>`).join("")||'<div class="empty">لا توجد أحداث بعد.</div>'}</div>
<div class="title"><h2>النسخ الاحتياطية</h2><span>${backs.length}</span></div>
<div class="list">${backs.slice(0,8).map(x=>`<div class="row"><div class="rowTop"><span>💾</span><strong class="code">${esc(x.name)}</strong><span class="pill">${(Number(x.size||0)/1024/1024).toFixed(2)} MB</span></div><div class="meta">${esc(x.createdAt)}</div></div>`).join("")||'<div class="empty">لا توجد نسخ.</div>'}</div>`}
function render(){renderHero();renderOverview();renderInfra();renderProjects();renderFinance();renderActivity()}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".section").forEach(x=>x.classList.toggle("active",x.id===b.dataset.tab))});
async function refresh(){try{DATA=await api("/dashboard");render();$("live").textContent="● مباشر";$("live").style.color="#72edb7"}catch(e){$("live").textContent="تعذر الاتصال";document.querySelector("main").innerHTML='<div class="row alert">تعذر تحميل الإحصائيات. افتح الواجهة من داخل البوت بحساب المدير.</div>'}}
refresh();setInterval(refresh,30000);
</script>
</body>
</html>
