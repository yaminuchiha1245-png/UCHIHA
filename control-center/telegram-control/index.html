<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<title>UCHIHA Control Center</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#050a0f;--panel:#0b141d;--panel2:#0f1b26;--line:#1f2d3a;--text:#f4f7fb;--muted:#8fa1b4;--red:#ed2748;--green:#20d78a;--amber:#ffbd3d;--blue:#55a7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#2c0812 0,transparent 25%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Kufi Arabic",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(6,12,18,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#ff3458,#781024);display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 0 28px rgba(237,39,72,.28)}
.headtext{flex:1}.headtext b{font-size:18px}.headtext small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em}
.live{font-size:12px;color:var(--green);border:1px solid rgba(32,215,138,.25);background:rgba(32,215,138,.08);padding:7px 10px;border-radius:999px}
.wrap{padding:14px 14px 90px;max-width:980px;margin:auto}
.hero{border:1px solid #38202a;background:linear-gradient(135deg,rgba(237,39,72,.16),rgba(9,20,29,.9));border-radius:22px;padding:18px;margin-bottom:14px;overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(237,39,72,.12);filter:blur(30px);left:-50px;top:-70px}.hero h1{margin:0 0 6px;font-size:22px}.hero p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:17px;padding:14px;min-height:100px}.card .k{color:var(--muted);font-size:12px}.card .v{font-size:22px;font-weight:800;margin-top:7px}.card .s{color:var(--muted);font-size:11px;margin-top:6px}.wide{grid-column:1/-1}
.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:13px;padding:10px 13px;font-weight:700}.tabs button.active{color:white;border-color:#7b2636;background:rgba(237,39,72,.14)}
.section{display:none}.section.active{display:block}.section-title{display:flex;align-items:center;justify-content:space-between;margin:10px 2px}.section-title h2{font-size:17px;margin:0}.section-title span{color:var(--muted);font-size:11px}
.list{display:flex;flex-direction:column;gap:8px}.row{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px}.rowtop{display:flex;align-items:center;gap:10px}.dot{width:10px;height:10px;border-radius:50%;background:#6f7d8a}.dot.good{background:var(--green);box-shadow:0 0 12px rgba(32,215,138,.7)}.dot.bad{background:#ff506d}.dot.warn{background:var(--amber)}.name{font-weight:800;flex:1}.meta{color:var(--muted);font-size:12px;line-height:1.8;margin-top:5px}.code{font-family:ui-monospace,SFMono-Regular,monospace;direction:ltr;unicode-bidi:embed}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#111f2a;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.progress{height:7px;background:#14212c;border-radius:9px;overflow:hidden;margin-top:8px}.progress i{height:100%;display:block;background:linear-gradient(90deg,var(--red),#ff6a81);border-radius:9px}
form{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select{width:100%;background:#061018;border:1px solid #263644;color:#fff;border-radius:12px;padding:12px;font:inherit;outline:none}.full{grid-column:1/-1}.btn{border:0;border-radius:12px;padding:12px 14px;background:linear-gradient(90deg,#f22b4b,#b51934);color:white;font-weight:800}.btn.secondary{background:#111d27;border:1px solid var(--line)}.btn.danger{background:#34101a;color:#ff8da1;border:1px solid #6d1a2c}.actions{display:flex;gap:8px;margin-top:10px}
.notice{padding:13px;border:1px solid #5d421e;background:#21190c;color:#ffc96a;border-radius:14px;font-size:12px;line-height:1.8;margin-bottom:12px}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
footer{position:fixed;bottom:0;right:0;left:0;background:rgba(5,10,15,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.error{margin:40px 18px;padding:18px;border:1px solid #6e2131;background:#210b11;border-radius:18px;color:#ffb1bf;line-height:1.8}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.wide{grid-column:span 2}.fields{grid-template-columns:1fr 1fr 2fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><div class="logo">う</div><div class="headtext"><b>UCHIHA</b><small>CONTROL CENTER · TELEGRAM</small></div><div class="live" id="live">● مباشر</div></header>
<main class="wrap" id="app">
<div class="hero"><h1>لوحة UCHIHA المركزية</h1><p>المشاريع، السيرفر، قاعدة البيانات، الدومينات، التقارير، الأسرار والموافقات من مصدر فعلي واحد.</p></div>
<div class="tabs" id="tabs">
<button class="active" data-tab="overview">الرئيسية</button><button data-tab="projects">المشاريع</button><button data-tab="github">GitHub</button><button data-tab="server">السيرفر</button><button data-tab="database">قاعدة البيانات</button><button data-tab="domains">الدومينات</button><button data-tab="reports">التقارير</button><button data-tab="operations">العمليات</button><button data-tab="backups">النسخ</button><button data-tab="alerts">التنبيهات</button><button data-tab="secrets">الأسرار</button><button data-tab="approvals">الموافقات</button><button data-tab="audit">السجل</button>
</div>
<section class="section active" id="overview"></section>
<section class="section" id="projects"></section>
<section class="section" id="github"></section>
<section class="section" id="server"></section>
<section class="section" id="database"></section>
<section class="section" id="domains"></section>
<section class="section" id="reports"></section>
<section class="section" id="operations"></section>
<section class="section" id="backups"></section>
<section class="section" id="alerts"></section>
<section class="section" id="secrets"></section>
<section class="section" id="approvals"></section>
<section class="section" id="audit"></section>
</main>
<footer><span id="updated">لم تتم المزامنة بعد</span><span>UCHIHA · Real data only</span></footer>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#071018");tg.setBackgroundColor("#050a0f")}catch{}}
const initData=tg?.initData||"";
const $=id=>document.getElementById(id), esc=s=>String(s??"—").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let DATA=null;
function dot(v){v=String(v||"").toLowerCase();return v==="healthy"||v==="connected"||v==="ok"?"good":v==="unhealthy"||v==="failed"||v==="down"?"bad":v==="degraded"||v==="running"?"warn":""}
function pct(v){v=Number(v);return Number.isFinite(v)?Math.max(0,Math.min(100,v)):0}
async function api(path,opt={}){const h={"X-Telegram-Init-Data":initData,...(opt.headers||{})};if(opt.body)h["Content-Type"]="application/json";const r=await fetch("/api/telegram-control"+path,{...opt,headers:h,cache:"no-store"});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"request_failed");return j}
function empty(t){return '<div class="empty">'+esc(t)+'</div>'}
function show(tab){document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));$(tab).classList.add("active")}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>show(b.dataset.tab));
function renderOverview(){const x=DATA.infra||{},s=x.server||{},d=x.database||{},dom=x.domains||{},h=x.history||{};$("overview").innerHTML=`
<div class="grid">
<div class="card"><div class="k">حالة VPS</div><div class="v"><span class="dot ${dot(s.health)}"></span> ${esc(s.health)}</div><div class="s">${esc(s.provider)} · ${esc(s.host)}</div></div>
<div class="card"><div class="k">RAM</div><div class="v">${esc(s.memoryPercent)}%</div><div class="progress"><i style="width:${pct(s.memoryPercent)}%"></i></div></div>
<div class="card"><div class="k">التخزين</div><div class="v">${esc(s.diskPercent)}%</div><div class="progress"><i style="width:${pct(s.diskPercent)}%"></i></div></div>
<div class="card"><div class="k">الحاويات</div><div class="v">${esc(s.containersRunning)}</div><div class="s">Healthy: ${esc(s.containersHealthy)} · Unchecked: ${esc(s.containersUnchecked)}</div></div>
<div class="card"><div class="k">المشاريع</div><div class="v">${DATA.projects?.length||0}</div><div class="s">مسجلة فعليًا</div></div>
<div class="card"><div class="k">قاعدة البيانات</div><div class="v">${esc(d.engine||"—")}</div><div class="s">${esc(d.name)} · ${esc(d.health)}</div></div>
<div class="card"><div class="k">الدومينات</div><div class="v">${dom.items?.length||0}</div><div class="s">${esc(dom.provider)} · API ${dom.apiManaged?"ON":"OFF"}</div></div>
<div class="card"><div class="k">الأسرار</div><div class="v">${(DATA.secrets||[]).reduce((a,x)=>a+(x.count||0),0)}</div><div class="s">المفاتيح محفوظة كقيم مخفية</div></div>
<div class="card wide"><div class="k">التقارير</div><div class="v">${esc(h.sampleCount||0)} عينة</div><div class="s">بدأ الجمع: ${esc(h.startedAt)}</div></div>
<div class="card wide"><div class="k">Load 1m</div><div class="v">${esc(s.load1)}</div><div class="s">Public IP: <span class="code">${esc(s.publicIp)}</span></div></div>
</div>`}
function renderProjects(){const rows=DATA.projects||[];$("projects").innerHTML='<div class="section-title"><h2>المشاريع الفعلية</h2><span>'+rows.length+'</span></div><div class="list">'+(rows.length?rows.map(p=>`<div class="row"><div class="rowtop"><span class="dot ${dot(p.status)}"></span><div class="name">${esc(p.name)}</div><span class="pill">${esc(p.environment)}</span></div><div class="meta">ID: <span class="code">${esc(p.id)}</span><br>الحالة: ${esc(p.statusLabel||p.status)} · Health: ${esc(p.healthScore)}<br>الدومين: <span class="code">${esc(p.domain)}</span><br>السيرفر: ${esc(p.server)} · الإصدار: ${esc(p.release)} · آخر نشر: ${esc(p.lastDeploy)}</div></div>`).join(""):empty("لا توجد مشاريع مسجلة."))+'</div>'}
function renderGithub(){const g=DATA.github||{},rows=g.repositories||[];$("github").innerHTML=`<div class="section-title"><h2>GitHub</h2><span>${esc(g.account)}</span></div><div class="notice">القائمة أدناه من حساب GitHub الحقيقي المتزامن، بدون مستودعات وهمية.</div><div class="grid"><div class="card"><div class="k">المستودعات</div><div class="v">${rows.length}</div></div><div class="card"><div class="k">آخر مزامنة</div><div class="s code">${esc(g.syncedAt)}</div></div></div><div class="section-title"><h2>المستودعات</h2><span>${rows.length}</span></div><div class="list">${rows.map(r=>`<div class="row"><div class="rowtop"><div class="name">${esc(r.name)}</div><span class="pill">branch ${esc(r.defaultBranch)}</span></div><div class="meta code">${esc(r.fullName)}</div></div>`).join("")||empty("لا توجد مستودعات متزامنة.")}</div>`}
function renderServer(){const s=DATA.infra?.server||{};const rows=s.containers||[];$("server").innerHTML=`<div class="section-title"><h2>Hostfiley VPS</h2><span>${esc(s.host)}</span></div><div class="grid"><div class="card"><div class="k">الحالة</div><div class="v">${esc(s.health)}</div><div class="s">Health ${esc(s.healthPercent)}%</div></div><div class="card"><div class="k">RAM</div><div class="v">${esc(s.memoryPercent)}%</div></div><div class="card"><div class="k">Disk</div><div class="v">${esc(s.diskPercent)}%</div></div><div class="card"><div class="k">Load</div><div class="v">${esc(s.load1)}</div></div></div><div class="section-title"><h2>الحاويات</h2><span>${rows.length}</span></div><div class="list">${rows.map(c=>`<div class="row"><div class="rowtop"><span class="dot ${c.healthy===true?"good":c.healthy===false?"bad":""}"></span><div class="name code">${esc(c.name)}</div><span class="pill">${c.healthChecked?"Health Check":"No Check"}</span></div><div class="meta">${esc(c.image)}<br>${esc(c.status)}</div></div>`).join("")||empty("لا توجد حاويات.")}</div>`}
function renderDb(){const d=DATA.infra?.database||{};$("database").innerHTML=`<div class="section-title"><h2>قاعدة البيانات</h2><span>${d.connected?"متصلة":"غير متصلة"}</span></div><div class="grid"><div class="card"><div class="k">Engine</div><div class="v">${esc(d.engine)}</div><div class="s">v${esc(d.version)}</div></div><div class="card"><div class="k">الحالة</div><div class="v">${esc(d.health)}</div></div><div class="card wide"><div class="k">Database</div><div class="v code">${esc(d.name)}</div><div class="s">${esc(d.service)} · ${esc(d.container)}</div></div></div>`}
function renderDomains(){const d=DATA.infra?.domains||{};let rows=d.items||[];$("domains").innerHTML=`<div class="section-title"><h2>الدومينات وDNS</h2><span>${esc(d.provider)}</span></div><div class="grid"><div class="card"><div class="k">Root</div><div class="v code" style="font-size:15px">${esc(d.rootDomain)}</div></div><div class="card"><div class="k">DNS API</div><div class="v">${d.apiManaged?"مفعل":"غير مفعل"}</div></div><div class="card wide"><div class="k">Nameservers</div><div class="s code">${(d.nameservers||[]).map(esc).join("<br>")||"—"}</div></div></div><div class="section-title"><h2>المواقع المكتشفة</h2><span>${rows.length}</span></div><div class="list">${rows.map(x=>`<div class="row"><div class="rowtop"><span class="dot ${x.ssl?"good":""}"></span><div class="name code">${esc(x.domain)}</div><span class="pill">${x.ssl?"SSL":"No SSL"}</span></div><div class="meta">${esc(x.role)} · المصدر: ${esc(x.source)}</div></div>`).join("")||empty("لا توجد دومينات مكتشفة.")}</div><div class="section-title"><h2>إعادة التوجيه الفعلية</h2><span>${d.redirects?.length||0}</span></div><div class="list">${(d.redirects||[]).map(x=>`<div class="row"><div class="name">${esc(x.code)} Redirect</div><div class="meta code">${esc(x.from)} → ${esc(x.to)}</div></div>`).join("")||empty("لا توجد Redirects.")}</div>`}
function renderReports(){const h=DATA.infra?.history||{},s=DATA.infra?.server||{};const daily=h.daily||[];$("reports").innerHTML=`<div class="section-title"><h2>تقارير حقيقية</h2><span>${esc(h.sampleCount||0)} عينة</span></div><div class="notice">يتم جمع عينة فعلية كل 5 دقائق. لا يتم إنشاء أيام أو نسب للماضي إذا لم توجد قياسات فعلية.</div><div class="grid"><div class="card"><div class="k">Health</div><div class="v">${esc(s.healthPercent)}%</div></div><div class="card"><div class="k">RAM</div><div class="v">${esc(s.memoryPercent)}%</div></div><div class="card"><div class="k">Disk</div><div class="v">${esc(s.diskPercent)}%</div></div><div class="card"><div class="k">Load</div><div class="v">${esc(s.load1)}</div></div></div><div class="section-title"><h2>التاريخ المتاح</h2><span>حتى 30 يوم</span></div><div class="list">${daily.slice().reverse().map(d=>`<div class="row"><div class="rowtop"><div class="name code">${esc(d.date)}</div><span class="pill">${esc(d.samples)} samples</span></div><div class="meta">Health ${esc(d.healthPercent)}% · RAM ${esc(d.memoryPercent)}% · Disk ${esc(d.diskPercent)}% · Load ${esc(d.load1)}</div></div>`).join("")||empty("بدأ جمع التاريخ الآن؛ لا توجد أيام سابقة مصطنعة.")}</div>`}
function renderOperations(){const o=DATA.operations||{},rows=o.containers||[];$("operations").innerHTML=`<div class="section-title"><h2>مركز العمليات</h2><span>تحكم مباشر</span></div><div class="notice">كل عملية حساسة تحتاج تأكيدًا. لا يوجد Terminal حر داخل البوت؛ العمليات محددة ومحمية.</div><div class="grid"><div class="card"><div class="k">Nginx</div><div class="v">${esc(o.nginx)}</div><div class="actions"><button class="btn secondary" onclick="reloadNginx()">Reload</button></div></div><div class="card"><div class="k">Control API</div><div class="v">${esc(o.controlCenter)}</div></div><div class="card"><div class="k">Telegram Bot</div><div class="v">${esc(o.bot)}</div></div><div class="card"><div class="k">قياسات السيرفر</div><div class="actions"><button class="btn" onclick="refreshInfra()">تحديث الآن</button></div></div></div><div class="section-title"><h2>الحاويات</h2><span>${rows.length}</span></div><div class="list">${rows.map(c=>`<div class="row"><div class="rowtop"><span class="dot ${c.healthy===true?"good":c.healthy===false?"bad":""}"></span><div class="name code">${esc(c.name)}</div></div><div class="meta">${esc(c.image)}<br>${esc(c.status)}</div><div class="actions"><button class="btn secondary" onclick="showLogs('${String(c.name).replace(/'/g,"\\'")}')">📜 Logs</button><button class="btn danger" onclick="restartContainer('${String(c.name).replace(/'/g,"\\'")}')">🔄 Restart</button></div></div>`).join("")||empty("لا توجد حاويات.")}</div>`}
async function refreshInfra(){try{await api("/ops/refresh",{method:"POST",body:"{}"});await refresh();show("operations");tg?.HapticFeedback?.notificationOccurred("success")}catch(e){alert("فشل التحديث: "+e.message)}}
async function reloadNginx(){if(!confirm("تأكيد Reload Nginx؟"))return;try{await api("/ops/reload-nginx",{method:"POST",body:JSON.stringify({confirm:"RELOAD"})});await refresh();show("operations")}catch(e){alert("فشل Reload: "+e.message)}}
async function restartContainer(name){if(!confirm("إعادة تشغيل "+name+"؟ قد تنقطع الخدمة لثوانٍ."))return;try{await api("/ops/restart-container",{method:"POST",body:JSON.stringify({name,confirm:"RESTART"})});await refresh();show("operations");tg?.HapticFeedback?.notificationOccurred("success")}catch(e){alert("فشل Restart: "+e.message)}}
async function showLogs(name){try{const r=await api("/logs/"+encodeURIComponent(name));const text=(r.item?.lines||"لا توجد سجلات.");const w=window.open("","_blank");if(w){w.document.write('<meta name="viewport" content="width=device-width"><body style="background:#050a0f;color:#d8e1ea;font-family:monospace;white-space:pre-wrap;padding:16px;direction:ltr">'+esc(text)+'</body>')}else{alert(text.slice(-2500))}}catch(e){alert("تعذر قراءة السجل: "+e.message)}}
function renderBackups(){const rows=DATA.backups||[],d=DATA.databaseStats||{};$("backups").innerHTML=`<div class="section-title"><h2>النسخ الاحتياطية</h2><span>${rows.length}</span></div><div class="grid"><div class="card"><div class="k">قاعدة البيانات</div><div class="v code" style="font-size:16px">${esc(d.database)}</div><div class="s">${esc(d.size)}</div></div><div class="card"><div class="k">الاتصالات</div><div class="v">${esc(d.connections)}</div></div><div class="card"><div class="k">الجداول</div><div class="v">${esc(d.publicTables)}</div></div><div class="card"><div class="k">إجراء</div><div class="actions"><button class="btn" onclick="createBackup()">نسخة الآن</button></div></div></div><div class="section-title"><h2>النسخ الموجودة</h2><span>على VPS</span></div><div class="list">${rows.map(x=>`<div class="row"><div class="rowtop"><div class="name code">${esc(x.name)}</div><span class="pill">${(Number(x.size||0)/1024/1024).toFixed(2)} MB</span></div><div class="meta">${esc(x.createdAt)}</div><div class="actions"><button class="btn danger" onclick="deleteBackup('${String(x.name).replace(/'/g,"\\'")}')">حذف</button></div></div>`).join("")||empty("لا توجد نسخ احتياطية بعد.")}</div>`}
async function createBackup(){if(!confirm("إنشاء نسخة PostgreSQL الآن؟"))return;try{await api("/backups/create",{method:"POST",body:JSON.stringify({confirm:"BACKUP"})});await refresh();show("backups");tg?.HapticFeedback?.notificationOccurred("success")}catch(e){alert("فشل النسخ: "+e.message)}}
async function deleteBackup(name){if(!confirm("حذف النسخة "+name+" نهائيًا؟"))return;try{await api("/backups/delete",{method:"POST",body:JSON.stringify({name,confirm:"DELETE"})});await refresh();show("backups")}catch(e){alert("فشل الحذف: "+e.message)}}
function renderAlerts(){const rows=DATA.alerts||[];$("alerts").innerHTML=`<div class="section-title"><h2>التنبيهات الحالية</h2><span>${rows.length}</span></div><div class="notice">تُرسل التنبيهات تلقائيًا إلى حساب المدير فقط عند ظهور مشكلة جديدة أو عند استعادة الحالة الطبيعية.</div><div class="list">${rows.map(x=>`<div class="row"><div class="rowtop"><span class="dot ${x.level==="critical"?"bad":"warn"}"></span><div class="name">${esc(x.title)}</div><span class="pill">${esc(x.level)}</span></div><div class="meta">${esc(x.detail)}<br><span class="code">${esc(x.code)}</span></div></div>`).join("")||empty("✅ لا توجد تنبيهات نشطة حاليًا.")}</div>`}
function renderSecrets(){const rows=DATA.secrets||[],projects=DATA.projects||[];$("secrets").innerHTML=`<div class="section-title"><h2>أسرار المشاريع</h2><span>Write-only</span></div><div class="notice">لأمانك لا يتم إرجاع قيمة السر بعد الحفظ، ولا تظهر في رسائل Telegram. ترى اسم المفتاح فقط ويمكنك استبداله أو حذفه.</div><form id="secretForm"><div class="fields"><select id="secretProject"><option value="">اختر المشروع</option>${projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select><input id="secretKey" placeholder="BOT_TOKEN / API_KEY"><input class="full" id="secretValue" type="password" placeholder="القيمة السرية الجديدة"></div><div class="actions"><button class="btn" type="submit">حفظ / استبدال</button></div></form><div class="list" id="secretList">${rows.map(r=>`<div class="row"><div class="name">${esc(r.projectId)}</div><div class="meta">${r.keys?.length?r.keys.map(k=>`<div style="display:flex;gap:8px;align-items:center;margin-top:7px"><span class="code" style="flex:1">${esc(k)} = •••••••• ✅</span><button class="btn danger" type="button" onclick="removeSecret('${String(r.projectId).replace(/'/g,"\\'")}','${String(k).replace(/'/g,"\\'")}')">حذف</button></div>`).join(""):"لا مفاتيح"}</div></div>`).join("")||empty("لا توجد أسرار محفوظة على الخادم.")}</div>`;$("secretForm").onsubmit=saveSecret}
async function saveSecret(ev){ev.preventDefault();const projectId=$("secretProject").value,key=$("secretKey").value.trim(),value=$("secretValue").value;if(!projectId||!key||!value)return alert("أكمل المشروع واسم المفتاح والقيمة.");try{await api("/secrets/put",{method:"POST",body:JSON.stringify({projectId,key,value})});$("secretValue").value="";await refresh();show("secrets");tg?.HapticFeedback?.notificationOccurred("success")}catch(e){alert("تعذر الحفظ: "+e.message)}}
async function removeSecret(projectId,key){if(!confirm("حذف "+key+"؟"))return;try{await api("/secrets/delete",{method:"POST",body:JSON.stringify({projectId,key})});await refresh();show("secrets")}catch(e){alert("تعذر الحذف: "+e.message)}}
function renderApprovals(){const rows=DATA.approvals||[];$("approvals").innerHTML='<div class="section-title"><h2>الموافقات</h2><span>'+rows.length+'</span></div><div class="list">'+(rows.slice().reverse().map(x=>`<div class="row"><div class="rowtop"><span class="dot ${dot(x.status)}"></span><div class="name">${esc(x.title)}</div><span class="pill">${esc(x.status)}</span></div><div class="meta">الإجراء: ${esc(x.action)} · المشروع: ${esc(x.project)}<br>${esc(x.detail)}<br>${esc(x.createdAt)}</div></div>`).join("")||empty("لا توجد موافقات."))+'</div>'}
function renderAudit(){const rows=DATA.audit||[];$("audit").innerHTML='<div class="section-title"><h2>سجل التدقيق</h2><span>'+rows.length+'</span></div><div class="list">'+(rows.slice().reverse().map(x=>`<div class="row"><div class="rowtop"><div class="name">${esc(x.type)}</div><span class="pill">${esc(x.source)}</span></div><div class="meta code">${esc(x.at)}<br>${esc(x.id)}</div></div>`).join("")||empty("لا توجد أحداث."))+'</div>'}
function render(){renderOverview();renderProjects();renderGithub();renderServer();renderDb();renderDomains();renderReports();renderOperations();renderBackups();renderAlerts();renderSecrets();renderApprovals();renderAudit();$("updated").textContent="آخر مزامنة: "+new Date(DATA.infra?.generatedAt||Date.now()).toLocaleString("ar")}
async function refresh(){try{DATA=await api("/dashboard");render();$("live").textContent="● مباشر";$("live").style.color="var(--green)"}catch(e){$("app").innerHTML='<div class="error"><b>تعذر فتح لوحة UCHIHA</b><br>يجب فتح هذه الصفحة من البوت وبحساب مدير معتمد.<br><span class="code">'+esc(e.message)+'</span></div>';$("live").textContent="غير مصرح";$("live").style.color="#ff7288"}}
refresh();setInterval(()=>{if(DATA)refresh()},30000);
</script>
</body></html>
