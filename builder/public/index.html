/* ===== UCHIHA UI POLISH v3 ===== */
:root{
  --header-bg:linear-gradient(180deg,rgba(28,22,29,.98),rgba(17,22,30,.98));
  --nav-bg:rgba(16,21,29,.96);
  --shadow-soft:0 8px 22px rgba(0,0,0,.16);
  --shadow-card:0 10px 28px rgba(0,0,0,.20);
}
[data-theme="light"]{
  --header-bg:linear-gradient(180deg,#fff,#f7f9fc);
  --nav-bg:rgba(255,255,255,.97);
  --shadow-soft:0 6px 18px rgba(35,47,64,.07);
  --shadow-card:0 9px 24px rgba(35,47,64,.09);
}
html{background:var(--bg)}
body{line-height:1.45}
button{touch-action:manipulation}
button,.cat,.serviceRow,.payCard,.simpleRow,.quick,.iconbtn,.homeNav span{transition:transform .16s ease,background-color .2s ease,border-color .2s ease,box-shadow .2s ease,opacity .2s ease}

/* top bar */
header{
  height:64px;flex-basis:64px;padding:0 14px;gap:8px;
  background:var(--header-bg);border-bottom:1px solid color-mix(in srgb,var(--red) 20%,var(--border));
  box-shadow:0 5px 18px rgba(0,0,0,.10);
}
header:after{content:"";position:absolute;left:18px;right:18px;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:.42;pointer-events:none}
.iconbtn,.bell{position:relative;overflow:hidden}
.iconbtn{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#171d29,#101723);border:1px solid #273041;box-shadow:0 8px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.04)}
.iconbtn.menu{border-color:#ff64764d;background:linear-gradient(145deg,#33131c,#151b25);color:#fff;box-shadow:0 8px 22px rgba(225,59,77,.18),inset 0 1px 0 rgba(255,255,255,.07)}
.iconbtn.menu:before,.bell:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.iconbtn.menu:before{background:linear-gradient(180deg,rgba(255,109,129,.14),transparent 62%)}
.loginBtn{height:38px;padding:0 7px;font-size:12px;color:var(--text);opacity:.92}
.brand b{font-size:18px}.brand small{font-size:7.5px;letter-spacing:2.1px}
.pageTitle{font-size:14.5px;max-width:220px}
.bell{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:linear-gradient(145deg,color-mix(in srgb,var(--surface2) 94%,#fff 6%),var(--surface));border:1px solid color-mix(in srgb,var(--red) 28%,var(--border));color:color-mix(in srgb,var(--text) 88%,var(--red) 12%);box-shadow:0 7px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.05)}
.bell:before{background:radial-gradient(circle at 72% 18%,rgba(225,59,77,.16),transparent 58%)}
.bell:focus-visible{outline:2px solid color-mix(in srgb,var(--red) 72%,#fff);outline-offset:2px}
.iconbtn:active,.bell:active{transform:scale(.96)}

/* page rhythm */
main{padding-bottom:calc(86px + env(safe-area-inset-bottom));scroll-behavior:smooth}
.page{min-height:100%;padding-top:1px}
.hero{margin:14px 14px 0;height:170px;border-radius:20px;box-shadow:var(--shadow-card);border-color:#ffffff12}
.slide{padding:20px}.slideCopy{width:72%}.slideCopy small{font-size:9px;margin-bottom:8px}.slideCopy b{font-size:19px;line-height:1.38}.slideCopy span{font-size:11px;line-height:1.65;margin-top:7px}
.slideArt i{width:68px;height:68px;border-radius:19px}.slideArt svg{width:34px}
.dots{display:none!important}.dot{display:none!important}.dot.on{display:none!important}
.searchTrigger,.searchBox{margin:13px 14px;height:49px;border-radius:15px;padding:0 14px;background:color-mix(in srgb,var(--surface) 94%,var(--red) 6%);box-shadow:0 5px 16px rgba(0,0,0,.07)}
.searchTrigger span{font-size:12px}.searchBox input{font-size:12px}.searchBox button{width:30px;height:30px;border-radius:9px}

.section{padding:0 14px 19px}.sectionTitle{margin-bottom:12px}.sectionTitle small{font-size:9px}.sectionTitle h2{font-size:16px}.sectionTitle button{font-size:10px;padding:7px 0}

/* category cards */
.grid{gap:10px}
.cat{min-height:126px;padding:13px 6px 10px;border-radius:17px;box-shadow:var(--shadow-soft);border-color:color-mix(in srgb,var(--border) 86%,var(--c) 14%)}

.cat:after{height:3px;width:38px}
.quick{min-height:72px;border-radius:17px;padding:11px 13px;box-shadow:var(--shadow-soft)}
.quickIcon{width:45px;height:45px;border-radius:14px}.quick small{font-size:9px}.quick b{font-size:12px}

/* inner pages */
.categoryHero{margin:14px 14px 19px;padding:19px;min-height:154px;border-radius:20px;box-shadow:var(--shadow-soft)}

.serviceList{gap:9px}.serviceRow{min-height:84px;padding:11px;border-radius:16px;box-shadow:var(--shadow-soft)}.serviceRow:hover{border-color:color-mix(in srgb,var(--c) 34%,var(--border))}.serviceRow:active{transform:scale(.985)}

.detailVisual{margin:14px 14px 0;height:180px;border-radius:20px;box-shadow:var(--shadow-soft)}
.detail{padding:18px 14px 26px}.badge{font-size:8px}.detail h1{font-size:21px}.detail>p{font-size:11px;line-height:1.8}.meta{gap:9px}.meta>div{min-height:68px}.meta small{font-size:8px}.meta b{font-size:10.5px}.features{border-radius:16px}.features h2{font-size:12.5px}.features div{font-size:10px}.btn{min-height:50px;border-radius:15px;font-size:11.5px;box-shadow:0 9px 22px #e13b4d28}

/* repeated rows / cards */

function integrationReadinessPage(){var configured=integrationConfiguredCount(),total=INTEGRATION_DEFS.length,ready=INTEGRATION_DEFS.filter(function(d){return integrationStatusFor(d.key).state==='ready'}).length,demo=total-configured;var items=INTEGRATION_DEFS.map(function(d){var st=integrationStatusFor(d.key),cls=st.state==='fail'?'fail':integrationValue(d.key)?'ready':'demo',label=st.state==='fail'?'خطأ':integrationValue(d.key)?'مضبوط':'DEMO';return '<div class="integrationItem"><span>'+icon(d.icon)+'</span><div><b>'+escapeHtml(d.label)+'</b><small>'+escapeHtml(d.desc)+'</small><small>'+escapeHtml(integrationValue(d.key)||'لم يتم إدخال Endpoint بعد')+'</small></div><em class="integrationBadge '+cls+'">'+label+'</em></div>'}).join('');var fields=INTEGRATION_DEFS.map(function(d){return '<label class="integrationField"><span>'+escapeHtml(d.label)+'</span><input id="integration_'+d.key+'" value="'+escapeHtml(integrationValue(d.key))+'" placeholder="'+(d.key==='apiBaseUrl'?'https://api.example.com':'/api/...')+'"><small>'+escapeHtml(d.desc)+'</small></label>'}).join('');var logs=(state.integrationLogs||[]).slice(0,8).map(function(l){return '<div class="integrationLogRow"><b>'+escapeHtml(l.message||l.kind)+'</b><small>'+escapeHtml(formatStamp(l.time))+' · '+escapeHtml(l.status||'info')+'</small></div>'}).join('');setMain('<div class="integrationPage"><section class="integrationHero"><small>V31 · PRODUCTION BRIDGE</small><h1>جاهزية الربط الحقيقي</h1><p>هذه الصفحة لا تخزن أي مفاتيح سرية. هي فقط لتجهيز عناوين الـ Backend واختبار الانتقال من المحاكاة إلى الخدمات الحقيقية.</p><div class="integrationSummary"><div class="ready"><small>Endpoints مضبوطة</small><b>'+configured+' / '+total+'</b></div><div><small>اختبارات ناجحة</small><b>'+ready+'</b></div><div class="demo"><small>ما زال DEMO</small><b>'+demo+'</b></div></div></section><section class="integrationCard"><h2>حالة التكاملات</h2><p>عند إدخال رابط حقيقي تبدأ الوظائف المدعومة باستخدام الـ Backend بدل fallback التجريبي.</p function slideTo(index){
 var el=document.getElementById('slides');if(!el)return;
 if(typeof state.slideTrack!=='number')state.slideTrack=1;
 var nextTrack;
 if(index>2&&state.slide===2)nextTrack=4;
 else if(index<0&&state.slide===0)nextTrack=0;
 else nextTrack=((index+3)%3)+1;
 state.slideTrack=nextTrack;
 state.slide=((nextTrack-1)+3)%3;
 el.style.transition='transform .48s cubic-bezier(.2,.75,.22,1)';
 el.style.transform='translate3d(-'+(nextTrack*100)+'%,0,0)';
}
function snapSlide(track){
 var el=document.getElementById('slides');if(!el)return;
 state.slideTrack=track;
 state.slide=((track-1)+3)%3;
 el.style.transition='none';
 el.style.transform='translate3d(-'+(track*100)+'%,0,0)';
 el.offsetHeight;
 el.style.transition='transform .48s cubic-bezier(.2,.75,.22,1)';
}
function startSlides(){
 clearInterval(state.timer);state.slide=0;state.slideTrack=1;snapSlide(1);
 var hero=document.querySelector('.hero'),slides=document.getElementById('slides'),sx=0,sy=0;
 if(slides){
  slides.ontransitionend=function(){
   if(state.slideTrack===4)snapSlide(1);
   else if(state.slideTrack===0)snapSlide(3);
  };
 }
 if(hero&&!hero.dataset.swipeReady){
  hero.dataset.swipeReady='1';
  hero.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
  hero.addEventListener('touchend',function(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.25){slideTo(state.slide+(dx<0?1:-1));restartSlides()}},{passive:true});
 }
 state.timer=setInterval(function(){if(view().page==='home')slideTo(state.slide+1)},5000)
}
function restartSlides(){clearInterval(state.timer);state.timer=setInterval(function(){if(view().page==='home')slideTo(state.slide+1)},5000)}
